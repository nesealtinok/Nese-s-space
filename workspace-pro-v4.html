<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#appFrame{width:100%;height:100%;border:0;display:block}#toggle{position:fixed;top:14px;left:258px;z-index:999999;width:36px;height:36px;border:1px solid #cdd3da;border-radius:9px;background:#fff;color:#a31f34;font-size:20px;cursor:pointer;box-shadow:0 4px 14px #10182020;transition:left .2s}</style></head><body><iframe id="appFrame" src="workspace-pro-v2.html?v=stable-base"></iframe><button id="toggle" title="Hide sidebar">‹</button><script>
const outer=document.getElementById('appFrame'),toggle=document.getElementById('toggle');let hidden=localStorage.getItem('nese-sidebar-hidden-v4')==='1';function getDoc(){const v=outer.contentDocument;if(!v)return null;const inner=v.getElementById('appFrame');return inner?inner.contentDocument:null}function applyHidden(d){d.body.classList.toggle('v4-hidden',hidden);toggle.textContent=hidden?'›':'‹';toggle.title=hidden?'Show sidebar':'Hide sidebar';toggle.style.left=hidden?'14px':'258px'}toggle.onclick=()=>{hidden=!hidden;localStorage.setItem('nese-sidebar-hidden-v4',hidden?'1':'0');const d=getDoc();if(d)applyHidden(d)};const S=[['Mathematics','📐'],['Science','🧪'],['Physics','⚛️'],['Chemistry','⚗️'],['Biology','🧬'],['Computer Science','💻'],['English','📚']];const KEY='nese-notebook-subjects-inside-v5',OLD='nese-notebook-persistent-v1';function loadStore(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||{active:'Mathematics',data:{}}}catch(e){return{active:'Mathematics',data:{}}}}function saveStore(x){localStorage.setItem(KEY,JSON.stringify(x))}function ensureSubject(x,name){if(!x.data[name]){let base=null;try{base=JSON.parse(localStorage.getItem(OLD)||'null')}catch(e){}x.data[name]=base&&name==='Mathematics'?base:{pages:[{name:'Page 1',type:'lined',image:null}],active:0}}return x.data[name]}function install(){const d=getDoc();if(!d||!d.body)return false;if(!d.getElementById('v4style')){const s=d.createElement('style');s.id='v4style';s.textContent=`body.v4-hidden .app{grid-template-columns:1fr!important}.app{transition:grid-template-columns .22s ease}.v4-hidden .side{display:none!important}.v4-hidden .main{max-width:none!important;width:100%!important;padding-left:48px!important;padding-right:48px!important}.v4-hidden .nb{width:100%!important}.v4-hidden .nb-canvas{height:760px!important}.nb-subject-inside{padding:10px 12px;border-bottom:1px solid #e4e7eb;background:#fafafa}.nb-subject-title{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#697586;margin-bottom:7px}.nb-subject-row{display:flex;gap:6px;overflow:auto}.nb-subject-row button{flex:0 0 auto;border:1px solid #d7dce2;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;color:#101820;font-size:12px}.nb-subject-row button.active{background:#a31f34;color:#fff;border-color:#a31f34}.nb-subject-row button span{margin-right:5px}.nb-subject-row button.active span{filter:grayscale(1) brightness(4)}`;d.head.appendChild(s)}applyHidden(d);const nb=d.getElementById('nb'),mount=d.getElementById('nbmount');if(!nb||!mount)return true;attachSubjects(d,mount);return true}
function attachSubjects(d,mount){let host=mount.querySelector('.nb-subject-inside');if(!host){host=d.createElement('div');host.className='nb-subject-inside';host.innerHTML='<div class="nb-subject-title">Notebook subjects</div><div class="nb-subject-row"></div>';mount.prepend(host)}const x=loadStore(),row=host.querySelector('.nb-subject-row');row.innerHTML='';S.forEach(([name,icon])=>{const b=d.createElement('button');b.className=name===x.active?'active':'';b.innerHTML='<span>'+icon+'</span>'+name;b.onclick=()=>switchSubject(d,name);row.appendChild(b)});if(!mount.__subjectObserver){const ob=new MutationObserver(()=>{if(!mount.querySelector('.nb-subject-inside'))attachSubjects(d,mount)});ob.observe(mount,{childList:true});mount.__subjectObserver=ob}}
function switchSubject(d,name){const x=loadStore();let current;try{current=JSON.parse(localStorage.getItem(OLD)||'null')}catch(e){}if(current)x.data[x.active]=current;x.active=name;const next=ensureSubject(x,name);saveStore(x);localStorage.setItem(OLD,JSON.stringify(next));try{d.defaultView.showBook(d.defaultView,d)}catch(e){}setTimeout(()=>{const m=d.getElementById('nbmount');if(m)attachSubjects(d,m)},80)}
outer.addEventListener('load',()=>{setTimeout(install,300);setTimeout(install,900);setTimeout(install,1800)});setInterval(install,700);</script></body></html>
