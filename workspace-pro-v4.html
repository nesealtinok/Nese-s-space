<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#appFrame{width:100%;height:100%;border:0;display:block}#toggle{position:fixed;top:14px;left:258px;z-index:999999;width:36px;height:36px;border:1px solid #cdd3da;border-radius:9px;background:#fff;color:#a31f34;font-size:20px;cursor:pointer;box-shadow:0 4px 14px #10182020;transition:left .2s}</style></head><body><iframe id="appFrame" src="workspace-pro-v2.html?v=stable-base"></iframe><button id="toggle" title="Hide sidebar">‹</button><script>
const outer=document.getElementById('appFrame'),toggle=document.getElementById('toggle');let hidden=localStorage.getItem('nese-sidebar-hidden-v4')==='1';
function getDoc(){const v=outer.contentDocument;if(!v)return null;const inner=v.getElementById('appFrame');return inner?inner.contentDocument:null}
function install(){const d=getDoc();if(!d||!d.body)return false;if(!d.getElementById('v4style')){const s=d.createElement('style');s.id='v4style';s.textContent=`body.v4-hidden .app{grid-template-columns:1fr!important}.app{transition:grid-template-columns .22s ease}.v4-hidden .side{display:none!important}.v4-hidden .main{max-width:none!important;width:100%!important;padding-left:48px!important;padding-right:48px!important}.v4-hidden .nb{width:100%!important}.v4-hidden .nb-canvas{height:760px!important}.v4-subjects{margin-top:20px}.v4-subject-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.v4-subject{border:1px solid #dfe3e8;background:#fff;border-radius:10px;padding:13px;text-align:left;cursor:pointer}.v4-subject:hover,.v4-subject.active{border-color:#a31f34;background:#a31f340d}.v4-subject b{display:block;color:#101820;margin-top:5px}.v4-subject small{color:#697586}.v4-subject-editor{margin-top:14px;border:1px solid #dfe3e8;border-radius:12px;background:#fafafa;padding:14px}.v4-subject-editor textarea{width:100%;height:260px;box-sizing:border-box;margin:10px 0;border:1px solid #dfe3e8;border-radius:9px;padding:14px;resize:vertical;font:15px/1.6 Arial}.v4-subject-pages{display:flex;gap:6px;overflow:auto;margin:8px 0}.v4-page{border:1px solid #d7dce2;background:#fff;border-radius:7px;padding:7px 10px;white-space:nowrap;cursor:pointer}.v4-page.active{background:#101820;color:#fff}@media(max-width:900px){.v4-subject-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}`;d.head.appendChild(s)}applyHidden(d);const a=d.getElementById('academics');if(a&&a.classList.contains('active'))addSubjects(d);return true}
function applyHidden(d){d.body.classList.toggle('v4-hidden',hidden);toggle.textContent=hidden?'›':'‹';toggle.title=hidden?'Show sidebar':'Hide sidebar';toggle.style.left=hidden?'14px':'258px'}
toggle.onclick=()=>{hidden=!hidden;localStorage.setItem('nese-sidebar-hidden-v4',hidden?'1':'0');const d=getDoc();if(d)applyHidden(d)};
const S=[['Mathematics','📐'],['Science','🧪'],['Physics','⚛️'],['Chemistry','⚗️'],['Biology','🧬'],['Computer Science','💻'],['English','📚']];const KEY='nese-subject-notes-v4';function data(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}function put(x){localStorage.setItem(KEY,JSON.stringify(x))}
function addSubjects(d){const a=d.getElementById('academics');if(!a||d.getElementById('v4Subjects'))return;const nb=d.getElementById('nb');if(!nb)return;const host=d.createElement('div');host.id='v4Subjects';host.className='card s12 v4-subjects';host.innerHTML='<div class="ey">Notebook sections</div><h2>Subjects</h2><p class="muted">Each subject has its own permanent notebook pages.</p><div class="v4-subject-grid"></div><div class="v4-subject-editor"><b id="v4Title">Mathematics · Page 1</b><div class="v4-subject-pages" id="v4Pages"></div><textarea id="v4Text" placeholder="Start writing your notes here..."></textarea><button class="btn red" id="v4Save">✓ Save notes</button><button class="btn" id="v4New">＋ New page</button></div>';nb.appendChild(host);renderSubjects(d)}
function renderSubjects(d){const host=d.getElementById('v4Subjects');if(!host)return;const grid=host.querySelector('.v4-subject-grid'),pagesEl=host.querySelector('#v4Pages'),title=host.querySelector('#v4Title'),text=host.querySelector('#v4Text');let store=data();store.subjects=store.subjects||{};let active=store.active||'Mathematics';store.subjects[active]=store.subjects[active]||[{name:'Page 1',text:''}];let pi=store.pageIndex?.[active]??0;pi=Math.max(0,Math.min(pi,store.subjects[active].length-1));store.pageIndex=store.pageIndex||{};store.pageIndex[active]=pi;put(store);grid.innerHTML='';S.forEach(([name,icon])=>{const b=d.createElement('button');b.className='v4-subject'+(name===active?' active':'');b.innerHTML='<span style="font-size:20px">'+icon+'</span><b>'+name+'</b><small>'+store.subjects[name]?.length||0+' pages</small>';b.onclick=()=>{store.active=name;store.pageIndex=store.pageIndex||{};store.pageIndex[name]=store.pageIndex[name]??0;put(store);renderSubjects(d)};grid.appendChild(b)});const arr=store.subjects[active];pagesEl.innerHTML='';arr.forEach((p,i)=>{const b=d.createElement('button');b.className='v4-page'+(i===pi?' active':'');b.textContent=p.name;b.onclick=()=>{store.pageIndex[active]=i;put(store);renderSubjects(d)};pagesEl.appendChild(b)});title.textContent=active+' · '+arr[pi].name;text.value=arr[pi].text||'';host.querySelector('#v4Save').onclick=()=>{arr[pi].text=text.value;put(store);d.getElementById('status').textContent='Saved locally'};host.querySelector('#v4New').onclick=()=>{arr.push({name:'Page '+(arr.length+1),text:''});store.pageIndex[active]=arr.length-1;put(store);renderSubjects(d)}}
outer.addEventListener('load',()=>{setTimeout(install,300);setTimeout(install,1000);setTimeout(install,2000)});setInterval(()=>install(),700);</script></body></html>
