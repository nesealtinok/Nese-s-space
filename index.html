<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nese — MIT Workspace</title>
<style>
:root{--ink:#101820;--navy:#172b4d;--red:#a31f34;--red2:#c43b4d;--cream:#f7f5f0;--paper:#fff;--line:#d9dce2;--muted:#697386;--blue:#294f7d;--green:#287a57;--shadow:0 12px 35px rgba(16,24,32,.08);--r:16px}*{box-sizing:border-box}html{background:var(--cream)}body{margin:0;color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:var(--ink);color:#fff;padding:28px 18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:13px;padding:0 10px 30px;border-bottom:1px solid #ffffff1c}.mark{width:42px;height:42px;background:var(--red);display:grid;place-items:center;font-weight:900;font-size:20px}.brand b{display:block;font-size:15px}.brand small{color:#aeb8c6}.section{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#7e8998;margin:26px 10px 8px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b8c1ce;padding:12px 13px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:#ffffff12;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--red)}.ico{width:22px;text-align:center}.side-foot{position:absolute;left:28px;right:28px;bottom:24px;color:#778292;font-size:11px}.main{min-width:0;max-width:1500px;width:100%;padding:42px 46px 70px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:30px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}h1{font-size:38px;line-height:1.1;margin:4px 0 0;letter-spacing:-.035em}h2{font-size:24px;letter-spacing:-.02em;margin:0 0 7px}h3{font-size:17px;margin:0 0 7px}.muted{color:var(--muted)}.status{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;color:var(--muted);font-size:12px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:25px;box-shadow:var(--shadow)}.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}.hero{padding:34px;background:linear-gradient(135deg,#fff 0,#fff 62%,#f2e8e8 100%);border-top:5px solid var(--red)}.hero h2{font-size:30px;max-width:760px}.links{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:25px}.link{border:1px solid var(--line);background:#fff;text-align:left;padding:18px;border-radius:12px;min-height:105px;color:var(--ink);transition:.15s}.link:hover{transform:translateY(-2px);border-color:#aab2bd;box-shadow:var(--shadow)}.link b{display:block;font-size:15px}.link small{display:block;color:var(--muted);margin-top:6px}.metric{font-size:34px;font-weight:800;line-height:1}.progress{height:7px;background:#e8e9ed;border-radius:10px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:var(--red);border-radius:10px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #cfd3da;background:#fff;color:var(--ink);padding:9px 13px;border-radius:9px}.btn:hover{background:#f4f5f7}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.danger{color:var(--red);border-color:#ead1d5}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}input,textarea,select{width:100%;border:1px solid #cfd3da;background:#fff;color:var(--ink);padding:12px;border-radius:9px;outline:0}input:focus,textarea:focus,select:focus{border-color:#6682a4;box-shadow:0 0 0 3px #294f7d12}textarea{min-height:135px;resize:vertical}.list{display:grid;gap:9px;margin-top:15px}.item{border:1px solid #e1e3e7;padding:13px 14px;border-radius:10px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{display:inline-block;background:#edf1f5;color:#44556c;padding:4px 8px;border-radius:999px;font-size:11px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:75px;border:1px solid #e0e2e6;border-radius:8px;padding:8px;background:#fff}.day.today{border:2px solid var(--red)}.flash{min-height:280px;border:1px solid #d6d9df;border-radius:13px;background:#f8f8f7;display:grid;place-items:center;text-align:center;padding:30px;cursor:pointer}.flash strong{font-size:27px;letter-spacing:-.02em}.canvas-wrap{border:1px solid #d9dce2;border-radius:12px;overflow:hidden;background:#fff;touch-action:none}.canvas{display:block;width:100%;height:470px;touch-action:none}.codegrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.editor{font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:470px;background:#101820;color:#eef2f7;border-color:#101820}.preview{width:100%;height:470px;border:1px solid #d9dce2;border-radius:10px;background:#fff}.check{display:grid;gap:7px}.check label{border:1px solid #e2e4e8;padding:10px;border-radius:9px}.mobile{display:none}.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;display:none;box-shadow:var(--shadow)}
@media(max-width:1100px){.links{grid-template-columns:repeat(2,1fr)}.span-8,.span-6,.span-4,.span-3{grid-column:span 12}}
@media(max-width:760px){.app{display:block}.side{display:none}.main{padding:25px 16px 90px}.top{align-items:flex-start}.top h1,h1{font-size:30px}.grid{display:block}.card{margin-bottom:15px}.links,.two,.three,.codegrid{grid-template-columns:1fr}.mobile{position:fixed;z-index:20;display:flex;left:12px;right:12px;bottom:12px;background:#101820f2;padding:7px;border-radius:14px;justify-content:space-around}.mobile button{background:transparent;color:#fff;border:0;padding:8px;font-size:11px}.calendar{gap:3px}.day{min-height:48px;padding:5px;font-size:11px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><div class="mark">N</div><div><b>NESE WORKSPACE</b><small>MIT · Computer Science</small></div></div><div class="section">Workspace</div><nav class="nav" id="nav"></nav><div class="side-foot">A focused environment for learning, building and documenting.</div></aside><main class="main"><div class="top"><div><div class="eyebrow">Personal academic system</div><h1 id="title">My Space</h1></div><span class="status" id="saveState">Saved locally</span></div><section id="home" class="view active"></section><section id="academics" class="view"></section><section id="coding" class="view"></section><section id="projects" class="view"></section><section id="research" class="view"></section><section id="calendar" class="view"></section><section id="profile" class="view"></section></main></div><div class="mobile" id="mobileNav"></div><div class="toast" id="toast"></div>
<script>
const KEY='nese-mit-workspace-v3';let data=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('nese-mit-workspace-v2')||'null')||{tasks:[],notes:[],cards:[],projects:[],research:[],events:[],profile:{name:'Nese',goal:'MIT Computer Science'}};const views={home:'My Space',academics:'Academics',coding:'Code Lab',projects:'Projects',research:'Research',calendar:'Calendar',profile:'Profile'};
function save(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('saveState').textContent='Saved locally'}function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
function nav(){let icons={home:'⌂',academics:'▦',coding:'⌘',projects:'◆',research:'⌕',calendar:'□',profile:'○'};let h=Object.entries(views).map(([id,n])=>`<button data-go="${id}"><span class="ico">${icons[id]}</span>${n}</button>`).join('');document.getElementById('nav').innerHTML=h;document.getElementById('mobileNav').innerHTML=Object.entries(views).slice(0,5).map(([id,n])=>`<button data-go="${id}">${n.split(' ')[0]}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}function go(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('title').textContent=views[id];document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));render(id)}function render(id){({home,academics,coding,projects,research,calendar,profile}[id])()}
function home(){let done=data.tasks.filter(x=>x.done).length;document.getElementById('home').innerHTML=`<div class="grid"><div class="card hero span-12"><div class="eyebrow">MIT preparation · overview</div><h2>Build a body of work you are proud of.</h2><p class="muted">One calm, structured workspace for academics, software, projects and research.</p><div class="links"><button class="link" onclick="go('academics')"><b>Academics</b><small>Notes · Cornell · Flashcards · handwriting</small></button><button class="link" onclick="go('coding')"><b>Code Lab</b><small>Learn · build · run experiments</small></button><button class="link" onclick="go('projects')"><b>Projects</b><small>Ideas · progress · portfolio</small></button><button class="link" onclick="go('research')"><b>Research</b><small>Questions · sources · papers</small></button></div></div><div class="card span-4"><div class="muted">Projects</div><div class="metric">${data.projects.length}</div><div class="progress"><i style="width:${Math.min(100,data.projects.length*10)}%"></i></div></div><div class="card span-4"><div class="muted">Tasks completed</div><div class="metric">${done}/${data.tasks.length}</div><div class="progress"><i style="width:${data.tasks.length?done/data.tasks.length*100:0}%"></i></div></div><div class="card span-4"><div class="muted">Research entries</div><div class="metric">${data.research.length}</div><div class="progress"><i style="width:${Math.min(100,data.research.length*10)}%"></i></div></div><div class="card span-12"><h3>Today</h3><div class="three"><input id="taskInput" placeholder="What needs your attention?"><select id="taskArea"><option>Academics</option><option>Code</option><option>Project</option><option>Research</option></select><button class="btn red" onclick="addTask()">Add task</button></div><div class="list">${data.tasks.slice(-8).reverse().map((x)=>`<div class="item"><label><input style="width:auto" type="checkbox" ${x.done?'checked':''} onchange="toggleTask(${data.tasks.indexOf(x)})"> ${esc(x.text)}</label><span><span class="tag">${x.area}</span> <button class="btn danger" onclick="delTask(${data.tasks.indexOf(x)})">Delete</button></span></div>`).join('')}</div></div></div>`}function addTask(){let v=document.getElementById('taskInput').value.trim();if(!v)return;data.tasks.push({text:v,area:document.getElementById('taskArea').value,done:false});save();render('home')}function toggleTask(i){data.tasks[i].done=!data.tasks[i].done;save();render('home')}function delTask(i){data.tasks.splice(i,1);save();render('home')}
let flashIndex=0,flipped=false;function academics(){document.getElementById('academics').innerHTML=`<div class="grid"><div class="card span-8"><div class="eyebrow">Study system</div><h2>Cornell Notes</h2><p class="muted">A clean page for structured study notes.</p><div class="two"><input id="cnSubject" placeholder="Subject / chapter"><input id="cnSummary" placeholder="Summary"><textarea id="cnCue" placeholder="Cues / questions"></textarea><textarea id="cnBody" placeholder="Main notes"></textarea></div><div class="toolbar"><button class="btn primary" onclick="addCornell()">Save note</button></div><div class="list">${data.notes.map((n,i)=>`<div class="item"><div><b>${esc(n.subject)}</b><small class="muted"><br>${esc(n.summary)}</small></div><button class="btn danger" onclick="delNote(${i})">Delete</button></div>`).join('')}</div></div><div class="card span-4"><h2>Flashcards</h2><div class="flash" id="flash" onclick="flipCard()"><div><strong>${data.cards.length?esc(data.cards[flashIndex%data.cards.length].q):'No cards yet'}</strong><p class="muted">${data.cards.length?'Tap to reveal':'Create one below'}</p></div></div><div class="toolbar"><button class="btn" onclick="nextCard()">Next card</button></div><div class="two"><input id="fq" placeholder="Question"><input id="fa" placeholder="Answer"></div><div class="toolbar"><button class="btn red" onclick="addCard()">Add flashcard</button></div></div><div class="card span-12"><div class="eyebrow">Apple Pencil ready</div><h2>Handwritten notes</h2><p class="muted">Write directly with Apple Pencil, finger or mouse.</p><div class="canvas-wrap"><canvas id="noteCanvas" class="canvas"></canvas></div><div class="toolbar"><button class="btn" onclick="clearCanvas()">Clear</button><button class="btn" onclick="downloadCanvas()">Export PNG</button></div></div></div>`;initCanvas()}
function flipCard(){if(!data.cards.length)return;flipped=!flipped;document.getElementById('flash').querySelector('strong').textContent=esc(flipped?data.cards[flashIndex%data.cards.length].a:data.cards[flashIndex%data.cards.length].q)}function nextCard(){if(data.cards.length){flashIndex=(flashIndex+1)%data.cards.length;flipped=false;render('academics')}}function addCard(){let q=document.getElementById('fq').value.trim(),a=document.getElementById('fa').value.trim();if(q&&a){data.cards.push({q,a});save();render('academics')}}function delCard(i){data.cards.splice(i,1);save();render('academics')}function addCornell(){let s=document.getElementById('cnSubject').value.trim();if(!s)return;data.notes.push({subject:s,summary:document.getElementById('cnSummary').value,cue:document.getElementById('cnCue').value,body:document.getElementById('cnBody').value});save();render('academics')}function delNote(i){data.notes.splice(i,1);save();render('academics')}
let canvas,ctx,drawing=false;function initCanvas(){canvas=document.getElementById('noteCanvas');if(!canvas)return;let dpr=devicePixelRatio||1,w=canvas.clientWidth;canvas.width=w*dpr;canvas.height=470*dpr;ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle='#101820';let pos=e=>{let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};canvas.onpointerdown=e=>{drawing=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drawing)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false}function clearCanvas(){ctx&&ctx.clearRect(0,0,canvas.width,canvas.height)}function downloadCanvas(){let a=document.createElement('a');a.download='nese-note.png';a.href=canvas.toDataURL();a.click()}
function coding(){document.getElementById('coding').innerHTML=`<div class="grid"><div class="card span-12"><div class="eyebrow">Build studio</div><h2>Code Lab</h2><p class="muted">Write HTML/CSS/JavaScript and see the result instantly.</p><div class="codegrid"><textarea id="code" class="editor"><!doctype html>\n<html>\n<body style="font-family:system-ui;padding:40px">\n<h1>Hello, Nese.</h1>\n<p>Build something.</p>\n</body>\n</html></textarea><iframe id="preview" class="preview" sandbox="allow-scripts"></iframe></div><div class="toolbar"><button class="btn red" onclick="runCode()">Run code</button><button class="btn" onclick="resetCode()">Reset</button></div></div><div class="card span-6"><h2>Learning path</h2><div class="list">${['Python fundamentals','Git & GitHub','HTML + CSS','JavaScript','Data structures','Java / C++'].map((x,i)=>`<div class="item"><span>${i+1}. ${x}</span><span class="tag">Focus</span></div>`).join('')}</div></div><div class="card span-6"><h2>Code journal</h2><textarea id="codeJournal" placeholder="What did you learn? What did you build? What confused you?"></textarea><div class="toolbar"><button class="btn primary" onclick="saveCodeJournal()">Save journal</button></div></div></div>`;runCode();document.getElementById('codeJournal').value=localStorage.getItem('code-journal')||''}function runCode(){document.getElementById('preview').srcdoc=document.getElementById('code').value}function resetCode(){document.getElementById('code').value='<!doctype html>\n<html>\n<body style="font-family:system-ui;padding:40px">\n<h1>Hello, Nese.</h1>\n<p>Build something.</p>\n</body>\n</html>';runCode()}function saveCodeJournal(){localStorage.setItem('code-journal',document.getElementById('codeJournal').value);toast('Journal saved')}
function projects(){document.getElementById('projects').innerHTML=`<div class="grid"><div class="card span-8"><div class="eyebrow">Portfolio</div><h2>Projects</h2><p class="muted">Document what you build, not just what you study.</p><div class="two"><input id="pname" placeholder="Project name"><select id="pstage"><option>Idea</option><option>Building</option><option>Testing</option><option>Live</option></select></div><br><textarea id="pdesc" placeholder="Problem · solution · technology · what you learned"></textarea><div class="toolbar"><button class="btn red" onclick="addProject()">Add project</button></div><div class="list">${data.projects.map((p,i)=>`<div class="item"><div><b>${esc(p.name)}</b><small class="muted"><br>${esc(p.desc)}</small></div><span><span class="tag">${p.stage}</span> <button class="btn danger" onclick="delProject(${i})">Delete</button></span></div>`).join('')}</div></div><div class="card span-4"><h2>Project checklist</h2><div class="check">${['Problem statement','Research','Prototype','Code','Testing','Documentation','Demo'].map(x=>`<label><input style="width:auto" type="checkbox"> ${x}</label>`).join('')}</div></div></div>`}function addProject(){let n=document.getElementById('pname').value.trim();if(!n)return;data.projects.push({name:n,stage:document.getElementById('pstage').value,desc:document.getElementById('pdesc').value});save();render('projects')}function delProject(i){data.projects.splice(i,1);save();render('projects')}
function research(){document.getElementById('research').innerHTML=`<div class="grid"><div class="card span-8"><div class="eyebrow">Knowledge base</div><h2>Research Database</h2><p class="muted">Capture questions, sources, findings and reflections.</p><div class="two"><input id="rq" placeholder="Research question"><input id="rt" placeholder="Topic / tag"></div><br><textarea id="rs" placeholder="Source · finding · method · link · reflection"></textarea><div class="toolbar"><button class="btn red" onclick="addResearch()">Save research entry</button></div><div class="list">${data.research.map((r,i)=>`<div class="item"><div><b>${esc(r.q)}</b> <span class="tag">${esc(r.t)}</span><small class="muted"><br>${esc(r.s)}</small></div><button class="btn danger" onclick="delResearch(${i})">Delete</button></div>`).join('')}</div></div><div class="card span-4"><h2>Workflow</h2><div class="list">${['Question','Literature search','Source evaluation','Method','Analysis','Conclusion','Paper','Showcase'].map((x,i)=>`<div class="item"><span>${i+1}. ${x}</span></div>`).join('')}</div></div></div>`}function addResearch(){let q=document.getElementById('rq').value.trim();if(!q)return;data.research.push({q,t:document.getElementById('rt').value,s:document.getElementById('rs').value});save();render('research')}function delResearch(i){data.research.splice(i,1);save();render('research')}
function calendar(){let now=new Date(),days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];document.getElementById('calendar').innerHTML=`<div class="grid"><div class="card span-12"><h2>${now.toLocaleString('en',{month:'long'})} ${now.getFullYear()}</h2><div class="calendar">${days.map(d=>`<div class="day"><b>${d}</b></div>`).join('')}${Array.from({length:new Date(now.getFullYear(),now.getMonth()+1,0).getDate()},(_,i)=>`<div class="day ${i+1===now.getDate()?'today':''}"><b>${i+1}</b></div>`).join('')}</div></div><div class="card span-12"><h2>Schedule</h2><div class="three"><input id="ed" type="date"><input id="en" placeholder="Event"><button class="btn red" onclick="addEvent()">Add event</button></div><div class="list">${data.events.map((e,i)=>`<div class="item"><span><b>${e.date}</b> — ${esc(e.name)}</span><button class="btn danger" onclick="data.events.splice(${i},1);save();render('calendar')">Delete</button></div>`).join('')}</div></div></div>`}function addEvent(){let d=document.getElementById('ed').value,n=document.getElementById('en').value.trim();if(d&&n){data.events.push({date:d,name:n});save();render('calendar')}}
function profile(){document.getElementById('profile').innerHTML=`<div class="grid"><div class="card span-6"><div class="eyebrow">Identity</div><h2>My Profile</h2><p class="muted">Customize the workspace around your direction.</p><label>Name</label><input id="profName" value="${esc(data.profile.name)}"><br><br><label>Current goal</label><input id="profGoal" value="${esc(data.profile.goal)}"><div class="toolbar"><button class="btn red" onclick="saveProfile()">Save profile</button></div></div><div class="card span-6"><div class="eyebrow">Direction</div><h2>MIT narrative</h2><div class="list"><div class="item">Academic strength</div><div class="item">Software & technology</div><div class="item">Building real projects</div><div class="item">Research curiosity</div><div class="item">Leadership & initiative</div></div></div></div>`}function saveProfile(){data.profile.name=document.getElementById('profName').value;data.profile.goal=document.getElementById('profGoal').value;save();toast('Profile saved')}
nav();go('home');
</script></body></html>
