<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace</title><style>:root{--n:#101820;--r:#a31f34;--bg:#f5f4f1;--c:#fff;--l:#e0e2e6;--m:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--n);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--n);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;padding:5px 10px 24px;border-bottom:1px solid #ffffff18}.logo{width:40px;height:40px;background:var(--r);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#9eabbc;font-size:11px}.label{margin:24px 10px 8px;color:#77879b;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em}.nav{display:grid;gap:3px}.nav button{border:0;background:none;color:#aeb9c7;padding:11px 12px;border-radius:9px;text-align:left}.nav button.active,.nav button:hover{background:#ffffff10;color:#fff;box-shadow:inset 3px 0 var(--r)}.main{padding:34px 44px 70px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;margin-bottom:28px}.ey{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--r)}h1{font-size:36px;letter-spacing:-.04em;margin:4px 0}h2{font-size:22px;margin:0 0 6px}.muted{color:var(--m)}.status{font-size:11px;border:1px solid var(--l);background:#fff;padding:7px 11px;border-radius:20px;color:var(--m)}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:24px;box-shadow:0 8px 30px #1018200b}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.hero{border-top:4px solid var(--r);padding:32px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.quick button,.lesson{border:1px solid var(--l);background:#fff;border-radius:10px;padding:15px;text-align:left}.quick button:hover,.lesson:hover{border-color:#a31f34}.quick span{display:block;color:var(--m);font-size:12px}.metric{font-size:32px;font-weight:800}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #ccd1d8;background:#fff;border-radius:8px;padding:9px 13px}.red{background:var(--r);color:#fff;border-color:var(--r)}input,textarea,select{width:100%;border:1px solid #ccd1d8;border-radius:8px;padding:11px 12px;background:#fff;color:var(--n)}textarea{min-height:130px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.list{display:grid;gap:8px;margin-top:14px}.item{border:1px solid var(--l);border-radius:9px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{background:#eef1f5;color:#506177;padding:3px 8px;border-radius:20px;font-size:10px}.flash{height:240px;background:#f8f8f6;border:1px solid var(--l);border-radius:12px;display:grid;place-items:center;text-align:center;padding:25px;cursor:pointer}.flash strong{font-size:25px}.canvasbox{border:1px solid var(--l);border-radius:11px;overflow:hidden;touch-action:none}.canvas{display:block;width:100%;height:430px;touch-action:none}.code{display:grid;grid-template-columns:1fr 1fr;gap:14px}.editor{min-height:460px;background:#111a24;color:#e9eef5;font:13px/1.6 monospace}.preview{height:460px;width:100%;border:1px solid var(--l);border-radius:9px;background:#fff}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.subnav button{border:1px solid var(--l);background:#fff;border-radius:20px;padding:8px 12px}.resources a{color:#315b87;text-decoration:none}.check input{width:auto}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:70px;border:1px solid var(--l);border-radius:8px;padding:7px;background:#fff}.today{border:2px solid var(--r)}@media(max-width:1050px){.quick{grid-template-columns:1fr 1fr}.s8,.s6,.s4{grid-column:span 12}}@media(max-width:720px){.app{display:block}.side{display:none}.main{padding:24px 15px 85px}.grid{display:block}.card{margin-bottom:14px}.quick,.two,.three,.code{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">N</div><div><b>NESE WORKSPACE</b><small>MIT · Computer Science</small></div></div><div class="label">Workspace</div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="top"><div><div class="ey">Personal academic system</div><h1 id="title">My Space</h1></div><span id="status" class="status">Saved locally</span></header><section id="home" class="view active"></section><section id="academics" class="view"></section><section id="coding" class="view"></section><section id="projects" class="view"></section><section id="research" class="view"></section><section id="calendar" class="view"></section><section id="profile" class="view"></section></main></div><script>const KEY='nese-workspace-v4',d=JSON.parse(localStorage.getItem(KEY)||'null')||{tasks:[],notes:[],cards:[],projects:[],research:[],events:[],profile:{name:'Nese',goal:'MIT Computer Science'}};let fi=0,flip=false;const V={home:'My Space',academics:'Academics',coding:'My Coding',projects:'Projects',research:'Research',calendar:'Calendar',profile:'Profile'},I={home:'⌂',academics:'▦',coding:'⌘',projects:'◆',research:'⌕',calendar:'□',profile:'○'},esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(d));status.textContent='Saved locally'}function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');title.textContent=V[id];document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===id));R[id]()}nav.innerHTML=Object.entries(V).map(([id,n])=>`<button data-go="${id}"><span style="display:inline-block;width:24px">${I[id]}</span>${n}</button>`).join('');document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));const R={};R.home=()=>{let done=d.tasks.filter(x=>x.done).length;home.innerHTML=`<div class="grid"><div class="card hero s12"><div class="ey">MIT preparation · overview</div><h2>Build a body of work you are proud of.</h2><p class="muted">Academic, coding, projects and research in one professional workspace.</p><div class="quick"><button onclick="go('academics')"><b>Academics</b><span>Cornell · flashcards · handwriting</span></button><button onclick="go('coding')"><b>My Coding</b><span>Personal Python curriculum</span></button><button onclick="go('projects')"><b>Projects</b><span>Portfolio · progress · evidence</span></button><button onclick="go('research')"><b>Research</b><span>Questions · sources · findings</span></button></div></div><div class="card s4"><span class="muted">Projects</span><div class="metric">${d.projects.length}</div></div><div class="card s4"><span class="muted">Tasks completed</span><div class="metric">${done}/${d.tasks.length}</div></div><div class="card s4"><span class="muted">Research</span><div class="metric">${d.research.length}</div></div><div class="card s12"><h2>Today</h2><div class="three"><input id="task" placeholder="What needs your attention?"><select id="area"><option>Academics</option><option>Code</option><option>Project</option><option>Research</option></select><button class="btn red" onclick="addTask()">Add task</button></div><div class="list">${d.tasks.slice(-8).reverse().map(x=>{let i=d.tasks.indexOf(x);return`<div class="item"><label><input style="width:auto" type="checkbox" ${x.done?'checked':''} onchange="toggleTask(${i})"> ${esc(x.text)}</label><button class="btn" onclick="delTask(${i})">Delete</button></div>`}).join('')}</div></div></div>`};function addTask(){if(task.value.trim()){d.tasks.push({text:task.value,area:area.value,done:false});save();R.home()}}function toggleTask(i){d.tasks[i].done=!d.tasks[i].done;save();R.home()}function delTask(i){d.tasks.splice(i,1);save();R.home()}
R.academics=()=>{academics.innerHTML=`<div class="grid"><div class="card s8"><div class="ey">Study system</div><h2>Cornell Notes</h2><div class="two"><input id="sub" placeholder="Subject / chapter"><input id="sum" placeholder="Summary"><textarea id="cue" placeholder="Cues / questions"></textarea><textarea id="body" placeholder="Main notes"></textarea></div><div class="toolbar"><button class="btn red" onclick="note()">Save note</button></div><div class="list">${d.notes.map((n,i)=>`<div class="item"><span><b>${esc(n.subject)}</b><br><small>${esc(n.summary)}</small></span><button class="btn" onclick="d.notes.splice(${i},1);save();R.academics()">Delete</button></div>`).join('')}</div></div><div class="card s4"><h2>Flashcards</h2><div class="flash" onclick="flipCard()"><strong>${d.cards.length?esc(flip?d.cards[fi%d.cards.length].a:d.cards[fi%d.cards.length].q):'No cards yet'}</strong></div><div class="toolbar"><button class="btn" onclick="nextCard()">Next</button></div><div class="two"><input id="fq" placeholder="Question"><input id="fa" placeholder="Answer"></div><div class="toolbar"><button class="btn red" onclick="card()">Add card</button></div></div><div class="card s12"><div class="ey">Apple Pencil ready</div><h2>Handwritten Notes</h2><div class="canvasbox"><canvas id="cnv" class="canvas"></canvas></div><div class="toolbar"><button class="btn" onclick="clearC()">Clear</button><button class="btn" onclick="exportC()">Export PNG</button></div></div></div>`;initC()};function note(){if(sub.value.trim()){d.notes.push({subject:sub.value,summary:sum.value,cue:cue.value,body:body.value});save();R.academics()}}function card(){if(fq.value.trim()&&fa.value.trim()){d.cards.push({q:fq.value,a:fa.value});save();R.academics()}}function flipCard(){if(d.cards.length){flip=!flip;R.academics()}}function nextCard(){if(d.cards.length){fi=(fi+1)%d.cards.length;flip=false;R.academics()}}let c,ctx,down=false;function initC(){c=document.getElementById('cnv');if(!c)return;let z=devicePixelRatio||1;c.width=c.clientWidth*z;c.height=430*z;ctx=c.getContext('2d');ctx.scale(z,z);ctx.lineWidth=2;ctx.lineCap='round';let p=e=>{let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};c.onpointerdown=e=>{down=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(down){let q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke()}};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false}function clearC(){ctx&&ctx.clearRect(0,0,c.width,c.height)}function exportC(){let a=document.createElement('a');a.download='nese-note.png';a.href=c.toDataURL();a.click()}
R.coding=()=>{coding.innerHTML=`<div class="grid"><div class="card s12"><div class="ey">Personal coding hub</div><h2>My Coding</h2><p class="muted">Your own coding curriculum, separate from any club or school.</p><div class="subnav"><button onclick="document.getElementById('assign').scrollIntoView()">Assignments</button><button onclick="document.getElementById('res').scrollIntoView()">Resources</button><button onclick="document.getElementById('play').scrollIntoView()">Playground</button></div></div><div class="card s8"><div class="ey">H01 · 13 July 2026</div><h2>VSCode · if · for</h2><div class="list"><div class="lesson"><b>01 · VSCode</b><span class="tag">Foundation</span></div><div class="lesson"><b>02 · if</b><span class="tag">Python</span></div><div class="lesson"><b>03 · else / elif</b><span class="tag">Python</span></div><div class="lesson"><b>04 · Combining conditions</b><span class="tag">Python</span></div><div class="lesson"><b>05 · for</b><span class="tag">Python</span></div></div></div><div class="card s4"><h2>Progress</h2><p>${localStorage.getItem('coding-progress')||0}%</p><button class="btn red" onclick="let p=localStorage.getItem('coding-progress')==='100'?0:100;localStorage.setItem('coding-progress',p);R.coding()">Toggle complete</button></div><div id="assign" class="card s12"><div class="ey">Assignments & tasks</div><h2>Practice</h2><div class="list"><label class="lesson check"><input type="checkbox">01 — Print even numbers from 20 to 50.</label><label class="lesson check"><input type="checkbox">02 — Count backwards from 80 to 30 by 3.</label><label class="lesson check"><input type="checkbox">03 — Complete the drawing program and add your own idea.</label><label class="lesson check"><input type="checkbox">04 — Complete at least three if exercises.</label><label class="lesson check"><input type="checkbox">05 — Complete at least three for exercises.</label></div></div><div id="res" class="card s12 resources"><div class="ey">Course library</div><h2>Learning Resources</h2><div class="list"><div class="lesson"><b>VSCode presentation</b><a target="_blank" href="https://docs.google.com/presentation/d/189dcDqTT0VJd2StKQse-SVEDpyxACZSYH23rs2pj-VU">Open →</a></div><div class="lesson"><b>VSCode — MOOC</b><a target="_blank" href="https://programming-23.mooc.fi/part-4/1-vscode">Open →</a></div><div class="lesson"><b>if presentation</b><a target="_blank" href="https://docs.google.com/presentation/d/19WDRmJva4bAWlW9qppDk_3aCM1q3lOgJXIU7rR54kvk">Open →</a></div><div class="lesson"><b>Google Colab lesson notes</b><a target="_blank" href="https://colab.research.google.com/drive/1rK5C7eLUTHzfRU9QmvHVLXjNLMIdR0fS">Open →</a></div><div class="lesson"><b>Conditional statements</b><a target="_blank" href="https://programming-23.mooc.fi/part-1/5-conditional-statements">Open →</a></div><div class="lesson"><b>else / elif</b><a target="_blank" href="https://programming-23.mooc.fi/part-2/2-else-elif">Open →</a></div><div class="lesson"><b>Combining conditions</b><a target="_blank" href="https://programming-23.mooc.fi/part-2/3-combining-conditions">Open →</a></div><div class="lesson"><b>for presentation</b><a target="_blank" href="https://docs.google.com/presentation/d/1i0iUchAS5MeFHJn-sT3L4k1BSl2VWRb3rqEsd6MX6oA">Open →</a></div><div class="lesson"><b>Online lesson</b><a target="_blank" href="https://zoom.skyeducationacademy.com/rooms/qyx-fcu-qvv-ukf">Open →</a></div><div class="lesson"><b>⭐ Full Python course — Programming 23</b><a target="_blank" href="https://programming-23.mooc.fi/part-1">Start course →</a></div></div></div><div id="play" class="card s12"><div class="ey">Practice playground</div><h2>Write & experiment</h2><div class="code"><textarea id="editor" class="editor">print("Hello, Nese!")</textarea><iframe id="prev" class="preview" sandbox="allow-scripts"></iframe></div></div></div>`};R.projects=()=>{projects.innerHTML=`<div class="grid"><div class="card s8"><div class="ey">Portfolio</div><h2>Projects</h2><textarea id="pd" placeholder="Project name, problem, solution, technology, what you learned"></textarea><div class="toolbar"><button class="btn red" onclick="if(pd.value.trim()){d.projects.push({name:pd.value,stage:'Building',desc:pd.value});save();R.projects()}">Add project</button></div><div class="list">${d.projects.map((p,i)=>`<div class="item"><span><b>${esc(p.name)}</b><br><small>${esc(p.desc)}</small></span><button class="btn" onclick="d.projects.splice(${i},1);save();R.projects()">Delete</button></div>`).join('')}</div></div><div class="card s4"><h2>Checklist</h2><div class="list">${['Problem','Research','Prototype','Code','Testing','Documentation','Demo'].map(x=>`<label class="item check"><input type="checkbox">${x}</label>`).join('')}</div></div></div>`};R.research=()=>{research.innerHTML=`<div class="grid"><div class="card s8"><div class="ey">Knowledge base</div><h2>Research Database</h2><input id="rq" placeholder="Research question"><br><br><textarea id="rs" placeholder="Source · finding · method · reflection"></textarea><div class="toolbar"><button class="btn red" onclick="if(rq.value.trim()){d.research.push({q:rq.value,s:rs.value});save();R.research()}">Save entry</button></div><div class="list">${d.research.map((r,i)=>`<div class="item"><span><b>${esc(r.q)}</b><br>${esc(r.s)}</span><button class="btn" onclick="d.research.splice(${i},1);save();R.research()">Delete</button></div>`).join('')}</div></div><div class="card s4"><h2>Workflow</h2><div class="list">${['Question','Literature search','Source evaluation','Method','Analysis','Conclusion','Paper','Showcase'].map((x,i)=>`<div class="item">${i+1}. ${x}</div>`).join('')}</div></div></div>`};R.calendar=()=>{let n=new Date();calendar.innerHTML=`<div class="card"><h2>${n.toLocaleString('en',{month:'long'})} ${n.getFullYear()}</h2><div class="calendar">${Array.from({length:new Date(n.getFullYear(),n.getMonth()+1,0).getDate()},(_,i)=>`<div class="day ${i+1===n.getDate()?'today':''}">${i+1}</div>`).join('')}</div></div>`};R.profile=()=>{profile.innerHTML=`<div class="grid"><div class="card s6"><div class="ey">Identity</div><h2>My Profile</h2><input id="pn" value="${esc(d.profile.name)}"><br><br><input id="pg" value="${esc(d.profile.goal)}"><div class="toolbar"><button class="btn red" onclick="d.profile={name:pn.value,goal:pg.value};save()">Save profile</button></div></div><div class="card s6"><div class="ey">Direction</div><h2>MIT narrative</h2><div class="list">${['Academic strength','Software & technology','Building real projects','Research curiosity','Leadership & initiative'].map(x=>`<div class="item">${x}</div>`).join('')}</div></div></div>`};R.home();</script></body></html>
