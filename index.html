<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace</title><style>
:root{--navy:#101820;--navy2:#17283d;--red:#a31f34;--red2:#c43c50;--bg:#f5f4f1;--card:#fff;--line:#e0e2e6;--muted:#667085;--soft:#f0f2f5;--blue:#315b87;--shadow:0 8px 30px #1018200b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center;padding:5px 10px 24px;border-bottom:1px solid #fff1}.logo{width:40px;height:40px;background:var(--red);display:grid;place-items:center;font-weight:900}.brand strong{font-size:14px;letter-spacing:.04em}.brand small{display:block;color:#9eabbc;font-size:11px}.label{margin:24px 10px 8px;color:#77879b;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em}.nav{display:grid;gap:3px}.nav button{border:0;background:none;color:#aeb9c7;padding:11px 12px;border-radius:9px;text-align:left;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#fff10;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--red)}.icon{width:20px;text-align:center}.foot{position:absolute;bottom:20px;left:26px;right:26px;color:#6f7c8c;font-size:11px}.main{max-width:1500px;width:100%;padding:34px 44px 70px}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px}.eyebrow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--red)}h1{font-size:36px;letter-spacing:-.04em;margin:4px 0 0;line-height:1.1}h2{font-size:22px;letter-spacing:-.025em;margin:0 0 6px}h3{font-size:16px;margin:0 0 5px}.muted{color:var(--muted)}.status{font-size:11px;color:var(--muted);border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:20px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;box-shadow:var(--shadow)}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.hero{padding:32px;border-top:4px solid var(--red);background:linear-gradient(135deg,#fff,#f8f3f3)}.hero h2{font-size:29px;max-width:700px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}.quick button{background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;text-align:left;min-height:92px;transition:.15s}.quick button:hover{border-color:#9aa3ae;transform:translateY(-1px)}.quick b{display:block}.quick span{font-size:12px;color:var(--muted)}.metric{font-size:32px;font-weight:800}.bar{height:6px;background:#e9eaed;border-radius:9px;margin-top:11px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #ccd1d8;background:#fff;border-radius:8px;padding:9px 13px}.btn:hover{background:#f4f5f6}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.red{background:var(--red);color:#fff;border-color:var(--red)}.btn.delete{color:var(--red)}input,textarea,select{width:100%;border:1px solid #ccd1d8;border-radius:8px;padding:11px 12px;background:#fff;color:var(--navy);outline:none}input:focus,textarea:focus,select:focus{border-color:#58799c;box-shadow:0 0 0 3px #315b8714}textarea{min-height:130px;resize:vertical}.list{display:grid;gap:8px;margin-top:14px}.item{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{background:#eef1f5;color:#506177;padding:3px 8px;border-radius:20px;font-size:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.flash{height:250px;background:#f8f8f6;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;padding:28px;cursor:pointer}.flash strong{font-size:25px}.canvasbox{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;touch-action:none}.canvas{display:block;width:100%;height:430px;touch-action:none}.code{display:grid;grid-template-columns:1fr 1fr;gap:14px}.editor{min-height:460px;background:#111a24;color:#e9eef5;border-color:#111a24;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.preview{height:460px;width:100%;border:1px solid var(--line);border-radius:9px;background:#fff}.check{display:grid;gap:7px}.check label{border:1px solid var(--line);padding:9px;border-radius:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:70px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px;font-size:12px}.day.today{border:2px solid var(--red)}.mobile{display:none}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:11px 15px;border-radius:9px;display:none;box-shadow:var(--shadow)}
@media(max-width:1050px){.quick{grid-template-columns:repeat(2,1fr)}.s8,.s6,.s4{grid-column:span 12}}@media(max-width:720px){.app{display:block}.sidebar{display:none}.main{padding:24px 15px 85px}.top{align-items:flex-start}h1{font-size:30px}.grid{display:block}.card{margin-bottom:14px}.quick,.two,.three,.code{grid-template-columns:1fr}.mobile{display:flex;position:fixed;z-index:20;left:10px;right:10px;bottom:10px;background:#101820f5;border-radius:13px;padding:6px;justify-content:space-around}.mobile button{border:0;background:none;color:#fff;padding:7px;font-size:10px}.calendar{gap:3px}.day{min-height:48px;font-size:10px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">N</div><div><strong>NESE WORKSPACE</strong><small>MIT · Computer Science</small></div></div><div class="label">Workspace</div><nav id="nav" class="nav"></nav><div class="foot">A focused system for learning, building and documenting.</div></aside><main class="main"><header class="top"><div><div class="eyebrow">Personal academic system</div><h1 id="title">My Space</h1></div><span id="status" class="status">Saved locally</span></header><section id="home" class="view active"></section><section id="academics" class="view"></section><section id="coding" class="view"></section><section id="projects" class="view"></section><section id="research" class="view"></section><section id="calendar" class="view"></section><section id="profile" class="view"></section></main></div><div id="mobile" class="mobile"></div><div id="toast" class="toast"></div><script>
const KEY='nese-workspace-v4';let d=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('nese-mit-workspace-v3')||localStorage.getItem('nese-mit-workspace-v2')||'null')||{tasks:[],notes:[],cards:[],projects:[],research:[],events:[],profile:{name:'Nese',goal:'MIT Computer Science'}};const V={home:'My Space',academics:'Academics',coding:'Code Lab',projects:'Projects',research:'Research',calendar:'Calendar',profile:'Profile'};const I={home:'⌂',academics:'▦',coding:'⌘',projects:'◆',research:'⌕',calendar:'□',profile:'○'};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(d));document.getElementById('status').textContent='Saved locally'}function msg(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1500)}function nav(){let h=Object.entries(V).map(([id,n])=>`<button data-go="${id}"><span class="icon">${I[id]}</span>${n}</button>`).join('');navEl.innerHTML=h;mobile.innerHTML=Object.entries(V).slice(0,5).map(([id,n])=>`<button data-go="${id}">${n.split(' ')[0]}</button>`).join('');document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go))}function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');title.textContent=V[id];document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===id));R[id]()}const navEl=document.getElementById('nav'),mobile=document.getElementById('mobile'),title=document.getElementById('title'),R={};
R.home=()=>{let done=d.tasks.filter(x=>x.done).length;home.innerHTML=`<div class="grid"><div class="card hero s12"><div class="eyebrow">MIT preparation · overview</div><h2>Build a body of work you are proud of.</h2><p class="muted">Your academic, coding, project and research work — organized in one professional workspace.</p><div class="quick"><button onclick="go('academics')"><b>Academics</b><span>Notes · Cornell · Flashcards · handwriting</span></button><button onclick="go('coding')"><b>Code Lab</b><span>Learn · build · experiment</span></button><button onclick="go('projects')"><b>Projects</b><span>Portfolio · progress · evidence</span></button><button onclick="go('research')"><b>Research</b><span>Questions · sources · papers</span></button></div></div><div class="card s4"><span class="muted">Projects</span><div class="metric">${d.projects.length}</div><div class="bar"><i style="width:${Math.min(100,d.projects.length*10)}%"></i></div></div><div class="card s4"><span class="muted">Tasks completed</span><div class="metric">${done}/${d.tasks.length}</div><div class="bar"><i style="width:${d.tasks.length?done/d.tasks.length*100:0}%"></i></div></div><div class="card s4"><span class="muted">Research entries</span><div class="metric">${d.research.length}</div><div class="bar"><i style="width:${Math.min(100,d.research.length*10)}%"></i></div></div><div class="card s12"><h3>Today</h3><div class="three"><input id="task" placeholder="What needs your attention?"><select id="area"><option>Academics</option><option>Code</option><option>Project</option><option>Research</option></select><button class="btn red" onclick="addTask()">Add task</button></div><div class="list">${d.tasks.slice(-8).reverse().map(x=>{let i=d.tasks.indexOf(x);return`<div class="item"><label><input style="width:auto" type="checkbox" ${x.done?'checked':''} onchange="toggleTask(${i})"> ${esc(x.text)}</label><span><span class="tag">${x.area}</span> <button class="btn delete" onclick="delTask(${i})">Delete</button></span></div>`}).join('')}</div></div></div>`};function addTask(){let x=task.value.trim();if(x){d.tasks.push({text:x,area:area.value,done:false});save();R.home()}}function toggleTask(i){d.tasks[i].done=!d.tasks[i].done;save();R.home()}function delTask(i){d.tasks.splice(i,1);save();R.home()}
let fi=0,flip=false;R.academics=()=>{academics.innerHTML=`<div class="grid"><div class="card s8"><div class="eyebrow">Study system</div><h2>Cornell Notes</h2><p class="muted">Capture a subject, cues, main notes and a concise summary.</p><div class="two"><input id="sub" placeholder="Subject / chapter"><input id="sum" placeholder="Summary"><textarea id="cue" placeholder="Cues / questions"></textarea><textarea id="body" placeholder="Main notes"></textarea></div><div class="toolbar"><button class="btn primary" onclick="note()">Save note</button></div><div class="list">${d.notes.map((n,i)=>`<div class="item"><div><b>${esc(n.subject)}</b><small class="muted"><br>${esc(n.summary)}</small></div><button class="btn delete" onclick="d.notes.splice(${i},1);save();R.academics()">Delete</button></div>`).join('')}</div></div><div class="card s4"><h2>Flashcards</h2><div class="flash" onclick="flipCard()"><div><strong>${d.cards.length?esc(flip?d.cards[fi%d.cards.length].a:d.cards[fi%d.cards.length].q):'No cards yet'}</strong><p class="muted">${d.cards.length?'Tap to reveal':'Create your first card'}</p></div></div><div class="toolbar"><button class="btn" onclick="nextCard()">Next</button></div><div class="two"><input id="fq" placeholder="Question"><input id="fa" placeholder="Answer"></div><div class="toolbar"><button class="btn red" onclick="card()">Add card</button></div></div><div class="card s12"><div class="eyebrow">Apple Pencil ready</div><h2>Handwritten Notes</h2><p class="muted">Write with Apple Pencil, finger or mouse.</p><div class="canvasbox"><canvas id="cnv" class="canvas"></canvas></div><div class="toolbar"><button class="btn" onclick="clearC()">Clear</button><button class="btn" onclick="exportC()">Export PNG</button></div></div></div>`;initC()};function note(){if(sub.value.trim()){d.notes.push({subject:sub.value,summary:sum.value,cue:cue.value,body:body.value});save();R.academics()}}function card(){if(fq.value.trim()&&fa.value.trim()){d.cards.push({q:fq.value,a:fa.value});save();R.academics()}}function flipCard(){if(d.cards.length){flip=!flip;R.academics()}}function nextCard(){if(d.cards.length){fi=(fi+1)%d.cards.length;flip=false;R.academics()}}
let c,ctx,down=false;function initC(){c=document.getElementById('cnv');if(!c)return;let z=devicePixelRatio||1;c.width=c.clientWidth*z;c.height=430*z;ctx=c.getContext('2d');ctx.scale(z,z);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#101820';let p=e=>{let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};c.onpointerdown=e=>{down=true;let q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;let q=p(e);ctx.lineTo(q.x,q.y);ctx.stroke()};c.onpointerup=()=>down=false;c.onpointercancel=()=>down=false}function clearC(){ctx&&ctx.clearRect(0,0,c.width,c.height)}function exportC(){let a=document.createElement('a');a.download='nese-note.png';a.href=c.toDataURL();a.click()}
R.coding=()=>{coding.innerHTML=`<div class="grid"><div class="card s12"><div class="eyebrow">Build studio</div><h2>Code Lab</h2><p class="muted">Write HTML, CSS and JavaScript and preview it instantly.</p><div class="code"><textarea id="editor" class="editor"><!doctype html>\n<html>\n<body style="font-family:system-ui;padding:40px">\n<h1>Hello, Nese.</h1>\n<p>Build something.</p>\n</body>\n</html></textarea><iframe id="prev" class="preview" sandbox="allow-scripts"></iframe></div><div class="toolbar"><button class="btn red" onclick="run()">Run code</button><button class="btn" onclick="resetCode()">Reset</button></div></div><div class="card s6"><h2>Learning path</h2><div class="list">${['Python fundamentals','Git & GitHub','HTML + CSS','JavaScript','Data structures','Java / C++'].map((x,i)=>`<div class="item"><span>${i+1}. ${x}</span><span class="tag">Focus</span></div>`).join('')}</div></div><div class="card s6"><h2>Code journal</h2><textarea id="journal" placeholder="What did you learn? What did you build?"></textarea><div class="toolbar"><button class="btn primary" onclick="localStorage.setItem('code-journal',journal.value);msg('Journal saved')">Save journal</button></div></div></div>`;journal.value=localStorage.getItem('code-journal')||'';run()};function run(){prev.srcdoc=editor.value}function resetCode(){editor.value='<!doctype html>\n<html>\n<body style="font-family:system-ui;padding:40px">\n<h1>Hello, Nese.</h1>\n<p>Build something.</p>\n</body>\n</html>';run()}
R.projects=()=>{projects.innerHTML=`<div class="grid"><div class="card s8"><div class="eyebrow">Portfolio</div><h2>Projects</h2><p class="muted">Document what you build and how it evolves.</p><div class="two"><input id="pn" placeholder="Project name"><select id="ps"><option>Idea</option><option>Building</option><option>Testing</option><option>Live</option></select></div><br><textarea id="pd" placeholder="Problem · solution · technology · what you learned"></textarea><div class="toolbar"><button class="btn red" onclick="projectAdd()">Add project</button></div><div class="list">${d.projects.map((p,i)=>`<div class="item"><div><b>${esc(p.name)}</b><small class="muted"><br>${esc(p.desc)}</small></div><span><span class="tag">${p.stage}</span> <button class="btn delete" onclick="d.projects.splice(${i},1);save();R.projects()">Delete</button></span></div>`).join('')}</div></div><div class="card s4"><h2>Project checklist</h2><div class="check">${['Problem statement','Research','Prototype','Code','Testing','Documentation','Demo'].map(x=>`<label><input style="width:auto" type="checkbox"> ${x}</label>`).join('')}</div></div></div>`};function projectAdd(){if(pn.value.trim()){d.projects.push({name:pn.value,stage:ps.value,desc:pd.value});save();R.projects()}}
R.research=()=>{research.innerHTML=`<div class="grid"><div class="card s8"><div class="eyebrow">Knowledge base</div><h2>Research Database</h2><p class="muted">Keep questions, sources, findings and reflections together.</p><div class="two"><input id="rq" placeholder="Research question"><input id="rt" placeholder="Topic / tag"></div><br><textarea id="rs" placeholder="Source · finding · method · link · reflection"></textarea><div class="toolbar"><button class="btn red" onclick="researchAdd()">Save entry</button></div><div class="list">${d.research.map((r,i)=>`<div class="item"><div><b>${esc(r.q)}</b> <span class="tag">${esc(r.t)}</span><small class="muted"><br>${esc(r.s)}</small></div><button class="btn delete" onclick="d.research.splice(${i},1);save();R.research()">Delete</button></div>`).join('')}</div></div><div class="card s4"><h2>Workflow</h2><div class="list">${['Question','Literature search','Source evaluation','Method','Analysis','Conclusion','Paper','Showcase'].map((x,i)=>`<div class="item">${i+1}. ${x}</div>`).join('')}</div></div></div>`};function researchAdd(){if(rq.value.trim()){d.research.push({q:rq.value,t:rt.value,s:rs.value});save();R.research()}}
R.calendar=()=>{let n=new Date(),days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];calendar.innerHTML=`<div class="grid"><div class="card s12"><h2>${n.toLocaleString('en',{month:'long'})} ${n.getFullYear()}</h2><div class="calendar">${days.map(x=>`<div class="day"><b>${x}</b></div>`).join('')}${Array.from({length:new Date(n.getFullYear(),n.getMonth()+1,0).getDate()},(_,i)=>`<div class="day ${i+1===n.getDate()?'today':''}"><b>${i+1}</b></div>`).join('')}</div></div><div class="card s12"><h2>Schedule</h2><div class="three"><input id="ed" type="date"><input id="en" placeholder="Event"><button class="btn red" onclick="eventAdd()">Add event</button></div><div class="list">${d.events.map((e,i)=>`<div class="item"><b>${e.date}</b> — ${esc(e.name)}<button class="btn delete" onclick="d.events.splice(${i},1);save();R.calendar()">Delete</button></div>`).join('')}</div></div></div>`};function eventAdd(){if(ed.value&&en.value.trim()){d.events.push({date:ed.value,name:en.value});save();R.calendar()}}
R.profile=()=>{profile.innerHTML=`<div class="grid"><div class="card s6"><div class="eyebrow">Identity</div><h2>My Profile</h2><p class="muted">Customize the workspace around your direction.</p><input id="name" value="${esc(d.profile.name)}"><br><br><input id="goal" value="${esc(d.profile.goal)}"><div class="toolbar"><button class="btn red" onclick="d.profile={name:name.value,goal:goal.value};save();msg('Profile saved')">Save profile</button></div></div><div class="card s6"><div class="eyebrow">Direction</div><h2>MIT narrative</h2><div class="list"><div class="item">Academic strength</div><div class="item">Software & technology</div><div class="item">Building real projects</div><div class="item">Research curiosity</div><div class="item">Leadership & initiative</div></div></div></div>`};nav();R.home();</script></body></html>
