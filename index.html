<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neşe's Workspace</title><style>:root{--bg:#030711;--panel:#091426;--line:#1b2b48;--text:#f7f9ff;--muted:#91a2bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#132c55,transparent 35%),var(--bg);color:var(--text);font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:30px}.card{background:#091426;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:16px}input,textarea,button{font:inherit}input,textarea{display:block;width:100%;background:#061021;border:1px solid var(--line);color:white;border-radius:10px;padding:12px;margin:8px 0 15px}textarea{min-height:120px}.btn{border:0;border-radius:10px;padding:11px 16px;background:white;color:#07101d;font-weight:800;cursor:pointer}.hidden{display:none}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{background:#0e1d35;color:white;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}.item{padding:14px;border:1px solid var(--line);border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}.danger{background:#24111a!important;color:#ff9cac!important;border-color:#542234!important}</style></head><body><div class="wrap"><section id="login" class="card"><h1>🧠 Neşe's Workspace</h1><p style="color:#91a2bd">Your personal study, research & STEM command center.</p><label>Name</label><input id="loginName" placeholder="Neşe"><label>Workspace subtitle</label><input id="loginSubtitle" placeholder="Neuroscience • Medicine • STEM"><button class="btn" id="enter">Enter Workspace</button></section><section id="app" class="hidden"><div class="card"><h1>Welcome, <span id="name"></span>.</h1><p id="subtitle" style="color:#91a2bd"></p><div class="nav"><button data-open="dashboard">Dashboard</button><button data-open="notes">Notes</button><button data-open="cornell">Cornell Notes</button><button data-open="projects">Projects</button><button data-open="brainbee">Brain Bee</button><button data-open="tasks">Tasks</button><button data-open="profile">My Profile</button></div></div><div id="dashboard" class="card page"><h2>Study Command Center</h2><p>Organize neuroscience, research, Brain Bee preparation, STEM projects and school work here.</p></div><div id="notes" class="card page hidden"><h2>Notes</h2><input id="nt" placeholder="Title"><textarea id="nb" placeholder="Write notes..."></textarea><button class="btn" id="addNote">Save note</button><div id="notesList"></div></div><div id="cornell" class="card page hidden"><h2>Cornell Notes</h2><input id="ct" placeholder="Topic"><textarea id="cc" placeholder="Cues / Questions"></textarea><textarea id="cn" placeholder="Detailed notes"></textarea><textarea id="cs" placeholder="Summary"></textarea><button class="btn" id="addCornell">Save Cornell note</button><div id="cornellList"></div></div><div id="projects" class="card page hidden"><h2>Projects</h2><button class="btn" id="addProject">+ New project</button><div id="projectList"></div></div><div id="brainbee" class="card page hidden"><h2>🧠 Brain Bee</h2><p>Preparation progress</p><input id="brain" type="range" min="0" max="100"><strong id="brainValue">0%</strong></div><div id="tasks" class="card page hidden"><h2>Tasks</h2><input id="taskInput" placeholder="Study task"><button class="btn" id="addTask">Add task</button><div id="taskList"></div></div><div id="profile" class="card page hidden"><h2>My Profile</h2><label>Name</label><input id="pn"><label>Subtitle</label><input id="ps"><label>About me</label><textarea id="pa"></textarea><button class="btn" id="saveProfile">Save profile</button></div></section></div><script>const K='nese-space-v1';let s=JSON.parse(localStorage.getItem(K)||'null')||{name:'Neşe',subtitle:'Neuroscience • Medicine • STEM',about:'',notes:[],cornell:[],projects:[],tasks:[],brain:0};const $=id=>document.getElementById(id);const esc=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(K,JSON.stringify(s));render()}function render(){$('name').textContent=s.name;$('subtitle').textContent=s.subtitle;$('pn').value=s.name;$('ps').value=s.subtitle;$('pa').value=s.about;$('brain').value=s.brain;$('brainValue').textContent=s.brain+'%';$('notesList').innerHTML=s.notes.map((x,i)=>`<div class="item"><span><b>${esc(x.t)}</b><br><small>${esc(x.b)}</small></span><button class="btn danger" onclick="s.notes.splice(${i},1);save()">Delete</button></div>`).join('');$('cornellList').innerHTML=s.cornell.map((x,i)=>`<div class="item"><span><b>${esc(x.t)}</b><br><small>${esc(x.c)}</small></span><button class="btn danger" onclick="s.cornell.splice(${i},1);save()">Delete</button></div>`).join('');$('projectList').innerHTML=s.projects.map((x,i)=>`<div class="item"><span>${esc(x)}</span><button class="btn danger" onclick="s.projects.splice(${i},1);save()">Delete</button></div>`).join('');$('taskList').innerHTML=s.tasks.map((x,i)=>`<div class="item"><span>${esc(x)}</span><button class="btn danger" onclick="s.tasks.splice(${i},1);save()">Delete</button></div>`).join('')}$('enter').onclick=()=>{$('login').classList.add('hidden');$('app').classList.remove('hidden');s.name=$('loginName').value.trim()||'Neşe';s.subtitle=$('loginSubtitle').value.trim()||'My workspace';save()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));$(b.dataset.open).classList.remove('hidden')});$('addNote').onclick=()=>{if($('nt').value.trim())s.notes.push({t:$('nt').value,b:$('nb').value});$('nt').value='';$('nb').value='';save()};$('addCornell').onclick=()=>{if($('ct').value.trim())s.cornell.push({t:$('ct').value,c:$('cc').value,n:$('cn').value,sm:$('cs').value});$('ct').value='';$('cc').value='';$('cn').value='';$('cs').value='';save()};$('addProject').onclick=()=>{let x=prompt('Project name?');if(x)s.projects.push(x);save()};$('addTask').onclick=()=>{let x=$('taskInput').value.trim();if(x)s.tasks.push(x);$('taskInput').value='';save()};$('brain').oninput=()=>{s.brain=+$('brain').value;save()};$('saveProfile').onclick=()=>{s.name=$('pn').value.trim()||'Neşe';s.subtitle=$('ps').value.trim()||'My workspace';s.about=$('pa').value;save()};render();</script></body></html>
