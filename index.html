<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nese × MIT Workspace</title>
<style>
:root{--bg:#070a12;--panel:#0d1220;--panel2:#11182a;--line:#202a40;--text:#f5f7fb;--muted:#8d99b2;--blue:#78a9ff;--blue2:#477cff;--green:#6ee7b7;--danger:#ff7185;--radius:18px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#172d59 0,transparent 35%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 16px;background:#090d17;position:sticky;top:0;height:100vh}.brand{display:flex;gap:11px;align-items:center;margin-bottom:28px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#79a9ff,#385fff);display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small{color:var(--muted)}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aeb8cb;text-align:left;padding:12px 13px;border-radius:12px;display:flex;gap:11px;align-items:center}.nav button:hover,.nav button.active{background:#151e32;color:#fff}.nav .ico{width:22px}.side-bottom{position:absolute;bottom:20px;left:16px;right:16px;color:var(--muted);font-size:12px;line-height:1.5}.main{padding:30px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px}.top h1{font-size:30px;margin:4px 0}.pill{background:#111a2c;border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:#b9c5dc}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:linear-gradient(180deg,#101728,#0d1321);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 10px 35px #0002}.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted)}.metric{font-size:30px;font-weight:800}.progress{height:7px;background:#202b42;border-radius:10px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--blue));border-radius:10px}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.link{padding:15px;border:1px solid var(--line);border-radius:14px;background:#0b1120;color:#fff;text-align:left}.link:hover{border-color:#3e5e99}.link small{display:block;color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid var(--line);background:#131c2e;color:#eaf0ff;padding:9px 13px;border-radius:10px}.btn.primary{background:#3d69ff;border-color:#527aff}.btn.danger{color:#ff9baa}.btn:hover{filter:brightness(1.12)}input,textarea,select{width:100%;background:#080e1b;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}textarea{resize:vertical;min-height:100px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.list{display:grid;gap:9px;margin-top:14px}.item{border:1px solid var(--line);background:#0b1120;padding:12px;border-radius:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:11px;padding:4px 8px;border-radius:999px;background:#172440;color:#a9c5ff}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:72px;border:1px solid var(--line);border-radius:9px;padding:7px;background:#0a101d}.day b{font-size:11px}.day.today{border-color:#547eff}.flash{min-height:240px;display:grid;place-items:center;text-align:center;border:1px dashed #38507d;border-radius:16px;padding:25px;background:#0a1120}.flash strong{font-size:26px}.codegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor{min-height:420px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.preview{width:100%;height:420px;background:white;border:0;border-radius:10px}.canvas-wrap{background:#fff;border-radius:14px;overflow:hidden;touch-action:none}.canvas{display:block;width:100%;height:500px;touch-action:none}.note-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;right:20px;bottom:20px;background:#151e30;border:1px solid #33435f;padding:12px 16px;border-radius:12px;display:none}.mobile{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.mobile{display:flex;position:fixed;z-index:5;left:12px;right:12px;bottom:12px;background:#0e1525eF;border:1px solid var(--line);backdrop-filter:blur(15px);border-radius:16px;padding:7px;justify-content:space-around}.mobile button{background:none;border:0;color:#aab5c9;font-size:11px}.main{padding:22px 14px 90px}.span-8,.span-6,.span-4,.span-3{grid-column:span 12}.codegrid,.two,.three,.note-row{grid-template-columns:1fr}.links{grid-template-columns:1fr}}
</style></head>
<body>
<div class="app">
<aside class="side"><div class="brand"><div class="logo">N</div><div><b>Nese × MIT</b><small>Workspace</small></div></div><nav class="nav" id="nav"></nav><div class="side-bottom">One workspace for academics, coding, projects and research.<br><br>Everything is saved locally on this device.</div></aside>
<main class="main"><div class="top"><div><div class="eyebrow">MIT preparation system</div><h1 id="title">My Space</h1></div><span class="pill" id="saveState">Local workspace</span></div>
<section id="home" class="view active"></section><section id="academics" class="view"></section><section id="coding" class="view"></section><section id="projects" class="view"></section><section id="research" class="view"></section><section id="calendar" class="view"></section><section id="profile" class="view"></section></main></div>
<div class="mobile" id="mobileNav"></div><div class="toast" id="toast"></div>
<script>
const KEY='nese-mit-workspace-v2';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{tasks:[],notes:[],cards:[],projects:[],research:[],events:[],profile:{name:'Nese',goal:'MIT Computer Science'}};
const views={home:'My Space',academics:'Academics',coding:'Code Lab',projects:'Projects',research:'Research',calendar:'Calendar',profile:'Profile'};
function save(){localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('saveState').textContent='Saved locally';}
function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
function nav(){let html=Object.entries(views).map(([id,n])=>`<button data-go="${id}"><span class="ico">${({home:'⌂',academics:'▣',coding:'⌘',projects:'◆',research:'⌕',calendar:'□',profile:'○'})[id]}</span>${n}</button>`).join('');document.getElementById('nav').innerHTML=html;document.getElementById('mobileNav').innerHTML=Object.entries(views).slice(0,5).map(([id,n])=>`<button data-go="${id}">${n.split(' ')[0]}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));}
function go(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('title').textContent=views[id];document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));render(id);}
function render(id){({home:home,academics:academics,coding:coding,projects:projects,research:research,calendar:calendar,profile:profile}[id])()}
function home(){let done=data.tasks.filter(x=>x.done).length, p=data.projects.length;document.getElementById('home').innerHTML=`<div class="grid"><div class="card span-8"><div class="eyebrow">Your central hub</div><h2>Build the MIT profile you actually want.</h2><p class="muted">Academics, coding, projects and research live inside one workspace. Nothing is forced into the sidebar.</p><div class="links"><button class="link" onclick="go('academics')"><b>▣ Academics</b><small>Notes · Cornell · Flashcards · planner</small></button><button class="link" onclick="go('coding')"><b>⌘ Code Lab</b><small>Learn · experiment · run browser code</small></button><button class="link" onclick="go('projects')"><b>◆ Projects</b><small>Ideas · progress · portfolio</small></button><button class="link" onclick="go('research')"><b>⌕ Research</b><small>Papers · questions · sources</small></button></div></div><div class="card span-4"><h3>Progress snapshot</h3><div class="metric">${p}</div><div class="muted">projects</div><div class="progress"><i style="width:${Math.min(100,p*10)}%"></i></div><br><div class="metric">${done}/${data.tasks.length||0}</div><div class="muted">tasks completed</div></div><div class="card span-12"><h3>Today</h3><div class="three"><input id="taskInput" placeholder="Add a task…"><select id="taskArea"><option>Academics</option><option>Code</option><option>Project</option><option>Research</option></select><button class="btn primary" onclick="addTask()">+ Add task</button></div><div class="list">${data.tasks.slice(-8).reverse().map((x,i)=>`<div class="item"><label><input style="width:auto" type="checkbox" ${x.done?'checked':''} onchange="toggleTask(${data.tasks.indexOf(x)})"> ${esc(x.text)}</label><span><span class="tag">${x.area}</span> <button class="btn danger" onclick="delTask(${data.tasks.indexOf(x)})">Delete</button></span></div>`).join('')}</div></div></div>`}
function addTask(){let v=document.getElementById('taskInput').value.trim();if(!v)return;data.tasks.push({text:v,area:document.getElementById('taskArea').value,done:false});save();render('home')};function toggleTask(i){data.tasks[i].done=!data.tasks[i].done;save();render('home')};function delTask(i){data.tasks.splice(i,1);save();render('home')}
function academics(){document.getElementById('academics').innerHTML=`<div class="grid"><div class="card span-4"><h3>Cornell Notes</h3><p class="muted">Subject, cues and summary in one place.</p><input id="cnSubject" placeholder="Subject"><br><br><div class="note-row"><textarea id="cnCue" placeholder="Cues / questions"></textarea><textarea id="cnBody" placeholder="Main notes"></textarea></div><br><textarea id="cnSummary" placeholder="Summary"></textarea><br><button class="btn primary" onclick="addCornell()">Save note</button><div class="list">${data.notes.map((n,i)=>`<div class="item"><div><b>${esc(n.subject)}</b><small class="muted"><br>${esc(n.summary)}</small></div><button class="btn danger" onclick="delNote(${i})">Delete</button></div>`).join('')}</div></div><div class="card span-4"><h3>Flashcards</h3><p class="muted">Tap the card to reveal the answer.</p><div class="flash" id="flash" onclick="flipCard()"><div><strong>${data.cards.length?esc(data.cards[flashIndex%data.cards.length].q):'No cards yet'}</strong><p class="muted">${data.cards.length?'Tap to flip':'Create your first card below'}</p></div></div><br><div class="two"><input id="fq" placeholder="Question"><input id="fa" placeholder="Answer"></div><br><button class="btn primary" onclick="addCard()">+ Flashcard</button><button class="btn" onclick="nextCard()">Next</button><div class="list">${data.cards.map((c,i)=>`<div class="item"><span>${esc(c.q)}</span><button class="btn danger" onclick="delCard(${i})">×</button></div>`).join('')}</div></div><div class="card span-4"><h3>Study planner</h3><p class="muted">Quick academic targets.</p><div class="list">${['Math','Physics','Computer Science','English'].map(s=>`<div class="item"><span>${s}</span><button class="btn" onclick="toast('${s} session added')">+ session</button></div>`).join('')}</div><br><h3>Handwritten notes</h3><p class="muted">Use Apple Pencil, finger or mouse.</p><div class="canvas-wrap"><canvas id="noteCanvas" class="canvas"></canvas></div><div class="toolbar"><button class="btn" onclick="clearCanvas()">Clear</button><button class="btn" onclick="downloadCanvas()">Export PNG</button></div></div></div>`;initCanvas()}
let flashIndex=0,flipped=false;function flipCard(){if(!data.cards.length)return;flipped=!flipped;document.getElementById('flash').querySelector('strong').textContent=esc(flipped?data.cards[flashIndex%data.cards.length].a:data.cards[flashIndex%data.cards.length].q)}function nextCard(){if(data.cards.length){flashIndex=(flashIndex+1)%data.cards.length;flipped=false;render('academics')}}function addCard(){let q=document.getElementById('fq').value.trim(),a=document.getElementById('fa').value.trim();if(q&&a){data.cards.push({q,a});save();render('academics')}}function delCard(i){data.cards.splice(i,1);save();render('academics')}function addCornell(){let s=document.getElementById('cnSubject').value.trim();if(!s)return;data.notes.push({subject:s,cue:document.getElementById('cnCue').value,body:document.getElementById('cnBody').value,summary:document.getElementById('cnSummary').value});save();render('academics')}function delNote(i){data.notes.splice(i,1);save();render('academics')}
let canvas,ctx,drawing=false;function initCanvas(){canvas=document.getElementById('noteCanvas');if(!canvas)return;let dpr=devicePixelRatio||1,w=canvas.clientWidth,h=500;canvas.width=w*dpr;canvas.height=h*dpr;ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle='#101828';let pos=e=>{let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};canvas.onpointerdown=e=>{drawing=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drawing)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onpointerup=()=>drawing=false;canvas.onpointercancel=()=>drawing=false}function clearCanvas(){ctx&&ctx.clearRect(0,0,canvas.width,canvas.height)}function downloadCanvas(){if(!canvas)return;let a=document.createElement('a');a.download='nese-handwritten-note.png';a.href=canvas.toDataURL();a.click()}
function coding(){document.getElementById('coding').innerHTML=`<div class="grid"><div class="card span-12"><div class="eyebrow">Browser coding playground</div><h2>Build → run → inspect.</h2><p class="muted">Start with HTML/CSS/JavaScript. Your editor runs entirely in this page.</p><div class="codegrid"><textarea id="code" class="editor"><!doctype html>\n<html>\n<body style="font-family:system-ui;padding:30px">\n<h1>Hello, Nese 👋</h1>\n<button onclick="document.body.style.background='#101a32'">Click me</button>\n</body>\n</html></textarea><iframe id="preview" class="preview" sandbox="allow-scripts"></iframe></div><div class="toolbar"><button class="btn primary" onclick="runCode()">▶ Run</button><button class="btn" onclick="resetCode()">Reset</button></div></div><div class="card span-6"><h3>Learning path</h3><div class="list">${['Python fundamentals','Git & GitHub','HTML + CSS','JavaScript','Data structures','Java / C++'].map((x,i)=>`<div class="item"><span>${i+1}. ${x}</span><button class="btn" onclick="toast('${x} marked as focus')">Focus</button></div>`).join('')}</div></div><div class="card span-6"><h3>Code journal</h3><textarea id="codeJournal" placeholder="What did I learn today?"></textarea><br><br><button class="btn primary" onclick="saveCodeJournal()">Save journal</button><p id="journalText" class="muted"></p></div></div>`;runCode();document.getElementById('journalText').textContent=localStorage.getItem('code-journal')||''}
function runCode(){let f=document.getElementById('preview');if(f)f.srcdoc=document.getElementById('code').value}function resetCode(){document.getElementById('code').value='<!doctype html>\n<html>\n<body style="font-family:system-ui;padding:30px">\n<h1>Hello, Nese 👋</h1>\n</body>\n</html>';runCode()}function saveCodeJournal(){localStorage.setItem('code-journal',document.getElementById('codeJournal').value);toast('Journal saved')}
function projects(){document.getElementById('projects').innerHTML=`<div class="grid"><div class="card span-8"><h2>Project portfolio</h2><p class="muted">Turn ideas into evidence of what you can build.</p><div class="two"><input id="pname" placeholder="Project name"><select id="pstage"><option>Idea</option><option>Building</option><option>Testing</option><option>Live</option></select></div><br><textarea id="pdesc" placeholder="Problem, solution and what you learned"></textarea><br><br><button class="btn primary" onclick="addProject()">+ Add project</button><div class="list">${data.projects.map((p,i)=>`<div class="item"><div><b>${esc(p.name)}</b><small class="muted"><br>${esc(p.desc)}</small></div><span><span class="tag">${p.stage}</span> <button class="btn danger" onclick="delProject(${i})">Delete</button></span></div>`).join('')}</div></div><div class="card span-4"><h3>Project checklist</h3><div class="list">${['Problem statement','Research','Prototype','Code','Testing','Documentation','Demo'].map(x=>`<div class="item"><label><input style="width:auto" type="checkbox"> ${x}</label></div>`).join('')}</div></div></div>`}function addProject(){let n=document.getElementById('pname').value.trim();if(!n)return;data.projects.push({name:n,stage:document.getElementById('pstage').value,desc:document.getElementById('pdesc').value});save();render('projects')}function delProject(i){data.projects.splice(i,1);save();render('projects')}
function research(){document.getElementById('research').innerHTML=`<div class="grid"><div class="card span-8"><h2>Research database</h2><p class="muted">Keep questions, papers and sources together.</p><div class="two"><input id="rq" placeholder="Research question"><input id="rt" placeholder="Topic / tag"></div><br><textarea id="rs" placeholder="Source, finding, methodology, link or reflection"></textarea><br><br><button class="btn primary" onclick="addResearch()">+ Save research entry</button><div class="list">${data.research.map((r,i)=>`<div class="item"><div><b>${esc(r.q)}</b><span class="tag">${esc(r.t)}</span><small class="muted"><br>${esc(r.s)}</small></div><button class="btn danger" onclick="delResearch(${i})">Delete</button></div>`).join('')}</div></div><div class="card span-4"><h3>Research workflow</h3><div class="list">${['Question','Literature search','Source evaluation','Method','Analysis','Conclusion','Paper','Publication / showcase'].map((x,i)=>`<div class="item"><span>${i+1}. ${x}</span></div>`).join('')}</div></div></div>`}function addResearch(){let q=document.getElementById('rq').value.trim();if(!q)return;data.research.push({q,t:document.getElementById('rt').value,s:document.getElementById('rs').value});save();render('research')}function delResearch(i){data.research.splice(i,1);save();render('research')}
function calendar(){let now=new Date(),days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];document.getElementById('calendar').innerHTML=`<div class="grid"><div class="card span-12"><h2>${now.toLocaleString('en',{month:'long'})} ${now.getFullYear()}</h2><div class="calendar">${days.map(d=>`<div class="day"><b>${d}</b></div>`).join('')}${Array.from({length:new Date(now.getFullYear(),now.getMonth()+1,0).getDate()},(_,i)=>`<div class="day ${i+1===now.getDate()?'today':''}"><b>${i+1}</b></div>`).join('')}</div></div><div class="card span-12"><h3>Add event</h3><div class="three"><input id="ed" type="date"><input id="en" placeholder="Event"><button class="btn primary" onclick="addEvent()">+ Add</button></div><div class="list">${data.events.map((e,i)=>`<div class="item"><span><b>${e.date}</b> — ${esc(e.name)}</span><button class="btn danger" onclick="data.events.splice(${i},1);save();render('calendar')">Delete</button></div>`).join('')}</div></div></div>`}function addEvent(){let d=document.getElementById('ed').value,n=document.getElementById('en').value.trim();if(d&&n){data.events.push({date:d,name:n});save();render('calendar')}}
function profile(){document.getElementById('profile').innerHTML=`<div class="grid"><div class="card span-6"><h2>My profile</h2><p class="muted">Keep your workspace identity and long-term direction.</p><label>Name</label><input id="profName" value="${esc(data.profile.name)}"><br><br><label>Current goal</label><input id="profGoal" value="${esc(data.profile.goal)}"><br><br><button class="btn primary" onclick="saveProfile()">Save profile</button></div><div class="card span-6"><h2>MIT narrative</h2><p class="muted">Your workspace is built around:</p><div class="list"><div class="item">Academic strength</div><div class="item">Software + technology</div><div class="item">Building real projects</div><div class="item">Research curiosity</div><div class="item">Leadership & initiative</div></div></div></div>`}function saveProfile(){data.profile.name=document.getElementById('profName').value;data.profile.goal=document.getElementById('profGoal').value;save();toast('Profile saved')}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
nav();go('home');
</script></body></html>
