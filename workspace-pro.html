<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>:root{--nav:#101820;--red:#a31f34;--bg:#f4f5f7;--card:#fff;--line:#dfe3e8;--muted:#697586}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--nav);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;background:var(--nav);color:#fff;padding:25px 16px}.brand{display:flex;gap:12px;align-items:center;padding:4px 10px 24px;border-bottom:1px solid #ffffff18}.logo{width:42px;height:42px;background:var(--red);display:grid;place-items:center;font-weight:900}.brand small{display:block;color:#9ba8b8;font-size:11px}.label{margin:25px 10px 8px;color:#77879a;font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{border:0;background:none;color:#aeb9c7;padding:12px;border-radius:9px;text-align:left;font-size:14px;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff10;color:#fff;box-shadow:inset 3px 0 var(--red)}.main{padding:38px 48px 80px;max-width:1540px;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px}.ey{color:var(--red);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:38px;letter-spacing:-.045em;margin:3px 0}h2{font-size:23px;margin:0 0 6px}.muted{color:var(--muted)}.status{background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:20px;color:var(--muted);font-size:11px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:26px;box-shadow:0 8px 30px #1018200a}.s12{grid-column:span 12}.s8{grid-column:span 8}.s6{grid-column:span 6}.s4{grid-column:span 4}.hero{padding:34px;border-top:4px solid var(--red)}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}.quick button,.lesson{border:1px solid var(--line);background:#fff;border-radius:11px;padding:16px;text-align:left;cursor:pointer}.quick button:hover,.lesson:hover{border-color:var(--red)}.quick span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.metric{font-size:34px;font-weight:800}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{border:1px solid #cdd3da;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.danger{color:#a31f34}.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}input,textarea,select{width:100%;border:1px solid #cdd3da;border-radius:8px;padding:11px 12px;background:#fff;color:var(--nav);font:inherit}textarea{min-height:140px;resize:vertical}.list{display:grid;gap:9px;margin-top:15px}.item{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{background:#eef1f5;color:#526174;padding:3px 8px;border-radius:20px;font-size:10px}.flash{height:260px;background:#f8f8f6;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;padding:25px;cursor:pointer}.flash strong{font-size:25px}.canvasbox{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff;touch-action:none}.canvas{display:block;width:100%;height:650px;touch-action:none;cursor:crosshair}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{padding:8px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.day{min-height:105px;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;cursor:pointer}.day:hover{border-color:var(--red)}.day.today{border:2px solid var(--red)}.daynote{display:block;color:#526174;font-size:11px;margin-top:7px;white-space:pre-wrap;max-height:58px;overflow:hidden}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.code{display:grid;grid-template-columns:1fr 1fr;gap:16px}.editor{height:500px;background:#111a24;color:#edf2f7;font:14px/1.65 monospace;border:0}.preview{height:500px;border:1px solid var(--line);border-radius:9px;background:#fff}.resources a{color:#315b87;text-decoration:none}.pdf-list{display:grid;gap:9px;margin-top:15px}.pdf-item{border:1px solid var(--line);border-radius:9px;padding:13px;display:flex;justify-content:space-between;align-items:center}.pdf-stage{display:none;position:relative;background:#777;border-radius:10px;overflow:auto;margin-top:16px;min-height:650px}.pdf-stage iframe{width:100%;height:780px;border:0;background:#fff}.pdf-ink{position:absolute;inset:0;width:100%;height:780px;pointer-events:none}.pdf-stage.annotate .pdf-ink{pointer-events:auto}.modal{position:fixed;inset:0;background:#10182088;display:none;place-items:center;z-index:20;padding:20px}.modal.open{display:grid}.modalbox{background:#fff;border-radius:14px;width:min(650px,100%);padding:25px}@media(max-width:1050px){.quick{grid-template-columns:1fr 1fr}.s8,.s6,.s4{grid-column:span 12}}@media(max-width:720px){.app{display:block}.side{display:none}.main{padding:24px 15px 70px}.grid{display:block}.card{margin-bottom:15px}.quick,.two,.three,.code{grid-template-columns:1fr}.canvas{height:560px}.day{min-height:75px}.weekday{font-size:9px}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">N</div><div><b>NESE WORKSPACE</b><small>MIT · Computer Science</small></div></div><div class="label">Workspace</div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="top"><div><div class="ey">Personal academic system</div><h1 id="title">My Space</h1></div><span id="status" class="status">Saved locally</span></header><section id="home" class="view active"></section><section id="academics" class="view"></section><section id="coding" class="view"></section><section id="projects" class="view"></section><section id="research" class="view"></section><section id="calendar" class="view"></section><section id="profile" class="view"></section></main></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><script>const KEY='nese-pro-v1';let d=JSON.parse(localStorage.getItem(KEY)||'null')||{tasks:[],notes:[],cards:[],projects:[],research:[],calendar:{},drawings:[],profile:{name:'Nese',goal:'MIT Computer Science'}};let fi=0,flip=false;const V={home:'My Space',academics:'Academics',coding:'My Coding',projects:'Projects',research:'Research',calendar:'Calendar',profile:'Profile'},IC={home:'⌂',academics:'▦',coding:'⌘',projects:'◆',research:'⌕',calendar:'□',profile:'○'},esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(d));status.textContent='Saved locally'}nav.innerHTML=Object.entries(V).map(([id,n])=>`<button data-go="${id}"><span style="display:inline-block;width:25px">${IC[id]}</span>${n}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');title.textContent=V[id];document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===id));R[id]()}const R={};R.home=()=>{let done=d.tasks.filter(x=>x.done).length;home.innerHTML=`<div class="grid"><div class="card hero s12"><div class="ey">MIT preparation · overview</div><h2>Build a body of work you are proud of.</h2><p class="muted">Academic, coding, projects and research in one professional workspace.</p><div class="quick"><button onclick="go('academics')"><b>Academics</b><span>Cornell · flashcards · handwriting · PDFs</span></button><button onclick="go('coding')"><b>My Coding</b><span>Personal Python curriculum</span></button><button onclick="go('projects')"><b>Projects</b><span>Portfolio · progress · evidence</span></button><button onclick="go('research')"><b>Research</b><span>Questions · sources · findings</span></button></div></div><div class="card s4"><span class="muted">Projects</span><div class="metric">${d.projects.length}</div></div><div class="card s4"><span class="muted">Tasks completed</span><div class="metric">${done}/${d.tasks.length}</div></div><div class="card s4"><span class="muted">Research</span><div class="metric">${d.research.length}</div></div><div class="card s12"><h2>Today</h2><div class="three"><input id="task" placeholder="What needs your attention?"><select id="area"><option>Academics</option><option>Code</option><option>Project</option><option>Research</option></select><button class="btn red" onclick="addTask()">Add task</button></div><div class="list">${d.tasks.slice(-8).reverse().map((x)=>{let i=d.tasks.indexOf(x);return`<div class="item"><label><input style="width:auto" type="checkbox" ${x.done?'checked':''} onchange="toggleTask(${i})"> ${esc(x.text)}</label><button class="btn danger" onclick="delTask(${i})">Delete</button></div>`}).join('')}</div></div></div>`};function addTask(){if(task.value.trim()){d.tasks.push({text:task.value,area:area.value,done:false});save();R.home()}}function toggleTask(i){d.tasks[i].done=!d.tasks[i].done;save();R.home()}function delTask(i){d.tasks.splice(i,1);save();R.home()}
R.academics=()=>{academics.innerHTML=`<div class="grid"><div class="card s8"><div class="ey">Study system</div><h2>Cornell Notes</h2><div class="two"><input id="sub" placeholder="Subject / chapter"><input id="sum" placeholder="Summary"><textarea id="cue" placeholder="Cues / questions"></textarea><textarea id="body" placeholder="Main notes"></textarea></div><div class="toolbar"><button class="btn red" onclick="addNote()">Save note</button></div><div class="list">${d.notes.map((n,i)=>`<div class="item"><span><b>${esc(n.subject)}</b><br><small>${esc(n.summary)}</small></span><button class="btn danger" onclick="d.notes.splice(${i},1);save();R.academics()">Delete</button></div>`).join('')}</div></div><div class="card s4"><h2>Flashcards</h2><div class="flash" onclick="flipCard()"><strong>${d.cards.length?esc(flip?d.cards[fi%d.cards.length].a:d.cards[fi%d.cards.length].q):'No cards yet'}</strong></div><div class="toolbar"><button class="btn" onclick="nextCard()">Next</button><button class="btn danger" onclick="deleteCard()">Delete</button></div><div class="two"><input id="fq" placeholder="Question"><input id="fa" placeholder="Answer"></div><div class="toolbar"><button class="btn red" onclick="addCard()">Add card</button></div></div><div class="card s12"><div class="ey">Apple Pencil workspace</div><h2>Handwritten Notes</h2><p class="muted">Large iPad-friendly canvas. Save your pages in the app or export them to Files / iCloud Drive.</p><div class="canvasbox"><canvas id="cnv" class="canvas"></canvas></div><div class="toolbar"><button class="btn red" onclick="saveDrawing()">Save page</button><button class="btn" onclick="clearCanvas()">Clear</button><button class="btn" onclick="exportCanvas()">Export PNG</button></div><div class="list">${d.drawings.map((x,i)=>`<div class="item"><span><b>${esc(x.name)}</b><br><small>${esc(x.date)}</small></span><span><button class="btn" onclick="openDrawing(${i})">Open</button><button class="btn danger" onclick="d.drawings.splice(${i},1);save();R.academics()">Delete</button></span></div>`).join('')}</div></div><div class="card s12"><div class="ey">Document library</div><h2>PDFs</h2><p class="muted">Upload PDFs. They remain stored in this browser on this device. Open and annotate with touch / Pencil.</p><input id="pdfInput" type="file" accept="application/pdf" onchange="uploadPDF(event)"><div id="pdfList" class="pdf-list"></div><div id="pdfStage" class="pdf-stage"><iframe id="pdfFrame"></iframe><canvas id="pdfInk" class="pdf-ink"></canvas></div><div id="pdfBtns" class="toolbar" style="display:none"><button class="btn" onclick="toggleInk()">✎ Annotate</button><button class="btn" onclick="clearInk()">Clear ink</button><button class="btn" onclick="closePDF()">Close</button></div></div></div>`;initCanvas();renderPDFs()};function addNote(){if(sub.value.trim()){d.notes.push({subject:sub.value,summary:sum.value,cue:cue.value,body:body.value});save();R.academics()}}function addCard(){if(fq.value.trim()&&fa.value.trim()){d.cards.push({q:fq.value,a:fa.value});fi=d.cards.length-1;flip=false;save();R.academics()}}function flipCard(){if(d.cards.length){flip=!flip;R.academics()}}function nextCard(){if(d.cards.length){fi=(fi+1)%d.cards.length;flip=false;R.academics()}}function deleteCard(){if(d.cards.length){d.cards.splice(fi,1);fi=Math.max(0,fi-1);flip=false;save();R.academics()}}
let cn,ct,pen=false;function initCanvas(){cn=document.getElementById('cnv');if(!cn)return;let z=devicePixelRatio||1;cn.width=cn.clientWidth*z;cn.height=cn.clientHeight*z;ct=cn.getContext('2d');ct.scale(z,z);ct.lineWidth=2.4;ct.lineCap='round';ct.lineJoin='round';const pos=e=>{let r=cn.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};cn.onpointerdown=e=>{pen=true;let p=pos(e);ct.beginPath();ct.moveTo(p.x,p.y);cn.setPointerCapture(e.pointerId)};cn.onpointermove=e=>{if(!pen)return;let p=pos(e);ct.lineTo(p.x,p.y);ct.stroke()};cn.onpointerup=()=>pen=false;cn.onpointercancel=()=>pen=false}function clearCanvas(){ct&&ct.clearRect(0,0,cn.width,cn.height)}function exportCanvas(){let a=document.createElement('a');a.download='nese-study-note.png';a.href=cn.toDataURL('image/png');a.click()}function saveDrawing(){let n=prompt('Name this page','Study note');if(!n)return;d.drawings.push({name:n,date:new Date().toLocaleString(),img:cn.toDataURL('image/png')});save();R.academics()}function openDrawing(i){let w=window.open();w.document.write(`<img style="max-width:100%" src="${d.drawings[i].img}">`)}
let pdfDB,pdfURL,pdfC,pdfCTX,pdfPen=false;function db(){return new Promise((res,rej)=>{let r=indexedDB.open('nese-pdfs-pro',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function uploadPDF(e){let f=e.target.files[0];if(!f)return;let x=await db(),t=x.transaction('files','readwrite');t.objectStore('files').add({name:f.name,blob:f});t.oncomplete=renderPDFs}async function renderPDFs(){let el=document.getElementById('pdfList');if(!el)return;let x=await db(),t=x.transaction('files','readonly'),q=t.objectStore('files').getAll();q.onsuccess=()=>el.innerHTML=q.result.map(f=>`<div class="pdf-item"><b>${esc(f.name)}</b><span><button class="btn" onclick="openPDF(${f.id})">Open</button><button class="btn danger" onclick="removePDF(${f.id})">Delete</button></span></div>`).join('')||'<p class="muted">No PDFs uploaded yet.</p>'}async function openPDF(id){let x=await db(),t=x.transaction('files','readonly'),q=t.objectStore('files').get(id);q.onsuccess=()=>{if(pdfURL)URL.revokeObjectURL(pdfURL);pdfURL=URL.createObjectURL(q.result.blob);pdfFrame.src=pdfURL;pdfStage.style.display='block';pdfBtns.style.display='flex';setTimeout(initPDFInk,250)}}async function removePDF(id){let x=await db(),t=x.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=renderPDFs}function closePDF(){pdfStage.style.display='none';pdfBtns.style.display='none'}function initPDFInk(){pdfC=document.getElementById('pdfInk');pdfC.width=pdfStage.clientWidth;pdfC.height=780;pdfCTX=pdfC.getContext('2d');pdfCTX.lineWidth=2;pdfCTX.lineCap='round';pdfCTX.strokeStyle='#a31f34';pdfC.onpointerdown=e=>{if(!pdfStage.classList.contains('annotate'))return;pdfPen=true;let r=pdfC.getBoundingClientRect();pdfCTX.beginPath();pdfCTX.moveTo(e.clientX-r.left,e.clientY-r.top)};pdfC.onpointermove=e=>{if(!pdfPen)return;let r=pdfC.getBoundingClientRect();pdfCTX.lineTo(e.clientX-r.left,e.clientY-r.top);pdfCTX.stroke()};pdfC.onpointerup=()=>pdfPen=false}function toggleInk(){pdfStage.classList.toggle('annotate')}function clearInk(){pdfCTX&&pdfCTX.clearRect(0,0,pdfC.width,pdfC.height)}
R.coding=()=>{coding.innerHTML=`<div class="grid"><div class="card hero s12"><div class="ey">Personal coding hub</div><h2>My Coding</h2><p class="muted">Your own coding curriculum — separate from clubs and school. This is intentionally spacious so you can actually study here.</p><div class="quick"><button onclick="document.getElementById('assign').scrollIntoView()"><b>Assignments</b><span>Practice tasks</span></button><button onclick="document.getElementById('res').scrollIntoView()"><b>Course Library</b><span>All your resources</span></button><button onclick="document.getElementById('play').scrollIntoView()"><b>Playground</b><span>Write and experiment</span></button><button onclick="window.open('https://programming-23.mooc.fi/part-1','_blank')"><b>Full Python course</b><span>Programming 23 · Part 1</span></button></div></div><div class="card s8"><div class="ey">H01 · 13 July 2026</div><h2>VSCode · if · for</h2><div class="list"><div class="lesson"><b>01 · VSCode</b><span class="tag">Foundation</span></div><div class="lesson"><b>02 · if</b><span class="tag">Python</span></div><div class="lesson"><b>03 · else / elif</b><span class="tag">Python</span></div><div class="lesson"><b>04 · Combining conditions</b><span class="tag">Python</span></div><div class="lesson"><b>05 · for</b><span class="tag">Python</span></div></div></div><div class="card s4"><h2>Progress</h2><div class="metric">${localStorage.getItem('coding-progress')||0}%</div><button class="btn red" onclick="localStorage.setItem('coding-progress',(localStorage.getItem('coding-progress')||0)==='100'?0:100);R.coding()">Update</button></div><div id="assign" class="card s12"><div class="ey">Assignments & tasks</div><h2>Practice</h2><div class="list"><label class="lesson"><input type="checkbox"> 20–50 arasındaki çift sayıları yazdır.</label><label class="lesson"><input type="checkbox"> 80'den 30'a kadar 3'er 3'er geri say.</label><label class="lesson"><input type="checkbox"> Çizim programını tamamla ve kendi fikrini ekle.</label><label class="lesson"><input type="checkbox"> if konusundan en az 3 görev yap.</label><label class="lesson"><input type="checkbox"> for konusundan en az 3 görev yap.</label></div></div><div id="res" class="card s12 resources"><div class="ey">Course library</div><h2>Learning Resources</h2><div class="list"><div class="lesson"><b>VSCode presentation</b> · <a target="_blank" href="https://docs.google.com/presentation/d/189dcDqTT0VJd2StKQse-SVEDpyxACZSYH23rs2pj-VU">Open</a></div><div class="lesson"><b>VSCode MOOC</b> · <a target="_blank" href="https://programming-23.mooc.fi/part-4/1-vscode">Open</a></div><div class="lesson"><b>if presentation</b> · <a target="_blank" href="https://docs.google.com/presentation/d/19WDRmJva4bAWlW9qppDk_3aCM1q3lOgJXIU7rR54kvk">Open</a></div><div class="lesson"><b>Google Colab notes</b> · <a target="_blank" href="https://colab.research.google.com/drive/1rK5C7eLUTHzfRU9QmvHVLXjNLMIdR0fS">Open</a></div><div class="lesson"><b>Conditional statements</b> · <a target="_blank" href="https://programming-23.mooc.fi/part-1/5-conditional-statements">Open</a></div><div class="lesson"><b>else / elif</b> · <a target="_blank" href="https://programming-23.mooc.fi/part-2/2-else-elif">Open</a></div><div class="lesson"><b>Combining conditions</b> · <a target="_blank" href="https://programming-23.mooc.fi/part-2/3-combining-conditions">Open</a></div><div class="lesson"><b>for presentation</b> · <a target="_blank" href="https://docs.google.com/presentation/d/1i0iUchAS5MeFHJn-sT3L4k1BSl2VWRb3rqEsd6MX6oA">Open</a></div><div class="lesson"><b>Online lesson</b> · <a target="_blank" href="https://zoom.skyeducationacademy.com/rooms/qyx-fcu-qvv-ukf">Open</a></div><div class="lesson"><b>⭐ Programming 23 — Part 1</b> · <a target="_blank" href="https://programming-23.mooc.fi/part-1">Start full course</a></div></div></div><div id="play" class="card s12"><div class="ey">Practice playground</div><h2>Write & experiment</h2><div class="code"><textarea id="editor" class="editor">print("Hello, Nese!")</textarea><iframe id="preview" class="preview" sandbox="allow-scripts"></iframe></div><div class="toolbar"><button class="btn red" onclick="runCode()">Run preview</button></div></div></div>`;runCode()};function runCode(){let out=editor.value.replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/print\(([^)]*)\)/g,'document.write($1+"<br>")');preview.srcdoc='<script>'+out+'<\/script>'}
R.projects=()=>{projects.innerHTML=`<div class="grid"><div class="card s8"><div class="ey">Portfolio</div><h2>Projects</h2><textarea id="pd" placeholder="Project name, problem, solution, technology, what you learned"></textarea><div class="toolbar"><button class="btn red" onclick="addProject()">Add project</button></div><div class="list">${d.projects.map((p,i)=>`<div class="item"><span><b>${esc(p.name)}</b><br><small>${esc(p.desc)}</small></span><button class="btn danger" onclick="d.projects.splice(${i},1);save();R.projects()">Delete</button></div>`).join('')}</div></div><div class="card s4"><h2>Build checklist</h2><div class="list">${['Problem','Research','Prototype','Code','Testing','Documentation','Demo'].map(x=>`<label class="item"><input type="checkbox" style="width:auto">${x}</label>`).join('')}</div></div></div>`};function addProject(){if(pd.value.trim()){d.projects.push({name:pd.value,desc:pd.value});save();R.projects()}}
R.research=()=>{research.innerHTML=`<div class="grid"><div class="card s8"><div class="ey">Knowledge base</div><h2>Research Database</h2><input id="rq" placeholder="Research question"><br><br><textarea id="rs" placeholder="Source · finding · method · reflection"></textarea><div class="toolbar"><button class="btn red" onclick="addResearch()">Save entry</button></div><div class="list">${d.research.map((r,i)=>`<div class="item"><span><b>${esc(r.q)}</b><br>${esc(r.s)}</span><button class="btn danger" onclick="d.research.splice(${i},1);save();R.research()">Delete</button></div>`).join('')}</div></div><div class="card s4"><h2>Workflow</h2><div class="list">${['Question','Literature search','Source evaluation','Method','Analysis','Conclusion','Paper','Showcase'].map((x,i)=>`<div class="item">${i+1}. ${x}</div>`).join('')}</div></div></div>`};function addResearch(){if(rq.value.trim()){d.research.push({q:rq.value,s:rs.value});save();R.research()}}
let cal=new Date();function key(y,m,day){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0')}R.calendar=()=>{let y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let day=1;day<=days;day++){let k=key(y,m,day),n=d.calendar[k]||'',now=new Date(),today=now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===day;cells+=`<div class="day ${today?'today':''}" onclick="dayNote('${k}')"><b>${day}</b>${n?`<span class="daynote">${esc(n)}</span>`:''}</div>`}calendar.innerHTML=`<div class="grid"><div class="card s12"><div class="calhead"><button class="btn" onclick="cal.setMonth(cal.getMonth()-1);R.calendar()">←</button><h2>${cal.toLocaleString('en',{month:'long',year:'numeric'})}</h2><button class="btn" onclick="cal.setMonth(cal.getMonth()+1);R.calendar()">→</button></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><p class="muted">Click a day to write and save your plan, homework, deadlines or notes.</p></div></div>`};function dayNote(k){modalbox.innerHTML=`<div class="ey">Daily workspace</div><h2>${k}</h2><textarea id="dt" style="min-height:320px" placeholder="Write anything for this day..."></textarea><div class="toolbar"><button class="btn red" onclick="saveDay('${k}')">Save day</button><button class="btn" onclick="modal.classList.remove('open')">Cancel</button></div>`;dt.value=d.calendar[k]||'';modal.classList.add('open');setTimeout(()=>dt.focus(),30)}function saveDay(k){d.calendar[k]=dt.value;save();modal.classList.remove('open');R.calendar()}
R.profile=()=>{profile.innerHTML=`<div class="grid"><div class="card s6"><div class="ey">Identity</div><h2>My Profile</h2><input id="pn" value="${esc(d.profile.name)}"><br><br><input id="pg" value="${esc(d.profile.goal)}"><div class="toolbar"><button class="btn red" onclick="d.profile={name:pn.value,goal:pg.value};save()">Save profile</button></div></div><div class="card s6"><div class="ey">Direction</div><h2>MIT narrative</h2><div class="list">${['Academic strength','Software & technology','Building real projects','Research curiosity','Leadership & initiative'].map(x=>`<div class="item">${x}</div>`).join('')}</div></div></div>`};R.home();</script></body></html>
