,100);setTimeout(setLayout,500)}button.addEventListener('click',toggle);button.addEventListener('pointerup',e=>{if(e.pointerType==='touch')e.preventDefault()});frame.addEventListener('load',()=>{setTimeout(setLayout,300);setTimeout(setLayout,1000);setTimeout(setLayout,2000)});setInterval(setLayout,1000);</script></body></html>
