<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="outer" src="workspace-pro-v12.html?v=stable-v13"></iframe><script>
const outer=document.getElementById('outer');
const SUBJECTS=[['Mathematics','📐'],['Science','🧪'],['Physics','⚛️'],['Chemistry','⚗️'],['Biology','🧬'],['Computer Science','💻'],['English','📚'],['STEM','🔬'],['History','🏛️'],['Geography','🌍'],['French','🇫🇷'],['Dutch','🇳🇱']];
const KEY='nese-academic-tools-v13';
function deepest(){let w=outer;for(let i=0;i<10;i++){try{const d=w.contentDocument;if(!d)return null;const next=d.querySelector('iframe');if(!next)return d;w=next}catch(e){return null}}return null}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{subject:'Mathematics',pages:{},cards:[],tasks:[],calendar:{}}}catch(e){return{subject:'Mathematics',pages:{},cards:[],tasks:[],calendar:{}}}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
function subject(x,n){if(!x.pages[n])x.pages[n]=[{name:'Page 1',paper:'lined',text:''}];return x.pages[n]}
function install(){const d=deepest();if(!d||!d.body||!d.head)return;let s=d.getElementById('v13style');if(!s){s=d.createElement('style');s.id='v13style';s.textContent=`.v13bar{padding:10px 14px;border-bottom:1px solid #e4e7eb;background:#fff}.v13title{font:800 10px Arial;letter-spacing:.12em;text-transform:uppercase;color:#697586;margin-bottom:8px}.v13subjects{display:flex;gap:6px;overflow:auto}.v13subjects button,.v13pages button,.v13tool{border:1px solid #d8dde3;background:#fff;border-radius:8px;padding:7px 10px;color:#101820;cursor:pointer;white-space:nowrap}.v13subjects button.active,.v13pages button.active,.v13tool.active{background:#a31f34;color:#fff;border-color:#a31f34}.v13pages{display:flex;gap:6px;overflow:auto;margin-top:8px}.v13tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.v13paper{margin:12px;border:1px solid #dfe3e8;border-radius:9px;min-height:520px;padding:0;background:#fff}.v13paper textarea{width:100%;height:520px;box-sizing:border-box;border:0;outline:0;padding:18px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 27px,#dce1e7 28px);font:16px/28px Arial;resize:none}.v13paper.grid textarea{background-image:linear-gradient(#e5e8ec 1px,transparent 1px),linear-gradient(90deg,#e5e8ec 1px,transparent 1px);background-size:28px 28px}.v13search{margin:8px 0;padding:9px 11px;border:1px solid #d8dde3;border-radius:8px;width:100%;box-sizing:border-box}.v13modal{position:fixed;inset:0;background:#10182055;display:none;align-items:center;justify-content:center;z-index:2147483646}.v13modal.open{display:flex}.v13dialog{background:#fff;border-radius:14px;padding:20px;max-width:420px;width:calc(100% - 40px);box-shadow:0 18px 50px #10182035}.v13dialog button{margin:5px;padding:9px 12px;border:1px solid #d8dde3;border-radius:8px;background:#fff}.v13cards{padding:12px;border:1px solid #dfe3e8;border-radius:10px;margin-top:10px}.v13danger{color:#a31f34}.v13saved{font-size:11px;color:#697586;margin-left:auto}`;d.head.appendChild(s)}
let root=d.getElementById('v13academicTools');if(root)return;root=d.createElement('section');root.id='v13academicTools';root.innerHTML=`<div class="v13bar"><div class="v13title">Notebook</div><input class="v13search" id="v13search" placeholder="Search your workspace..."><div class="v13subjects"></div><div class="v13pages"></div><div class="v13tools"><button class="v13tool" id="v13new">＋ New page</button><button class="v13tool" id="v13rename">Rename</button><button class="v13tool" id="v13paper">Paper</button><button class="v13tool" id="v13duplicate">Duplicate</button><button class="v13tool v13danger" id="v13delete">Delete page</button><button class="v13tool" id="v13undo">Undo</button><button class="v13tool" id="v13redo">Redo</button><span class="v13saved" id="v13status">Saved</span></div></div><div class="v13paper" id="v13paperarea"><textarea id="v13text" placeholder="Write your notes here..."></textarea></div>`;
const academic=d.getElementById('academics')||d.body;academic.appendChild(root);const x=load();function current(){return subject(x,x.subject)[x.pages[x.subject].length?0:0]}
function render(){const pages=subject(x,x.subject);if(!pages[x.active])x.active=0;const sg=root.querySelector('.v13subjects'),pg=root.querySelector('.v13pages');sg.innerHTML='';SUBJECTS.forEach(([n,i])=>{const b=d.createElement('button');b.className=n===x.subject?'active':'';b.textContent=i+' '+n;b.onclick=()=>{persist();x.subject=n;x.active=0;save(x);render()};sg.appendChild(b)});pg.innerHTML='';pages.forEach((p,i)=>{const b=d.createElement('button');b.className=i===x.active?'active':'';b.textContent=p.name;b.onclick=()=>{persist();x.active=i;save(x);render()};pg.appendChild(b)});const p=pages[x.active];root.querySelector('#v13text').value=p.text||'';root.querySelector('#v13paperarea').classList.toggle('grid',p.paper==='grid');root.querySelector('#v13status').textContent='Saved locally'}
function persist(){const ta=root.querySelector('#v13text');if(ta){subject(x,x.subject)[x.active].text=ta.value;save(x)}}
root.querySelector('#v13text').oninput=()=>{persist();root.querySelector('#v13status').textContent='Saving…';clearTimeout(window.v13t);window.v13t=setTimeout(()=>root.querySelector('#v13status').textContent='Saved',350)};
root.querySelector('#v13new').onclick=()=>{persist();const p=subject(x,x.subject);p.push({name:'Page '+(p.length+1),paper:'lined',text:''});x.active=p.length-1;save(x);render()};root.querySelector('#v13rename').onclick=()=>{const p=subject(x,x.subject)[x.active];const n=prompt('Page name',p.name);if(n){p.name=n;save(x);render()}};root.querySelector('#v13duplicate').onclick=()=>{persist();const p=subject(x,x.subject),q=p[x.active];p.splice(x.active+1,0,{...q,name:q.name+' copy'});x.active++;save(x);render()};root.querySelector('#v13delete').onclick=()=>{const p=subject(x,x.subject);if(p.length===1)return;if(confirm('Delete this page?')){p.splice(x.active,1);x.active=Math.max(0,x.active-1);save(x);render()}};root.querySelector('#v13paper').onclick=()=>{const p=subject(x,x.subject)[x.active];p.paper=p.paper==='lined'?'grid':'lined';save(x);render()};root.querySelector('#v13undo').onclick=()=>d.execCommand('undo');root.querySelector('#v13redo').onclick=()=>d.execCommand('redo');root.querySelector('#v13search').oninput=e=>{const q=e.target.value.toLowerCase();root.querySelectorAll('.v13subjects button').forEach(b=>b.style.display=!q||b.textContent.toLowerCase().includes(q)?'':'none')};render()}
outer.addEventListener('load',()=>{setTimeout(install,400);setTimeout(install,1200);setTimeout(install,2400)});setInterval(install,1200);
</script></body></html>
