<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#frame{margin:0;width:100%;height:100%;border:0;overflow:hidden}#frame{display:block}</style></head><body><iframe id="frame" src="workspace-pro-v6.html?v=single-notebook"></iframe><script>
(()=>{
 const ROOT=document.getElementById('frame'); const KEY='nese-sidebar-v10'; let hidden=localStorage.getItem(KEY)==='1';
 const css=`body.v10-sidebar-hidden .app{grid-template-columns:1fr!important}body.v10-sidebar-hidden .side{display:none!important}body.v10-sidebar-hidden .main{width:100%!important;max-width:none!important;min-width:0!important;padding-left:48px!important;padding-right:48px!important}body.v10-sidebar-hidden .nb{width:100%!important;max-width:none!important}body.v10-sidebar-hidden .nb-canvas{height:760px!important}`;
 function sameDoc(doc){return doc&&doc.nodeType===9}
 function deepest(doc){let d=doc; for(let n=0;n<12;n++){const frames=[...d.querySelectorAll('iframe')]; if(!frames.length) break; let next=null; for(const fr of frames){try{if(fr.contentDocument&&fr.contentDocument.body){next=fr.contentDocument;break}}catch(e){}} if(!next)break; d=next;} return d;}
 function ensureStyle(d){if(!sameDoc(d)||!d.head)return;if(!d.getElementById('v10style')){const s=d.createElement('style');s.id='v10style';s.textContent=css;d.head.appendChild(s)}}
 function button(d){if(!sameDoc(d)||!d.body)return;let b=d.getElementById('v10toggle');if(!b){b=d.createElement('button');b.id='v10toggle';b.type='button';b.setAttribute('aria-label','Toggle sidebar');d.body.appendChild(b);b.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();hidden=!hidden;localStorage.setItem(KEY,hidden?'1':'0');refreshAll();},{passive:false})}b.textContent=hidden?'›':'‹';b.title=hidden?'Show sidebar':'Hide sidebar';b.style.cssText='position:fixed;top:14px;left:'+(hidden?'14px':'258px')+';z-index:2147483647;width:38px;height:38px;border:1px solid #cdd3da;border-radius:9px;background:#fff;color:#a31f34;font-size:21px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(16,24,32,.14);touch-action:manipulation';}
 function patch(d){if(!sameDoc(d)||!d.body)return;ensureStyle(d);d.body.classList.toggle('v10-sidebar-hidden',hidden);button(d);[...d.querySelectorAll('iframe')].forEach(fr=>{try{fr.addEventListener('load',()=>setTimeout(refreshAll,50),{once:true})}catch(e){}})}
 function refreshAll(){try{let d=ROOT.contentDocument;if(!d)return;patch(d);const deep=deepest(d);patch(deep);[...deep.querySelectorAll('iframe')].forEach(fr=>{try{fr.addEventListener('load',()=>setTimeout(refreshAll,50),{once:true})}catch(e){}})}catch(e){}}
 ROOT.addEventListener('load',()=>{setTimeout(refreshAll,100);setTimeout(refreshAll,500);setTimeout(refreshAll,1200)});
 setInterval(refreshAll,700); refreshAll();
})();</script></body></html>
