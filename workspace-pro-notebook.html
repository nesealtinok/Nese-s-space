<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Nese Workspace Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="workspace-pro.html?v=notebook5"></iframe><script>
const f=document.getElementById('app'),KEY='nese-notebook-v3';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const get=()=>{try{return JSON.parse(f.contentWindow.localStorage.getItem(KEY)||'null')||{pages:[{name:'Page 1',type:'lined',image:null}],active:0}}catch(e){return{pages:[{name:'Page 1',type:'lined',image:null}],active:0}}};
const put=x=>f.contentWindow.localStorage.setItem(KEY,JSON.stringify(x));
function install(w,d){if(d.getElementById('nb5css'))return;const s=d.createElement('style');s.id='nb5css';s.textContent=`.nb5{margin-top:20px;border:1px solid #dfe3e8;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 12px 32px #1018200d}.nb5-cover-wrap{padding:28px;background:linear-gradient(135deg,#f8f5ef,#ebe6dc);display:flex;justify-content:center}.nb5-cover{width:min(390px,90%);aspect-ratio:3/4;border-radius:20px;position:relative;overflow:hidden;background:#f2eee7;border:1px solid #cec5b8;box-shadow:0 22px 48px #10182028}.nb5-cover:before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#111 0 5px,transparent 6px);background-size:43px 43px;background-position:4px 4px}.nb5-cover:after{content:'';position:absolute;right:-1px;top:50%;width:125px;height:66px;background:#eee7db;border:1px solid #c7bdaf;border-right:0;border-radius:38px 0 0 38px}.nb5-cover-label{position:absolute;z-index:2;top:38%;left:10%;right:10%;padding:18px 8px;text-align:center;background:#ece6dcdd;border:1px solid #d4cabd;color:#fff;text-shadow:0 1px 2px #555;font:italic 38px Georgia,serif;letter-spacing:.2px}.nb5-cover-label span{display:block;font-size:27px;margin-top:5px}.nb5-open{position:absolute;z-index:4;bottom:25px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;background:#a31f34;color:white;padding:12px 26px;font-weight:700;box-shadow:0 6px 15px #10182030}.nb5-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #e4e7eb;background:#fafafa}.nb5-head small{display:block;color:#697586}.nb5-actions,.nb5-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.nb5-actions input{width:130px}.nb5-btn,.nb5-tool{border:1px solid #ccd2d9;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.nb5-primary,.nb5-tool.active{background:#a31f34!important;color:#fff!important;border-color:#a31f34!important}.nb5-pages{display:flex;gap:6px;overflow:auto;padding:8px 10px;background:#f7f8fa;border-bottom:1px solid #e4e7eb}.nb5-tab{border:1px solid #d7dce2;background:#fff;border-radius:7px;padding:7px 11px;white-space:nowrap}.nb5-tab.active{background:#101820;color:#fff}.nb5-paper{padding:14px;background:#eef0f3}.nb5-paper-inner{background:#fff;border:1px solid #dfe3e8;border-radius:9px;overflow:hidden}.nb5-canvas{display:block;width:100%;height:650px;touch-action:none;background-color:#fff;background-size:100% 28px;background-position:0 0}.nb5-canvas.lined{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#dce1e7 28px)}.nb5-canvas.grid{background-image:linear-gradient(#dce1e7 1px,transparent 1px),linear-gradient(90deg,#dce1e7 1px,transparent 1px);background-size:28px 28px}.nb5-canvas.dot{background-image:radial-gradient(#d5dbe2 .8px,transparent .8px);background-size:18px 18px}.nb5-tools{padding:9px 10px;border-top:1px solid #e4e7eb;background:#fff}.nb5-color{width:24px;height:24px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #c8ced6}.nb5-footer{padding:8px 12px;color:#697586;font-size:11px;border-top:1px solid #e4e7eb;background:#fafafa;display:flex;justify-content:space-between}.nb5-modal{position:fixed;inset:0;background:#10182066;z-index:99999;display:grid;place-items:center;padding:20px}.nb5-modal-card{width:min(430px,92vw);background:white;border-radius:18px;padding:24px;box-shadow:0 25px 70px #10182055}.nb5-types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.nb5-type{border:1px solid #d5dbe2;border-radius:12px;padding:14px 8px;background:#fff;cursor:pointer;text-align:center}.nb5-type b{display:block;margin-top:8px}.nb5-preview{height:75px;border:1px solid #e1e5e9;border-radius:8px;background:#fff}.nb5-preview.l{background:repeating-linear-gradient(to bottom,#fff 0,#fff 15px,#dce1e7 16px)}.nb5-preview.g{background-image:linear-gradient(#dce1e7 1px,transparent 1px),linear-gradient(90deg,#dce1e7 1px,transparent 1px);background-size:16px 16px}.nb5-preview.d{background-image:radial-gradient(#cfd6de 1px,transparent 1px);background-size:12px 12px}@media(max-width:720px){.nb5-head{align-items:flex-start;flex-direction:column}.nb5-canvas{height:570px}}`;d.head.appendChild(s);mount(w,d)}
function mount(w,d){const a=d.getElementById('academics');if(!a||!a.classList.contains('active'))return;if(a.querySelector('#nb5'))return;const target=[...a.querySelectorAll('.card')].find(c=>/Apple Pencil workspace/i.test(c.textContent));if(!target)return;const box=d.createElement('div');box.className='card s12 nb5';box.id='nb5';box.innerHTML='<div style="padding:24px"><div class="ey">Notebook</div><h2>nese’s notebook</h2><p class="muted">A multi-page handwritten notebook inside your existing Apple Pencil workspace.</p><div id="nb5mount"></div></div>';a.appendChild(box);cover(w,d)}
function cover(w,d){const r=d.getElementById('nb5mount');r.innerHTML='<div class="nb5-cover-wrap"><div class="nb5-cover"><div class="nb5-cover-label">nese’s<span>notebook</span></div><button class="nb5-open">Open notebook</button></div></div>';r.querySelector('.nb5-open').onclick=()=>book(w,d)}
function newPage(w,d,x){const modal=d.createElement('div');modal.className='nb5-modal';modal.innerHTML='<div class="nb5-modal-card"><h2>New page</h2><p class="muted">What kind of paper do you want?</p><div class="nb5-types"><button class="nb5-type" data-type="lined"><div class="nb5-preview l"></div><b>Lines</b></button><button class="nb5-type" data-type="grid"><div class="nb5-preview g"></div><b>Grid</b></button><button class="nb5-type" data-type="dot"><div class="nb5-preview d"></div><b>Dotted</b></button></div><button class="nb5-btn" id="nb5Cancel">Cancel</button></div>';d.body.appendChild(modal);modal.querySelector('#nb5Cancel').onclick=()=>modal.remove();modal.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{x.pages.push({name:'Page '+(x.pages.length+1),type:b.dataset.type,image:null});x.active=x.pages.length-1;put(x);modal.remove();book(w,d)})}
function book(w,d){const r=d.getElementById('nb5mount');let x=get();x.active=Math.max(0,Math.min(x.active,x.pages.length-1));put(x);r.innerHTML=`<div class="nb5-head"><div><b>nese’s notebook</b><small>${esc(x.pages[x.active].name)} · ${x.pages[x.active].type}</small></div><div class="nb5-actions"><input id="nb5name" value="${esc(x.pages[x.active].name)}"><button class="nb5-btn" id="nb5rename">Rename</button><button class="nb5-btn nb5-primary" id="nb5new">＋ New page</button><button class="nb5-btn" id="nb5cover">Cover</button></div></div><div class="nb5-pages" id="nb5pages"></div><div class="nb5-paper"><div class="nb5-paper-inner"><canvas id="nb5canvas" class="nb5-canvas ${x.pages[x.active].type}"></canvas><div class="nb5-tools"><button class="nb5-tool active" data-t="pen">✎ Pen</button><button class="nb5-tool" data-t="pencil">✏ Pencil</button><button class="nb5-tool" data-t="marker">🖍 Marker</button><button class="nb5-tool" data-t="eraser">⌫ Eraser</button><button class="nb5-color" data-c="#101820" style="background:#101820"></button><button class="nb5-color" data-c="#a31f34" style="background:#a31f34"></button><button class="nb5-color" data-c="#2563eb" style="background:#2563eb"></button><button class="nb5-color" data-c="#16a34a" style="background:#16a34a"></button><button class="nb5-color" data-c="#f59e0b" style="background:#f59e0b"></button><button class="nb5-color" data-c="#7c3aed" style="background:#7c3aed"></button><span class="muted">Size</span><input id="nb5size" type="range" min="1" max="12" value="3"><button class="nb5-tool" id="nb5undo">↶</button><button class="nb5-tool" id="nb5redo">↷</button><button class="nb5-tool" id="nb5clear">Clear</button><button class="nb5-tool" id="nb5save">✓ Save</button><button class="nb5-tool" id="nb5delete" style="color:#a31f34">Delete page</button></div></div></div><div class="nb5-footer"><span id="nb5status">Auto-saved</span><span>Page ${x.active+1} of ${x.pages.length}</span></div>`;const pages=d.getElementById('nb5pages');x.pages.forEach((p,i)=>{const b=d.createElement('button');b.className='nb5-tab'+(i===x.active?' active':'');b.textContent=p.name;b.onclick=()=>{saveCanvas(w,d,x);x.active=i;put(x);book(w,d)};pages.appendChild(b)});d.getElementById('nb5new').onclick=()=>{saveCanvas(w,d,x);newPage(w,d,x)};d.getElementById('nb5cover').onclick=()=>cover(w,d);d.getElementById('nb5rename').onclick=()=>{const n=d.getElementById('nb5name').value.trim();if(n){x.pages[x.active].name=n;put(x);book(w,d)}};d.getElementById('nb5delete').onclick=()=>{if(x.pages.length<2)return;if(confirm('Delete this page?')){x.pages.splice(x.active,1);x.active=Math.max(0,x.active-1);put(x);book(w,d)}};canvas(w,d,x)}
function saveCanvas(w,d,x){const c=d.getElementById('nb5canvas');if(c){x.pages[x.active].image=c.toDataURL('image/png');put(x)}}
function canvas(w,d,x){const c=d.getElementById('nb5canvas'),ctx=c.getContext('2d'),z=Math.max(1,Math.min(2.5,w.devicePixelRatio||1));c.width=c.clientWidth*z;c.height=c.clientHeight*z;ctx.scale(z,z);ctx.lineCap='round';ctx.lineJoin='round';let tool='pen',color='#101820',size=3,down=false,undo=[],redo=[];const shot=()=>c.toDataURL('image/png');const load=u=>{ctx.clearRect(0,0,c.clientWidth,c.clientHeight);if(!u)return;const im=new Image;im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight);im.src=u};load(x.pages[x.active].image);const save=()=>{x.pages[x.active].image=shot();put(x);const s=d.getElementById('nb5status');if(s)s.textContent='Saved automatically · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};const pos=e=>{const q=c.getBoundingClientRect();return{x:e.clientX-q.left,y:e.clientY-q.top}};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);undo.push(shot());redo=[];const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!down)return;const p=pos(e),pressure=e.pressure>0?e.pressure:.5;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=color;ctx.globalAlpha=tool==='marker'?.28:1;const mult=tool==='marker'?3.5:tool==='pencil'?.65:tool==='eraser'?4:1;ctx.lineWidth=Math.max(.7,size*mult*(.65+pressure*.7));ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>{down=false;ctx.globalAlpha=1;ctx.closePath();save()};c.onpointercancel=()=>down=false;d.querySelectorAll('#nb5 [data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;d.querySelectorAll('#nb5 [data-t]').forEach(q=>q.classList.remove('active'));b.classList.add('active')});d.querySelectorAll('#nb5 [data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;tool='pen';d.querySelectorAll('#nb5 [data-t]').forEach(q=>q.classList.remove('active'));d.querySelector('#nb5 [data-t="pen"]').classList.add('active')});d.getElementById('nb5size').oninput=e=>size=+e.target.value;d.getElementById('nb5save').onclick=save;d.getElementById('nb5clear').onclick=()=>{if(confirm('Clear this page?')){undo.push(shot());ctx.clearRect(0,0,c.clientWidth,c.clientHeight);save()}};d.getElementById('nb5undo').onclick=()=>{if(undo.length){redo.push(shot());load(undo.pop());save()}};d.getElementById('nb5redo').onclick=()=>{if(redo.length){undo.push(shot());load(redo.pop());save()}}}
f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;setTimeout(()=>install(w,d),400);setTimeout(()=>install(w,d),1200)});
</script></body></html>
