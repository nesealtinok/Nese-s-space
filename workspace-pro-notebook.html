<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#appFrame{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="appFrame" src="workspace-pro.html"></iframe><script>
const frame=document.getElementById('appFrame');let ready=false;
function css(w,d){const s=d.createElement('style');s.textContent=`.side{background:#f4f5f7!important;color:#101820!important}.side .brand b,.side .nav button{color:#a31f34!important}.side .brand small,.side .label{color:#555!important}.side .nav button.active,.side .nav button:hover{background:#a31f3412!important;color:#a31f34!important;box-shadow:inset 3px 0 #a31f34!important}.side .brand .logo{font-size:0!important;background:transparent!important;position:relative!important}.side .brand .logo:after{content:'M';font:900 34px/42px Arial Black,Arial,sans-serif;color:#a31f34;position:absolute;inset:0;text-align:center;letter-spacing:-5px}.top,.topbar,.header,.pagebar,.viewbar{background:#f4f5f7!important}.main{max-width:1540px!important}.notebook-wrap{margin-top:8px}.nb-cover{width:min(430px,100%);aspect-ratio:3/4;position:relative;margin:12px auto 20px;border-radius:18px;overflow:hidden;background:#f1ede4;box-shadow:0 22px 50px #10182025;border:1px solid #d6d0c5}.nb-cover:before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#151515 0 5px,transparent 6px);background-size:45px 45px;background-position:4px 4px;opacity:.95}.nb-cover:after{content:'';position:absolute;right:-1px;top:50%;width:125px;height:62px;border:1px solid #c9c1b4;border-right:0;border-radius:34px 0 0 34px;background:#eee8dd;box-shadow:0 3px 8px #0002}.nb-cover-title{position:absolute;z-index:2;left:15%;right:15%;top:42%;text-align:center;color:#eeeae2;text-shadow:0 1px 1px #777;filter:drop-shadow(0 1px 0 #aaa);font-family:Georgia,serif;font-style:italic;font-size:42px;line-height:1.05;letter-spacing:-2px}.nb-cover-title small{display:block;font-size:30px;margin-top:8px}.nb-cover-btn{position:absolute;z-index:3;bottom:28px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;background:#a31f34;color:#fff;padding:12px 23px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px #0003}.nb-shell{background:#fff;border:1px solid #dfe3e8;border-radius:16px;overflow:hidden;box-shadow:0 12px 35px #10182010}.nb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid #e4e7eb;background:#fafafa}.nb-title{font-weight:800;font-size:17px}.nb-actions{display:flex;gap:7px;flex-wrap:wrap}.nb-btn{border:1px solid #cdd3da;background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;color:#101820}.nb-btn.primary{background:#a31f34;border-color:#a31f34;color:#fff}.nb-pages{display:flex;gap:6px;overflow:auto;padding:9px 12px;border-bottom:1px solid #e4e7eb;background:#f7f8fa}.nb-tab{border:1px solid #d7dce2;background:#fff;border-radius:7px;padding:7px 11px;white-space:nowrap;cursor:pointer;font-size:12px}.nb-tab.active{background:#101820;color:#fff;border-color:#101820}.nb-body{padding:16px;background:#f0f1f3}.nb-paper{position:relative;background:#fff;min-height:720px;border:1px solid #dfe3e8;border-radius:10px;box-shadow:0 8px 25px #10182010;overflow:hidden}.nb-paper canvas{display:block;width:100%;height:720px;touch-action:none;background:#fff}.nb-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid #e4e7eb;background:#fff}.nb-tool{border:1px solid #ccd2d9;background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:12px}.nb-tool.active{background:#a31f34;color:#fff;border-color:#a31f34}.nb-color{width:25px;height:25px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c8ced6;cursor:pointer}.nb-range{width:90px}.nb-footer{padding:9px 14px;color:#697586;font-size:11px;border-top:1px solid #e4e7eb;background:#fafafa;display:flex;justify-content:space-between}.nb-empty{text-align:center;padding:70px 20px;color:#697586}.nb-rename{border:1px solid #ccd2d9;border-radius:7px;padding:7px 9px;width:170px}@media(max-width:720px){.nb-cover{width:80%;}.nb-paper canvas{height:620px}.nb-paper{min-height:620px}.nb-head{align-items:flex-start;flex-direction:column}.nb-rename{width:100%}}`;
d.head.appendChild(s)}
function store(w){try{return JSON.parse(w.localStorage.getItem('nese-notebook-v1')||'null')||{pages:[],active:0}}catch(e){return{pages:[],active:0}}}function put(w,x){w.localStorage.setItem('nese-notebook-v1',JSON.stringify(x))}
function notebook(w,d){const host=d.getElementById('academics');if(!host)return;let card=[...host.querySelectorAll('.card')].find(x=>/Apple Pencil workspace/i.test(x.textContent));if(!card)return;card.innerHTML=`<div class="notebook-wrap" id="nb"><div class="ey">Personal handwriting notebook</div><h2>My Notebook</h2><p class="muted">A real multi-page Apple Pencil notebook for your Academics workspace.</p><div id="nbRoot"></div></div>`;renderNB(w,d)}
function renderNB(w,d){const root=d.getElementById('nbRoot');if(!root)return;let x=store(w);if(!x.pages.length)x.pages=[{name:'Page 1',image:null}];if(x.active>=x.pages.length)x.active=x.pages.length-1;put(w,x);if(!root.dataset.open){root.innerHTML=`<div class="nb-cover"><div class="nb-cover-title">nese's<small>notebook</small></div><button class="nb-cover-btn" id="openNB">Open notebook</button></div>`;root.querySelector('#openNB').onclick=()=>{root.dataset.open='1';renderNB(w,d)}}else{root.innerHTML=`<div class="nb-shell"><div class="nb-head"><div><div class="nb-title">nese's notebook</div><small class="muted">${esc(x.pages[x.active].name)}</small></div><div class="nb-actions"><input class="nb-rename" id="nbName" value="${esc(x.pages[x.active].name)}"><button class="nb-btn" id="renameNB">Rename</button><button class="nb-btn primary" id="newNB">＋ New page</button><button class="nb-btn" id="closeNB">Cover</button></div></div><div class="nb-pages" id="nbTabs"></div><div class="nb-body"><div class="nb-paper"><canvas id="nbCanvas"></canvas></div><div class="nb-tools"><button class="nb-tool active" data-tool="pen">✎ Pen</button><button class="nb-tool" data-tool="pencil">✏ Pencil</button><button class="nb-tool" data-tool="marker">🖍 Marker</button><button class="nb-tool" data-tool="eraser">⌫ Eraser</button><span class="muted">Color</span><button class="nb-color" data-color="#101820" style="background:#101820"></button><button class="nb-color" data-color="#a31f34" style="background:#a31f34"></button><button class="nb-color" data-color="#2563eb" style="background:#2563eb"></button><button class="nb-color" data-color="#16a34a" style="background:#16a34a"></button><button class="nb-color" data-color="#f59e0b" style="background:#f59e0b"></button><button class="nb-color" data-color="#7c3aed" style="background:#7c3aed"></button><span class="muted">Size</span><input class="nb-range" id="nbSize" type="range" min="1" max="12" value="3"><button class="nb-tool" id="nbUndo">↶ Undo</button><button class="nb-tool" id="nbRedo">↷ Redo</button><button class="nb-tool" id="nbClear">Clear</button><button class="nb-tool" id="nbSave">✓ Save</button><button class="nb-tool" id="nbDelete">Delete page</button></div><div class="nb-footer"><span id="nbStatus">Auto-saved</span><span>Page ${x.active+1} of ${x.pages.length}</span></div></div>`;const tabs=root.querySelector('#nbTabs');x.pages.forEach((p,i)=>{const b=d.createElement('button');b.className='nb-tab'+(i===x.active?' active':'');b.textContent=p.name;b.onclick=()=>{saveCurrent(w,d);x.active=i;put(w,x);renderNB(w,d)};tabs.appendChild(b)});root.querySelector('#closeNB').onclick=()=>{delete root.dataset.open;renderNB(w,d)};root.querySelector('#newNB').onclick=()=>{saveCurrent(w,d);x.pages.push({name:'Page '+(x.pages.length+1),image:null});x.active=x.pages.length-1;put(w,x);renderNB(w,d)};root.querySelector('#renameNB').onclick=()=>{const n=root.querySelector('#nbName').value.trim();if(n){x.pages[x.active].name=n;put(w,x);renderNB(w,d)}};root.querySelector('#nbDelete').onclick=()=>{if(x.pages.length===1){alert('A notebook needs at least one page.');return}if(confirm('Delete this page?')){x.pages.splice(x.active,1);x.active=Math.max(0,x.active-1);put(w,x);renderNB(w,d)}};initNBCanvas(w,d,x)} }
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function initNBCanvas(w,d,x){const c=d.getElementById('nbCanvas');if(!c)return;const z=Math.max(1,Math.min(2.5,w.devicePixelRatio||1));c.width=Math.floor(c.clientWidth*z);c.height=Math.floor(c.clientHeight*z);const ctx=c.getContext('2d');ctx.scale(z,z);ctx.lineCap='round';ctx.lineJoin='round';let tool='pen',color='#101820',size=3,drawing=false;let undo=[],redo=[];const snapshot=()=>c.toDataURL('image/png');const restore=url=>{if(!url)return;const im=new Image();im.onload=()=>{ctx.clearRect(0,0,c.clientWidth,c.clientHeight);ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight)};im.src=url};if(x.pages[x.active].image)restore(x.pages[x.active].image);const save=()=>{x.pages[x.active].image=snapshot();put(w,x);const s=d.getElementById('nbStatus');if(s)s.textContent='Saved automatically · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);undo.push(snapshot());redo=[];const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!drawing)return;const p=pos(e);const pressure=e.pressure&&e.pressure>0?e.pressure:.5;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=color;let mult=tool==='marker'?3.8:tool==='pencil'?.65:1;ctx.globalAlpha=tool==='marker'?.32:1;ctx.lineWidth=Math.max(.7,size*mult*(.7+pressure*.65));ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>{drawing=false;ctx.closePath();ctx.globalAlpha=1;save()};c.onpointercancel=()=>{drawing=false};rootTools(d,x,ctx,save,restore,undo,redo,()=>snapshot(),c)}
function rootTools(d,x,ctx,save,restore,undo,redo,snap,c){const r=d.getElementById('nbRoot');r.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{r.querySelectorAll('[data-tool]').forEach(q=>q.classList.remove('active'));b.classList.add('active');window._nbTool=b.dataset.tool});r.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{window._nbColor=b.dataset.color;r.querySelectorAll('[data-tool]').forEach(q=>q.classList.remove('active'));r.querySelector('[data-tool="pen"]').classList.add('active')});let tool=()=>window._nbTool||'pen',color=()=>window._nbColor||'#101820';const oldDown=c.onpointerdown,oldMove=c.onpointermove;c.onpointerdown=e=>{window._nbTool=tool();window._nbColor=color();oldDown(e)};c.onpointermove=e=>{window._nbTool=tool();window._nbColor=color();oldMove(e)};r.querySelector('#nbSize').oninput=e=>window._nbSize=+e.target.value;window._nbSize=3;r.querySelector('#nbUndo').onclick=()=>{if(!undo.length)return;redo.push(snap());restore(undo.pop())};r.querySelector('#nbRedo').onclick=()=>{if(!redo.length)return;undo.push(snap());restore(redo.pop())};r.querySelector('#nbClear').onclick=()=>{if(confirm('Clear this page?')){undo.push(snap());ctx.clearRect(0,0,c.clientWidth,c.clientHeight);save()}};r.querySelector('#nbSave').onclick=save;r.querySelector('#nbDelete').onclick=()=>{};}
function saveCurrent(w,d){const c=d.getElementById('nbCanvas');if(c){let x=store(w);x.pages[x.active].image=c.toDataURL('image/png');put(w,x)}}
function enhance(){const w=frame.contentWindow,d=w.document;if(!d.body)return;css(w,d);if(!w.R||!w.R.academics)return;if(!w._nbWrapped){const old=w.R.academics;w.R.academics=function(){old();setTimeout(()=>notebook(w,d),20)};w._nbWrapped=true}notebook(w,d)}
frame.addEventListener('load',()=>{setTimeout(enhance,250);setTimeout(enhance,900);setTimeout(enhance,1800)});
</script></body></html>
