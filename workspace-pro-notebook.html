<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Nese Workspace Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" src="workspace-pro.html?v=notebook4"></iframe><script>
const f=document.getElementById('app');
function addCSS(d){if(d.getElementById('nbcss'))return;const s=d.createElement('style');s.id='nbcss';s.textContent=`.side{background:#f4f5f7!important;color:#101820!important}.side .brand b,.side .nav button{color:#a31f34!important}.side .brand small,.side .label{color:#555!important}.side .nav button.active,.side .nav button:hover{background:#a31f3412!important;color:#a31f34!important;box-shadow:inset 3px 0 #a31f34!important}.side .brand .logo{font-size:0!important;background:transparent!important;position:relative!important}.side .brand .logo:after{content:'M';font:900 34px/42px Arial Black,Arial,sans-serif;color:#a31f34;position:absolute;inset:0;text-align:center}.nb-add{margin-top:20px}.nb-cover{width:min(430px,92%);aspect-ratio:3/4;margin:14px auto 8px;border-radius:18px;overflow:hidden;position:relative;background:#f1eee8;border:1px solid #d5cec3;box-shadow:0 20px 45px #10182022}.nb-cover:before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#111 0 5px,transparent 6px);background-size:44px 44px;background-position:4px 4px}.nb-cover:after{content:'';position:absolute;right:0;top:50%;width:125px;height:62px;background:#eee8dd;border:1px solid #c9c1b4;border-right:0;border-radius:34px 0 0 34px}.nb-cover-title{position:absolute;z-index:2;left:10%;right:10%;top:42%;text-align:center;color:#eeeae2;text-shadow:0 1px 1px #777;font:italic 43px Georgia,serif}.nb-cover-title span{display:block;font-size:31px;margin-top:7px}.nb-open{position:absolute;z-index:3;bottom:28px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;background:#a31f34;color:#fff;padding:11px 23px;font-weight:700;cursor:pointer}.nb-book{background:#fff;border:1px solid #dfe3e8;border-radius:15px;overflow:hidden}.nb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid #e4e7eb;background:#fafafa}.nb-head small{display:block;color:#697586}.nb-actions,.nb-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.nb-actions input{width:140px}.nb-btn,.nb-tool{border:1px solid #ccd2d9;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.nb-primary,.nb-tool.active{background:#a31f34;color:#fff;border-color:#a31f34}.nb-pages{display:flex;gap:6px;overflow:auto;padding:8px 10px;background:#f7f8fa;border-bottom:1px solid #e4e7eb}.nb-tab{border:1px solid #d7dce2;background:#fff;border-radius:7px;padding:7px 11px;white-space:nowrap}.nb-tab.active{background:#101820;color:#fff}.nb-paper{padding:14px;background:#f0f1f3}.nb-paper canvas{display:block;width:100%;height:650px;background:#fff;border:1px solid #dfe3e8;border-radius:9px;touch-action:none;background-image:radial-gradient(#d7dce2 .8px,transparent .8px);background-size:18px 18px}.nb-tools{padding:9px 10px;border:1px solid #e4e7eb;border-top:0;background:#fff}.nb-color{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c8ced6}.nb-footer{padding:8px 12px;color:#697586;font-size:11px;border-top:1px solid #e4e7eb;background:#fafafa;display:flex;justify-content:space-between}@media(max-width:720px){.nb-head{align-items:flex-start;flex-direction:column}.nb-paper canvas{height:570px}}`;d.head.appendChild(s)}
const key='nese-notebook-v2';function data(w){try{return JSON.parse(w.localStorage.getItem(key)||'null')||{pages:[{name:'Page 1',image:null}],active:0}}catch(e){return{pages:[{name:'Page 1',image:null}],active:0}}}function put(w,x){w.localStorage.setItem(key,JSON.stringify(x))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function install(w,d){addCSS(d);const observer=new MutationObserver(()=>tryMount(w,d));observer.observe(d.body,{childList:true,subtree:true});setInterval(()=>tryMount(w,d),700);tryMount(w,d)}
function tryMount(w,d){const a=d.getElementById('academics');if(!a||!a.classList.contains('active'))return;const old=a.querySelector('.card');const target=[...a.querySelectorAll('.card')].find(c=>/Apple Pencil workspace/i.test(c.textContent));if(!target)return;if(a.querySelector('#nbAddOn'))return;const wrap=d.createElement('div');wrap.className='card s12 nb-add';wrap.id='nbAddOn';wrap.innerHTML='<div class="ey">Notebook</div><h2>nese’s notebook</h2><p class="muted">A real multi-page notebook added to your existing Apple Pencil workspace — the original area above is untouched.</p><div id="nbMount"></div>';a.appendChild(wrap);renderCover(w,d)}
function renderCover(w,d){const r=d.getElementById('nbMount');if(!r)return;r.innerHTML='<div class="nb-cover"><div class="nb-cover-title">nese’s<span>notebook</span></div><button class="nb-open">Open notebook</button></div>';r.querySelector('.nb-open').onclick=()=>renderBook(w,d)}
function renderBook(w,d){const r=d.getElementById('nbMount');let x=data(w);if(!x.pages.length)x.pages=[{name:'Page 1',image:null}];x.active=Math.min(x.active,x.pages.length-1);put(w,x);r.innerHTML=`<div class="nb-book"><div class="nb-head"><div><b>nese’s notebook</b><small>${esc(x.pages[x.active].name)}</small></div><div class="nb-actions"><input id="nbName" value="${esc(x.pages[x.active].name)}"><button class="nb-btn" id="nbRename">Rename</button><button class="nb-btn nb-primary" id="nbNew">＋ New page</button><button class="nb-btn" id="nbCover">Cover</button></div></div><div class="nb-pages" id="nbPages"></div><div class="nb-paper"><canvas id="nbCanvas"></canvas><div class="nb-tools"><button class="nb-tool active" data-tool="pen">✎ Pen</button><button class="nb-tool" data-tool="pencil">✏ Pencil</button><button class="nb-tool" data-tool="marker">🖍 Marker</button><button class="nb-tool" data-tool="eraser">⌫ Eraser</button><button class="nb-color" data-color="#101820" style="background:#101820"></button><button class="nb-color" data-color="#a31f34" style="background:#a31f34"></button><button class="nb-color" data-color="#2563eb" style="background:#2563eb"></button><button class="nb-color" data-color="#16a34a" style="background:#16a34a"></button><button class="nb-color" data-color="#f59e0b" style="background:#f59e0b"></button><button class="nb-color" data-color="#7c3aed" style="background:#7c3aed"></button><span class="muted">Size</span><input id="nbSize" type="range" min="1" max="12" value="3"><button class="nb-tool" id="nbUndo">↶ Undo</button><button class="nb-tool" id="nbRedo">↷ Redo</button><button class="nb-tool" id="nbClear">Clear</button><button class="nb-tool" id="nbSave">✓ Save</button><button class="nb-tool" id="nbDelete" style="color:#a31f34">Delete page</button></div><div class="nb-footer"><span id="nbStatus">Auto-saved</span><span>Page ${x.active+1} of ${x.pages.length}</span></div></div>`;const pages=r.querySelector('#nbPages');x.pages.forEach((p,i)=>{const b=d.createElement('button');b.className='nb-tab'+(i===x.active?' active':'');b.textContent=p.name;b.onclick=()=>{savePage(w,d);x.active=i;put(w,x);renderBook(w,d)};pages.appendChild(b)});r.querySelector('#nbCover').onclick=()=>renderCover(w,d);r.querySelector('#nbNew').onclick=()=>{savePage(w,d);x.pages.push({name:'Page '+(x.pages.length+1),image:null});x.active=x.pages.length-1;put(w,x);renderBook(w,d)};r.querySelector('#nbRename').onclick=()=>{const n=r.querySelector('#nbName').value.trim();if(n){x.pages[x.active].name=n;put(w,x);renderBook(w,d)}};r.querySelector('#nbDelete').onclick=()=>{if(x.pages.length===1)return;if(confirm('Delete this page?')){x.pages.splice(x.active,1);x.active=Math.max(0,x.active-1);put(w,x);renderBook(w,d)}};canvas(w,d,x)}
function canvas(w,d,x){const c=d.getElementById('nbCanvas'),ctx=c.getContext('2d'),z=Math.max(1,Math.min(2.5,w.devicePixelRatio||1));c.width=c.clientWidth*z;c.height=c.clientHeight*z;ctx.scale(z,z);ctx.lineCap='round';ctx.lineJoin='round';let tool='pen',color='#101820',size=3,down=false,undo=[],redo=[];const snap=()=>c.toDataURL('image/png');const load=u=>{ctx.clearRect(0,0,c.clientWidth,c.clientHeight);if(!u)return;const im=new Image;im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight);im.src=u};load(x.pages[x.active].image);const save=()=>{x.pages[x.active].image=snap();put(w,x);const s=d.getElementById('nbStatus');if(s)s.textContent='Saved automatically · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};const pos=e=>{const q=c.getBoundingClientRect();return{x:e.clientX-q.left,y:e.clientY-q.top}};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);undo.push(snap());redo=[];const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!down)return;const p=pos(e),pressure=e.pressure>0?e.pressure:.5;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=color;ctx.globalAlpha=tool==='marker'?.28:1;const mult=tool==='marker'?3.5:tool==='pencil'?.65:tool==='eraser'?4:1;ctx.lineWidth=Math.max(.7,size*mult*(.65+pressure*.7));ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>{down=false;ctx.globalAlpha=1;ctx.closePath();save()};c.onpointercancel=()=>down=false;d.querySelectorAll('#nbMount [data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;d.querySelectorAll('#nbMount [data-tool]').forEach(q=>q.classList.remove('active'));b.classList.add('active')});d.querySelectorAll('#nbMount [data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;tool='pen';d.querySelectorAll('#nbMount [data-tool]').forEach(q=>q.classList.remove('active'));d.querySelector('#nbMount [data-tool="pen"]').classList.add('active')});d.getElementById('nbSize').oninput=e=>size=+e.target.value;d.getElementById('nbSave').onclick=save;d.getElementById('nbClear').onclick=()=>{if(confirm('Clear this page?')){undo.push(snap());ctx.clearRect(0,0,c.clientWidth,c.clientHeight);save()}};d.getElementById('nbUndo').onclick=()=>{if(undo.length){redo.push(snap());load(undo.pop());save()}};d.getElementById('nbRedo').onclick=()=>{if(redo.length){undo.push(snap());load(redo.pop());save()}}}
function savePage(w,d){const c=d.getElementById('nbCanvas');if(!c)return;const x=data(w);x.pages[x.active].image=c.toDataURL('image/png');put(w,x)}
f.addEventListener('load',()=>{const w=f.contentWindow,d=f.contentDocument;setTimeout(()=>install(w,d),300);setTimeout(()=>install(w,d),1000)});
</script></body></html>
