<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>Nese Workspace Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#workspaceFrame{width:100%;height:100%;border:0;display:block}#sidebarToggle{position:fixed;top:14px;left:258px;z-index:2147483647;width:40px;height:40px;border:1px solid #cdd3da;border-radius:10px;background:#fff;color:#a31f34;font:700 22px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;box-shadow:0 5px 18px rgba(16,24,32,.18);-webkit-tap-highlight-color:transparent;touch-action:manipulation}#sidebarToggle.hidden{left:14px}</style></head><body><iframe id="workspaceFrame" src="workspace-pro-v6.html?v=stable-notebook"></iframe><button id="sidebarToggle" aria-label="Hide sidebar" title="Hide sidebar">‹</button><script>
const frame=document.getElementById('workspaceFrame'),button=document.getElementById('sidebarToggle');
let hidden=localStorage.getItem('nese-sidebar-final')==='1';

function apply(){const d=deepest();if(!d||!d.body)return false;let s=d.getElementById('neseSidebarFinalStyle');if(!s){s=d.createElement('style');s.id='neseSidebarFinalStyle';d.head.appendChild(s)}s.textContent=hidden?'.app{grid-template-columns:0 1fr!important}.side{display:none!important}.main{width:100%!important;max-width:none!important;padding-left:32px!important;padding-right:32px!important}.nb,.nb-canvas{max-width:none!important;width:100%!important}.nb-canvas{height:760px!important}':' .app{grid-template-columns:250px 1fr!important}.side{display:block!important}.main{width:100%;max-width:1540px}';button.classList.toggle('hidden',hidden);button.textContent=hidden?'›':'‹';button.setAttribute('aria-label',hidden?'Show sidebar':'Hide sidebar');button.title=hidden?'Show sidebar':'Hide sidebar';return true}
function toggle(e){if(e){e.preventDefault();e.stopPropagation()}hidden=!hidden;localStorage.setItem('nese-sidebar-final',hidden?'1':'0');apply()}
button.addEventListener('click',toggle);button.addEventListener('pointerup',e=>{if(e.pointerType==='touch')toggle(e)});frame.addEventListener('load',()=>{setTimeout(apply,100);setTimeout(apply,500);setTimeout(apply,1200)});
setInterval(()=>{if(!apply()){}},800);apply();
</script></body></html>
