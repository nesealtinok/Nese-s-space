<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro V14</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="outer" src="workspace-pro-v13.html?v=v14-base"></iframe><script>
const outer=document.getElementById('outer'),K='nese-v14-suite',SUB=['Mathematics','Science','Physics','Chemistry','Biology','Computer Science','English','STEM','History','Geography','French','Dutch'];
function deep(){let w=outer;for(let i=0;i<14;i++){try{let d=w.contentDocument;if(!d)return null;let n=d.querySelector('iframe');if(!n)return d;w=n}catch(e){return null}}return null}
function get(){try{return JSON.parse(localStorage.getItem(K))||{events:[],cards:[],docs:[]}}catch(e){return{events:[],cards:[],docs:[]}}}function put(x){localStorage.setItem(K,JSON.stringify(x))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c))}
function install(){let d=deep();if(!d||!d.body||!d.head||d.getElementById('v14style'))return;let s=d.createElement('style');s.id='v14style';s.textContent='#v14open{position:fixed;right:18px;bottom:18px;z-index:2147483647;background:#a31f34;color:#fff;border:0;border-radius:14px;padding:12px 15px;font:700 14px Arial;box-shadow:0 8px 24px #0003;cursor:pointer}#v14p{position:fixed;inset:0;z-index:2147483646;background:#f3f4f6;display:none;font:14px Arial;color:#101820}#v14p.on{display:flex}.v14s{width:205px;background:#fff;border-right:1px solid #ddd;padding:16px;box-sizing:border-box}.v14s h2{margin:0 0 15px}.v14n{display:flex;flex-direction:column;gap:6px}.v14n button,.v14btn{border:1px solid #d6dbe1;background:#fff;border-radius:8px;padding:9px 11px;cursor:pointer;text-align:left}.v14n .a,.v14primary{background:#a31f34;color:#fff;border-color:#a31f34}.v14m{flex:1;overflow:auto;padding:22px}.v14top{display:flex;justify-content:space-between;align-items:center}.v14grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.v14card{background:#fff;border:1px solid #ddd;border-radius:13px;padding:14px;margin-top:10px}.v14row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.v14row input,.v14row textarea,.v14row select{padding:9px;border:1px solid #ccd2d9;border-radius:8px}.v14row textarea{width:100%;min-height:80px}.v14item{display:flex;justify-content:space-between;gap:8px;border:1px solid #e1e4e8;border-radius:9px;padding:9px;margin:6px 0;background:#fff}.muted{color:#697586;font-size:12px}.danger{color:#a31f34}@media(max-width:700px){.v14s{width:165px}.v14m{padding:12px}}';d.head.appendChild(s);
let b=d.createElement('button');b.id='v14open';b.textContent='✦ Study Hub';d.body.appendChild(b);let p=d.createElement('div');p.id='v14p';p.innerHTML='<aside class="v14s"><h2>Study Hub</h2><div class="v14n"><button data-t="dashboard" class="a">🏠 Dashboard</button><button data-t="notebook">📓 Notebook</button><button data-t="academics">📚 Academics</button><button data-t="flashcards">🧠 Flashcards</button><button data-t="calendar">📅 Calendar</button><button data-t="search">🔎 Search</button></div></aside><main class="v14m"><div class="v14top"><div><h1 id="v14title" style="margin:0">Dashboard</h1><span class="muted">Your study workspace</span></div><button id="v14close" class="v14btn">Close</button></div><div id="v14c"></div></main>';d.body.appendChild(p);let c=p.querySelector('#v14c');
function render(t){p.querySelectorAll('[data-t]').forEach(z=>z.classList.toggle('a',z.dataset.t===t));p.querySelector('#v14title').textContent=t[0].toUpperCase()+t.slice(1);let x=get();
if(t==='dashboard')c.innerHTML='<div class="v14grid"><div class="v14card"><h3>📓 Notebook</h3><span class="muted">12 subjects · pages stay separate</span></div><div class="v14card"><h3>📅 Calendar</h3><span class="muted">'+x.events.length+' events</span></div><div class="v14card"><h3>🧠 Flashcards</h3><span class="muted">'+x.cards.length+' cards</span></div><div class="v14card"><h3>📚 Documents</h3><span class="muted">'+x.docs.length+' files</span></div></div><div class="v14card"><h3>Today</h3><span class="muted">'+x.events.filter(e=>e.date===new Date().toISOString().slice(0,10)).length+' events today</span></div>';
if(t==='notebook')c.innerHTML='<div class="v14card"><h3>📓 Notebook</h3><p class="muted">Your existing notebook is preserved. Use its own subject/page controls for writing.</p><div class="v14grid">'+SUB.map(z=>'<div class="v14card"><b>'+esc(z)+'</b><div class="muted">Subject section</div></div>').join('')+'</div></div>';
if(t==='academics'){c.innerHTML='<div class="v14card"><h3>📚 Documents & PDFs</h3><div class="v14row"><input id="f" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,image/*"><button id="u" class="v14btn v14primary">Save file</button></div>'+ (x.docs.length?x.docs.map((z,i)=>'<div class="v14item"><span><b>'+esc(z.name)+'</b><br><span class="muted">'+esc(z.type||'file')+'</span></span><button class="v14btn danger" data-d="'+i+'">Delete</button></div>').join(''):'<p class="muted">No documents yet.</p>')+'</div>';c.querySelector('#u').onclick=()=>{let f=c.querySelector('#f').files[0];if(!f)return;let r=new FileReader;r.onload=()=>{let y=get();y.docs.push({name:f.name,type:f.type,data:r.result});put(y);render(t)};r.readAsDataURL(f)};c.querySelectorAll('[data-d]').forEach(z=>z.onclick=()=>{let y=get();y.docs.splice(+z.dataset.d,1);put(y);render(t)})}
if(t==='flashcards'){c.innerHTML='<div class="v14card"><h3>🧠 New flashcard</h3><div class="v14row"><select id="s">'+SUB.map(z=>'<option>'+esc(z)+'</option>').join('')+'</select></div><textarea id="q" placeholder="Question"></textarea><textarea id="a" placeholder="Answer"></textarea><div class="v14row"><button id="add" class="v14btn v14primary">Add card</button></div></div><div class="v14card"><h3>Your cards</h3>'+ (x.cards.length?x.cards.map((z,i)=>'<div class="v14item"><span><b>'+esc(z.q)+'</b><br><span class="muted">'+esc(z.subject)+' · '+esc(z.a)+'</span></span><button class="v14btn danger" data-c="'+i+'">Delete</button></div>').join(''):'<span class="muted">No flashcards yet.</span>')+'</div>';c.querySelector('#add').onclick=()=>{let q=c.querySelector('#q').value.trim(),a=c.querySelector('#a').value.trim();if(!q||!a)return;let y=get();y.cards.push({q,a,subject:c.querySelector('#s').value});put(y);render(t)};c.querySelectorAll('[data-c]').forEach(z=>z.onclick=()=>{let y=get();y.cards.splice(+z.dataset.c,1);put(y);render(t)})}
if(t==='calendar'){c.innerHTML='<div class="v14card"><h3>📅 Add event</h3><div class="v14row"><input id="date" type="date"><input id="title" placeholder="Exam, homework, study session..." style="flex:1"><button id="addE" class="v14btn v14primary">Add</button></div></div><div class="v14card"><h3>Events</h3>'+ (x.events.length?x.events.sort((a,b)=>a.date.localeCompare(b.date)).map((z,i)=>'<div class="v14item"><span><b>'+esc(z.title)+'</b><br><span class="muted">'+esc(z.date)+'</span></span><button class="v14btn danger" data-e="'+i+'">Delete</button></div>').join(''):'<span class="muted">No events yet.</span>')+'</div>';c.querySelector('#addE').onclick=()=>{let date=c.querySelector('#date').value,title=c.querySelector('#title').value.trim();if(!date||!title)return;let y=get();y.events.push({date,title});put(y);render(t)};c.querySelectorAll('[data-e]').forEach(z=>z.onclick=()=>{let y=get();y.events.splice(+z.dataset.e,1);put(y);render(t)})}
if(t==='search'){c.innerHTML='<div class="v14card"><input id="search" placeholder="Search your workspace..." style="width:100%;padding:11px;box-sizing:border-box;border:1px solid #ccd2d9;border-radius:8px"><div id="results"></div></div>';let q=c.querySelector('#search'),r=c.querySelector('#results');function go(){let z=q.value.toLowerCase(),a=[];x.cards.forEach(v=>{if((v.q+' '+v.a+' '+v.subject).toLowerCase().includes(z))a.push('🧠 Flashcard — '+v.q)});x.events.forEach(v=>{if((v.title+' '+v.date).toLowerCase().includes(z))a.push('📅 Calendar — '+v.title)});x.docs.forEach(v=>{if(v.name.toLowerCase().includes(z))a.push('📚 Document — '+v.name)});r.innerHTML=a.length?a.map(v=>'<div class="v14item">'+esc(v)+'</div>').join(''):'<p class="muted">No results.</p>'}q.oninput=go;go()}}
p.querySelectorAll('[data-t]').forEach(z=>z.onclick=()=>render(z.dataset.t));p.querySelector('#v14close').onclick=()=>p.classList.remove('on');b.onclick=()=>{p.classList.add('on');render('dashboard')}}
outer.addEventListener('load',()=>{setTimeout(install,700);setTimeout(install,1800);setTimeout(install,3000)});setInterval(install,1500);
</script></body></html>
