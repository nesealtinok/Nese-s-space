<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#appFrame{width:100%;height:100%;border:0;display:block}#toggle{position:fixed;top:14px;left:258px;z-index:999999;width:36px;height:36px;border:1px solid #cdd3da;border-radius:9px;background:#fff;color:#a31f34;font-size:20px;cursor:pointer;box-shadow:0 4px 14px #10182020}</style></head><body><iframe id="appFrame" src="workspace-pro-v2.html?v=stable-base"></iframe><button id="toggle">‹</button><script>
const outer=document.getElementById('appFrame'),toggle=document.getElementById('toggle');const SUBJECTS=[['Mathematics','📐'],['Science','🧪'],['Physics','⚛️'],['Chemistry','⚗️'],['Biology','🧬'],['Computer Science','💻'],['English','📚'],['STEM','🔬'],['History','🏛️'],['Geography','🌍'],['French','🇫🇷'],['Dutch','🇳🇱']];const STORE='nese-notebook-subjects-v6';let hidden=localStorage.getItem('nese-sidebar-hidden-v6')==='1';function doc(){const o=outer.contentDocument;return o?.getElementById('appFrame')?.contentDocument||o}function data(){try{return JSON.parse(localStorage.getItem(STORE))||{active:'Mathematics',subjects:{}}}catch(e){return{active:'Mathematics',subjects:{}}}}function put(x){localStorage.setItem(STORE,JSON.stringify(x))}function subject(x,n){if(!x.subjects[n])x.subjects[n]={pages:[{name:'Page 1',type:'lined',text:'',image:null}],active:0};return x.subjects[n]}function install(){const d=doc();if(!d?.body)return;if(!d.getElementById('v5style')){const s=d.createElement('style');s.id='v5style';s.textContent=`body.v5hide .app{grid-template-columns:1fr!important}.v5hide .side{display:none!important}.v5hide .main{width:100%!important;max-width:none!important;padding-left:48px!important;padding-right:48px!important}.v5hide .nb{width:100%!important}.v5hide .nb-canvas{height:760px!important}.v5subjects{padding:10px 12px;border-bottom:1px solid #e4e7eb;background:#fafafa}.v5title{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#697586;margin-bottom:7px}.v5row{display:flex;gap:6px;overflow:auto}.v5row button{flex:0 0 auto;border:1px solid #d7dce2;background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;color:#101820;font-size:12px}.v5row button.active{background:#a31f34;color:#fff;border-color:#a31f34}.v5pagebar{display:flex;gap:6px;align-items:center;padding:9px 12px;border-bottom:1px solid #e4e7eb}.v5pagebar button{border:1px solid #d7dce2;background:#fff;border-radius:7px;padding:6px 9px}.v5pages{display:flex;gap:5px;overflow:auto}.v5pages button.active{background:#a31f34;color:#fff}.v5editor{margin:14px;border:1px solid #dfe3e8;border-radius:9px;overflow:hidden}.v5editor textarea{width:100%;height:520px;box-sizing:border-box;border:0;outline:0;padding:18px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 27px,#dce1e7 28px);font:16px/28px Arial;resize:none}`;d.head.appendChild(s)}d.body.classList.toggle('v5hide',hidden);toggle.textContent=hidden?'›':'‹';toggle.style.left=hidden?'14px':'258px';toggle.title=hidden?'Show sidebar':'Hide sidebar';const mount=d.getElementById('nbmount');if(!mount)return;let h=mount.querySelector('.v5subjects');if(!h){h=d.createElement('div');h.className='v5subjects';mount.prepend(h)}render(d,h)}function render(d,h){const x=data(),cur=subject(x,x.active);put(x);h.innerHTML='<div class="v5title">Notebook subjects</div><div class="v5row"></div><div class="v5pagebar"><div class="v5pages"></div><button id="v5new">＋ Page</button></div><div class="v5editor"><textarea id="v5text" placeholder="Write your notes here..."></textarea></div>';const row=h.querySelector('.v5row'),pages=h.querySelector('.v5pages');SUBJECTS.forEach(([n,i])=>{const b=d.createElement('button');b.className=n===x.active?'active':'';b.textContent=i+' '+n;b.onclick=()=>{saveCurrent(d);x.active=n;subject(x,n);put(x);render(d,h)};row.appendChild(b)});cur.pages.forEach((p,i)=>{const b=d.createElement('button');b.className=i===cur.active?'active':'';b.textContent=p.name;b.onclick=()=>{saveCurrent(d);cur.active=i;put(x);render(d,h)};pages.appendChild(b)});h.querySelector('#v5text').value=cur.pages[cur.active].text||'';h.querySelector('#v5text').oninput=()=>{cur.pages[cur.active].text=h.querySelector('#v5text').value;put(x)};h.querySelector('#v5new').onclick=()=>{saveCurrent(d);cur.pages.push({name:'Page '+(cur.pages.length+1),type:'lined',text:'',image:null});cur.active=cur.pages.length-1;put(x);render(d,h)}}function saveCurrent(d){const h=d.querySelector('.v5subjects'),x=data();if(!h)return;const cur=subject(x,x.active),ta=h.querySelector('#v5text');if(ta)cur.pages[cur.active].text=ta.value;put(x)}toggle.onclick=()=>{hidden=!hidden;localStorage.setItem('nese-sidebar-hidden-v6',hidden?'1':'0');install()};outer.addEventListener('load',()=>{setTimeout(install,500);setTimeout(install,1500);setTimeout(install,2500)});setInterval(install,1000);</script></body></html>
