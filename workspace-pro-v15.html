<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro V15</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}#hubBtn{position:fixed;right:18px;bottom:18px;z-index:9999;border:0;border-radius:14px;padding:13px 16px;background:#a31f34;color:white;font:700 14px Arial;box-shadow:0 8px 25px #0003}#hub{position:fixed;inset:0;z-index:9998;display:none;background:#f4f5f7;font:14px Arial;color:#101820}#hub.open{display:flex}.side{width:220px;background:#fff;border-right:1px solid #ddd;padding:16px;box-sizing:border-box}.side h2{margin:0 0 16px}.side button,.btn{width:100%;border:1px solid #d5dbe2;background:#fff;border-radius:9px;padding:10px 12px;margin:4px 0;text-align:left}.side button.active,.primary{background:#a31f34;color:#fff;border-color:#a31f34}.main{flex:1;overflow:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row input,.row textarea,.row select{padding:10px;border:1px solid #ccd3db;border-radius:8px;box-sizing:border-box}.row textarea{width:100%;min-height:80px}.item{display:flex;justify-content:space-between;gap:10px;border:1px solid #e1e5e9;border-radius:9px;padding:10px;margin:7px 0;background:#fff}.danger{color:#a31f34}.muted{color:#697586;font-size:12px}@media(max-width:700px){.side{width:165px}.main{padding:12px}}</style></head><body><iframe id="app" src="workspace-pro-v12.html?v=v15-base"></iframe><button id="hubBtn">✦ Study Hub</button><div id="hub"><aside class="side"><h2>Study Hub</h2><button data-page="dashboard" class="active">🏠 Dashboard</button><button data-page="notebook">📓 Notebook</button><button data-page="academics">📚 Academics</button><button data-page="flashcards">🧠 Flashcards</button><button data-page="calendar">📅 Calendar</button><button data-page="search">🔎 Search</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><span class="muted">Your study workspace</span></div><button class="btn" id="close" style="width:auto">Close</button></div><section id="content"></section></main></div><script>const KEY='nese-v15-suite';const subjects=['Mathematics','Science','Physics','Chemistry','Biology','Computer Science','English','STEM','History','Geography','French','Dutch'];const app=document.getElementById('app'),hub=document.getElementById('hub'),content=document.getElementById('content');function data(){try{return JSON.parse(localStorage.getItem(KEY))||{cards:[],events:[],docs:[]}}catch(e){return{cards:[],events:[],docs:[]}}}function save(x){localStorage.setItem(KEY,JSON.stringify(x))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||''))}function show(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('title').textContent=page.charAt(0).toUpperCase()+page.slice(1);const x=data();if(page==='dashboard'){content.innerHTML='<div class="grid"><div class="card"><h3>📓 Notebook</h3><span class="muted">12 subjects · your existing notebook is preserved</span></div><div class="card"><h3>🧠 Flashcards</h3><b>'+x.cards.length+'</b> cards</div><div class="card"><h3>📅 Calendar</h3><b>'+x.events.length+'</b> events</div><div class="card"><h3>📚 Documents</h3><b>'+x.docs.length+'</b> files</div></div>'}if(page==='notebook'){content.innerHTML='<div class="card"><h2>📓 Notebook</h2><p class="muted">Open your existing V12 notebook below. Its single-notebook structure and working sidebar stay untouched.</p><button class="btn primary" id="openNotebook">Open Notebook</button></div>' ;document.getElementById('openNotebook').onclick=()=>{hub.classList.remove('open');try{const d=app.contentDocument;const b=d.querySelector('.nb-open');if(b)b.click()}catch(e){}}}if(page==='academics'){content.innerHTML='<div class="card"><h2>📚 Documents & PDFs</h2><div class="row"><input id="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,image/*"><button class="btn primary" id="addFile" style="width:auto">Save file</button></div>'+ (x.docs.length?x.docs.map((d,i)=>'<div class="item"><span><b>'+esc(d.name)+'</b><br><span class="muted">'+esc(d.type||'file')+'</span></span><button class="btn danger delDoc" data-i="'+i+'" style="width:auto">Delete</button></div>').join(''):'<p class="muted">No documents yet.</p>')+'</div>';document.getElementById('addFile').onclick=()=>{const f=document.getElementById('file').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const y=data();y.docs.push({name:f.name,type:f.type,data:r.result});save(y);show(page)};r.readAsDataURL(f)};document.querySelectorAll('.delDoc').forEach(b=>b.onclick=()=>{const y=data();y.docs.splice(+b.dataset.i,1);save(y);show(page)})}if(page==='flashcards'){content.innerHTML='<div class="card"><h2>🧠 Create Flashcard</h2><div class="row"><select id="subject">'+subjects.map(s=>'<option>'+s+'</option>').join('')+'</select><input id="q" placeholder="Question" style="flex:1"></div><div class="row"><textarea id="a" placeholder="Answer"></textarea></div><button class="btn primary" id="addCard" style="width:auto">Add card</button></div><div class="card"><h2>Your Cards</h2>'+(x.cards.length?x.cards.map((c,i)=>'<div class="item"><span><b>'+esc(c.q)+'</b><br><span class="muted">'+esc(c.subject)+' · '+esc(c.a)+'</span></span><button class="btn danger delCard" data-i="'+i+'" style="width:auto">Delete</button></div>').join(''):'<span class="muted">No cards yet.</span>')+'</div>';document.getElementById('addCard').onclick=()=>{const q=document.getElementById('q').value.trim(),a=document.getElementById('a').value.trim();if(!q||!a)return;const y=data();y.cards.push({q,a,subject:document.getElementById('subject').value});save(y);show(page)};document.querySelectorAll('.delCard').forEach(b=>b.onclick=()=>{const y=data();y.cards.splice(+b.dataset.i,1);save(y);show(page)})}if(page==='calendar'){content.innerHTML='<div class="card"><h2>📅 Add Event</h2><div class="row"><input id="date" type="date"><input id="event" placeholder="Exam, homework, study session..." style="flex:1"><button class="btn primary" id="addEvent" style="width:auto">Add</button></div></div><div class="card"><h2>Events</h2>'+(x.events.length?x.events.map((e,i)=>'<div class="item"><span><b>'+esc(e.title)+'</b><br><span class="muted">'+esc(e.date)+'</span></span><button class="btn danger delEvent" data-i="'+i+'" style="width:auto">Delete</button></div>').join(''):'<span class="muted">No events yet.</span>')+'</div>';document.getElementById('addEvent').onclick=()=>{const date=document.getElementById('date').value,title=document.getElementById('event').value.trim();if(!date||!title)return;const y=data();y.events.push({date,title});save(y);show(page)};document.querySelectorAll('.delEvent').forEach(b=>b.onclick=()=>{const y=data();y.events.splice(+b.dataset.i,1);save(y);show(page)})}if(page==='search'){content.innerHTML='<div class="card"><input id="searchBox" placeholder="Search flashcards, events and documents..." style="width:100%;padding:11px;border:1px solid #ccd3db;border-radius:8px;box-sizing:border-box"><div id="results"></div></div>';const box=document.getElementById('searchBox'),results=document.getElementById('results');function search(){const q=box.value.toLowerCase(),out=[];x.cards.forEach(c=>{if((c.q+' '+c.a+' '+c.subject).toLowerCase().includes(q))out.push('🧠 Flashcard — '+c.q)});x.events.forEach(e=>{if((e.title+' '+e.date).toLowerCase().includes(q))out.push('📅 Calendar — '+e.title)});x.docs.forEach(d=>{if(d.name.toLowerCase().includes(q))out.push('📚 Document — '+d.name)});results.innerHTML=out.length?out.map(v=>'<div class="item">'+esc(v)+'</div>').join(''):'<p class="muted">No results.</p>'}box.oninput=search;search()}}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));document.getElementById('hubBtn').onclick=()=>{hub.classList.add('open');show('dashboard')};document.getElementById('close').onclick=()=>hub.classList.remove('open');</script></body></html>
