<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="outer" src="workspace-pro-v2.html?v=single-notebook"></iframe><script>
const f=document.getElementById('outer');
const SUBJECTS=[['Mathematics','📐'],['Science','🧪'],['Physics','⚛️'],['Chemistry','⚗️'],['Biology','🧬'],['Computer Science','💻'],['English','📚'],['STEM','🔬'],['History','🏛️'],['Geography','🌍'],['French','🇫🇷'],['Dutch','🇳🇱']];
const KEY='nese-single-notebook-v1';
function getDoc(){try{let d=f.contentDocument;let i=d&&d.getElementById('appFrame');return i?i.contentDocument:d}catch(e){return null}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function store(x){localStorage.setItem(KEY,JSON.stringify(x))}
function ensure(){let x=load();if(x)return x;let old=null;try{old=JSON.parse(localStorage.getItem('nese-notebook-persistent-v1')||'null')}catch(e){};x={active:'Mathematics',subjects:{}};for(const [n] of SUBJECTS)x.subjects[n]={pages:[{name:'Page 1',type:'lined',image:null}],active:0};if(old&&old.pages){x.subjects.Mathematics.pages=old.pages;x.subjects.Mathematics.active=old.active||0}store(x);return x}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function saveCanvas(d,x){const c=d.getElementById('nbcanvas');if(c){x.subjects[x.active].pages[x.subjects[x.active].active].image=c.toDataURL('image/png');store(x)}}
function render(d){const nb=d.getElementById('nb');if(!nb)return;const mount=d.getElementById('nbmount');if(!mount)return;let x=ensure(),sub=x.subjects[x.active];if(!sub.pages.length)sub.pages=[{name:'Page 1',type:'lined',image:null}];sub.active=Math.max(0,Math.min(sub.active,sub.pages.length-1));store(x);const p=sub.pages[sub.active];mount.innerHTML='<div class="sn-head"><div><b>nese’s notebook</b><small>'+esc(x.active)+' · '+esc(p.name)+'</small></div><div class="sn-actions"><input id="snname" value="'+esc(p.name)+'"><button id="snrename">Rename</button><button id="snnew">＋ New page</button><button id="sncover">Cover</button></div></div><div class="sn-subjects"><div class="sn-label">Notebook sections</div><div class="sn-subject-row"></div></div><div class="sn-pages"></div><div class="sn-paper"><div class="sn-paperinner"><canvas id="sncanvas" class="sn-canvas '+p.type+'"></canvas><div class="sn-tools"><button data-tool="pen" class="active">✎ Pen</button><button data-tool="pencil">✏ Pencil</button><button data-tool="marker">🖍 Marker</button><button data-tool="eraser">⌫ Eraser</button><button data-color="#101820" style="background:#101820" class="sn-color"></button><button data-color="#a31f34" style="background:#a31f34" class="sn-color"></button><button data-color="#2563eb" style="background:#2563eb" class="sn-color"></button><button data-color="#16a34a" style="background:#16a34a" class="sn-color"></button><button data-color="#f59e0b" style="background:#f59e0b" class="sn-color"></button><button data-color="#7c3aed" style="background:#7c3aed" class="sn-color"></button><span>Size</span><input id="snsize" type="range" min="1" max="12" value="3"><button id="snsave">✓ Save</button><button id="snclear">Clear</button><button id="sndelete" style="color:#a31f34">Delete page</button></div></div></div><div class="sn-footer"><span id="snstatus">Auto-saved</span><span>Page '+(sub.active+1)+' of '+sub.pages.length+'</span></div>';
const row=mount.querySelector('.sn-subject-row');SUBJECTS.forEach(([name,icon])=>{const b=d.createElement('button');b.textContent=icon+' '+name;b.className=name===x.active?'active':'';b.onclick=()=>{saveCanvas(d,x);x.active=name;store(x);render(d)};row.appendChild(b)});
const pages=mount.querySelector('.sn-pages');sub.pages.forEach((pg,i)=>{const b=d.createElement('button');b.textContent=pg.name;b.className=i===sub.active?'active':'';b.onclick=()=>{saveCanvas(d,x);sub.active=i;store(x);render(d)};pages.appendChild(b)});
mount.querySelector('#snrename').onclick=()=>{const n=mount.querySelector('#snname').value.trim();if(n){p.name=n;store(x);render(d)}};
mount.querySelector('#snnew').onclick=()=>{saveCanvas(d,x);sub.pages.push({name:'Page '+(sub.pages.length+1),type:'lined',image:null});sub.active=sub.pages.length-1;store(x);render(d)};
mount.querySelector('#sncover').onclick=()=>{const btn=d.querySelector('.nb-open');if(btn)btn.click()};
mount.querySelector('#sndelete').onclick=()=>{if(sub.pages.length<2)return;if(confirm('Delete this page?')){sub.pages.splice(sub.active,1);sub.active=Math.max(0,sub.active-1);store(x);render(d)}};
setup(d,x)
}
function setup(d,x){const c=d.getElementById('sncanvas'),ctx=c.getContext('2d'),z=Math.max(1,Math.min(2.5,d.defaultView.devicePixelRatio||1));c.width=c.clientWidth*z;c.height=c.clientHeight*z;ctx.scale(z,z);ctx.lineCap='round';ctx.lineJoin='round';let tool='pen',color='#101820',size=3,down=false;const sub=x.subjects[x.active],p=sub.pages[sub.active];const shot=()=>c.toDataURL('image/png');const load=u=>{if(!u)return;const im=new Image;im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight);im.src=u};load(p.image);const save=()=>{p.image=shot();store(x);const s=d.getElementById('snstatus');if(s)s.textContent='Saved automatically'};const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);const q=pos(e);ctx.beginPath();ctx.moveTo(q.x,q.y)};c.onpointermove=e=>{if(!down)return;const q=pos(e);ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.globalAlpha=tool==='marker'?.28:1;const mult=tool==='marker'?3.5:tool==='pencil'?.65:tool==='eraser'?4:1;ctx.strokeStyle=color;ctx.lineWidth=Math.max(.7,size*mult);ctx.lineTo(q.x,q.y);ctx.stroke()};c.onpointerup=()=>{down=false;ctx.globalAlpha=1;ctx.closePath();save()};c.onpointercancel=()=>down=false;d.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;d.querySelectorAll('[data-tool]').forEach(q=>q.classList.remove('active'));b.classList.add('active')});d.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;tool='pen';d.querySelectorAll('[data-tool]').forEach(q=>q.classList.remove('active'));d.querySelector('[data-tool="pen"]').classList.add('active')});d.getElementById('snsize').oninput=e=>size=+e.target.value;d.getElementById('snsave').onclick=save;d.getElementById('snclear').onclick=()=>{if(confirm('Clear this page?')){ctx.clearRect(0,0,c.clientWidth,c.clientHeight);save()}}}
function install(){const d=getDoc();if(!d||!d.body)return;if(!d.getElementById('snstyle')){const s=d.createElement('style');s.id='snstyle';s.textContent=`.sn-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #e4e7eb;background:#fafafa}.sn-head small{display:block;color:#697586}.sn-actions{display:flex;gap:7px;flex-wrap:wrap}.sn-actions input{width:130px}.sn-head button,.sn-actions button,.sn-pages button,.sn-subject-row button,.sn-tools button{border:1px solid #ccd2d9;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.sn-subjects{padding:12px 14px;border-bottom:1px solid #e4e7eb;background:#fff}.sn-label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#697586;margin-bottom:8px}.sn-subject-row{display:flex;gap:6px;overflow:auto}.sn-subject-row button{white-space:nowrap}.sn-subject-row button.active{background:#a31f34;color:#fff;border-color:#a31f34}.sn-pages{display:flex;gap:6px;overflow:auto;padding:8px 10px;background:#f7f8fa;border-bottom:1px solid #e4e7eb}.sn-pages button.active{background:#101820;color:#fff}.sn-paper{padding:14px;background:#eef0f3}.sn-paperinner{background:#fff;border:1px solid #dfe3e8;border-radius:9px;overflow:hidden}.sn-canvas{display:block;width:100%;height:650px;touch-action:none;background-color:#fff;background-size:100% 28px}.sn-canvas.lined{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#dce1e7 28px)}.sn-canvas.grid{background-image:linear-gradient(#dce1e7 1px,transparent 1px),linear-gradient(90deg,#dce1e7 1px,transparent 1px);background-size:28px 28px}.sn-canvas.dot{background-image:radial-gradient(#d5dbe2 .8px,transparent .8px);background-size:18px 18px}.sn-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 10px;border-top:1px solid #e4e7eb}.sn-tools .active{background:#a31f34;color:#fff;border-color:#a31f34}.sn-color{width:24px;height:24px;border-radius:50%;border:2px solid white!important;box-shadow:0 0 0 1px #c8ced6}.sn-footer{padding:8px 12px;color:#697586;font-size:11px;border-top:1px solid #e4e7eb;background:#fafafa;display:flex;justify-content:space-between}@media(max-width:720px){.sn-head{align-items:flex-start;flex-direction:column}.sn-canvas{height:570px}}`;d.head.appendChild(s)}const nb=d.getElementById('nb');if(!nb)return;const open=nb.querySelector('.nb-open');if(open&&!open.dataset.sn){open.dataset.sn='1';open.onclick=()=>render(d)}if(nb.querySelector('#nbmount')&&!nb.querySelector('#nbmount .sn-head')){const x=ensure();if(nb.querySelector('.nb-coverarea')){}}}
f.addEventListener('load',()=>{setTimeout(install,600);setTimeout(install,1600);setTimeout(install,2600)});setInterval(install,1200);
</script></body></html>
