<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="outer" src="workspace-pro-v6.html?v=v12-stable"></iframe><script>
const outer=document.getElementById('outer');
function deepest(){let w=outer;for(let i=0;i<8;i++){try{const d=w.contentDocument;if(!d)return null;const next=d.querySelector('iframe');if(!next)return d;w=next}catch(e){return null}}return null}
const studyKey='nese-study-v3';
function today(){return new Date().toDateString()}
function study(){let x;try{x=JSON.parse(localStorage.getItem(studyKey)||'null')}catch(e){};if(!x||x.day!==today())x={day:today(),minutes:0,pomodoros:0,cards:0,activeStart:null};return x}
function saveStudy(x){localStorage.setItem(studyKey,JSON.stringify(x))}
function injectStyle(d){if(d.getElementById('v12extraStyle'))return;const s=d.createElement('style');s.id='v12extraStyle';s.textContent=`#v12bar{position:fixed;right:18px;bottom:18px;z-index:2147483647;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#v12bar button{border:1px solid #cdd3da;background:#fff;border-radius:12px;padding:9px 13px;font-weight:750;color:#101820;box-shadow:0 4px 16px #10182018;cursor:pointer}#v12bar button:hover{border-color:#a31f34;color:#a31f34}.v12panel{position:fixed;right:18px;bottom:70px;z-index:2147483646;width:330px;background:#fff;border:1px solid #dfe3e8;border-radius:20px;padding:18px;box-shadow:0 14px 45px #10182028;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.v12hidden{display:none!important}.v12timer{text-align:center;font-size:46px;font-weight:850;letter-spacing:-.04em;margin:10px 0}.v12timer small{display:block;font-size:11px;color:#697586;letter-spacing:.08em;text-transform:uppercase}.v12panel button{border:1px solid #d5dbe2;background:#fff;border-radius:10px;padding:8px 11px;font-weight:700;cursor:pointer}.v12primary{background:#a31f34!important;color:#fff!important;border-color:#a31f34!important}.mroom{height:190px;border-radius:16px;background:linear-gradient(#f7eee6,#fff);border:1px solid #eadfd6;position:relative;overflow:hidden}.mroom .window{position:absolute;right:18px;top:16px;width:72px;height:58px;background:#dcecf7;border:4px solid #fff}.mroom .desk{position:absolute;left:25px;bottom:25px;width:170px;height:10px;background:#b98b65;border-radius:5px}.mroom .bunny{position:absolute;left:78px;bottom:28px;font-size:70px;line-height:1;filter:drop-shadow(0 3px 3px #0002)}.mroom .plant{position:absolute;right:25px;bottom:23px;font-size:42px}.mroom .book{position:absolute;left:150px;bottom:36px;font-size:24px}.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.mstat{background:#f5f6f8;border-radius:11px;padding:9px;text-align:center;font-size:11px;color:#697586}.mstat b{display:block;color:#101820;font-size:18px}.mbar{height:9px;background:#eceff2;border-radius:8px;overflow:hidden}.mbar span{display:block;height:100%;width:0;background:#a31f34;transition:width .25s}.mstatus{text-align:center;font-weight:750;margin:9px 0 4px}.mquote{text-align:center;color:#697586;font-size:12px;margin-bottom:10px}.mrow{display:flex;gap:7px}.mrow button{flex:1}.v12levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.v12level{border:1px solid #dfe3e8;background:#fff;border-radius:10px;padding:9px 5px;text-align:center;font-size:11px;font-weight:750;cursor:pointer}.v12level.active{background:#a31f34;color:#fff;border-color:#a31f34}.v12cardlevel{font-size:11px;color:#697586;text-align:center;margin-top:8px}.v12flashnote{margin-top:9px;padding:9px;border-radius:10px;background:#f6f7f9;color:#697586;font-size:11px;text-align:center}`;d.head.appendChild(s)}
function installSidebar(d){if(!d.getElementById('v12SidebarToggle')){const b=d.createElement('button');b.id='v12SidebarToggle';b.type='button';b.textContent='‹';Object.assign(b.style,{position:'fixed',left:'250px',top:'18px',zIndex:2147483647,width:'38px',height:'38px',border:'1px solid #cdd3da',borderRadius:'9px',background:'#fff',color:'#a31f34',font:'700 21px/38px Arial',cursor:'pointer',boxShadow:'0 4px 14px #10182025'});d.body.appendChild(b);b.onclick=()=>{const closed=!d.body.classList.contains('v12-sidebar-closed');d.body.classList.toggle('v12-sidebar-closed',closed);localStorage.setItem('v12-sidebar',closed?'1':'0');b.textContent=closed?'›':'‹';b.style.left=closed?'14px':'250px';try{d.defaultView.dispatchEvent(new Event('resize'))}catch(e){}}}const b=d.getElementById('v12SidebarToggle'),closed=localStorage.getItem('v12-sidebar')==='1';d.body.classList.toggle('v12-sidebar-closed',closed);b.textContent=closed?'›':'‹';b.style.left=closed?'14px':'250px';if(!d.getElementById('v12SidebarCSS')){const s=d.createElement('style');s.id='v12SidebarCSS';s.textContent=`body.v12-sidebar-closed .app{grid-template-columns:1fr!important}body.v12-sidebar-closed .side{display:none!important}body.v12-sidebar-closed .main{max-width:none!important;padding-left:48px!important;padding-right:48px!important}`;d.head.appendChild(s)}}
function currentFlashCard(w){try{const raw=JSON.parse(localStorage.getItem('nese-pro-v1')||'null');if(!raw||!raw.cards||!raw.cards.length)return null;const box=w.document.querySelector('.view.active .card.s4 .flash strong');if(!box)return null;const shown=box.textContent.trim();return raw.cards.find(c=>String(c.q).trim()===shown||String(c.a).trim()===shown)||null}catch(e){return null}}
function enhanceAcademics(d,w){if(!d.getElementById('academics'))return;const view=d.getElementById('academics');if(!view.classList.contains('active'))return;const card=[...view.querySelectorAll('.card')].find(x=>/Flashcards/i.test(x.textContent));if(!card)return;let raw;try{raw=JSON.parse(localStorage.getItem('nese-pro-v1')||'null')}catch(e){}if(!raw||!Array.isArray(raw.cards))return;let changed=false;raw.cards.forEach(c=>{if(typeof c.level!=='number'){c.level=0;changed=true}});if(changed)localStorage.setItem('nese-pro-v1',JSON.stringify(raw));let tabs=card.querySelector('.v12levels');if(!tabs){tabs=d.createElement('div');tabs.className='v12levels';tabs.innerHTML='<button class="v12level" data-l="0">🌱 New<br><span>learned</span></button><button class="v12level" data-l="1">🌿 Somewhat<br><span>known</span></button><button class="v12level" data-l="2">⭐ Expert<br><span>mastered</span></button>';const flash=card.querySelector('.flash');if(flash)flash.parentNode.insertBefore(tabs,flash);else card.prepend(tabs);tabs.querySelectorAll('.v12level').forEach(b=>b.onclick=()=>{const c=currentFlashCard(w);if(!c)return;const store=JSON.parse(localStorage.getItem('nese-pro-v1'));const target=store.cards.find(x=>x===c||x.q===c.q&&x.a===c.a);if(target){target.level=+b.dataset.l;localStorage.setItem('nese-pro-v1',JSON.stringify(store));renderLevelState(card,target.level);}})}const c=currentFlashCard(w);renderLevelState(card,c?c.level:0);let next=[...card.querySelectorAll('button')].find(b=>b.textContent.trim()==='Next');if(next&&!next.dataset.v12){next.dataset.v12='1';const old=next.onclick;next.onclick=(e)=>{if(old)old.call(next,e);const x=study();x.cards++;saveStudy(x);updateM(d)}}let add=[...card.querySelectorAll('button')].find(b=>b.textContent.includes('Add card'));if(add&&!add.dataset.v12){add.dataset.v12='1'}if(!card.querySelector('.v12flashnote')){const n=d.createElement('div');n.className='v12flashnote';n.textContent='Flashcards live here in Academics. Choose a level after reviewing a card — M tracks your reviews automatically.';card.appendChild(n)}}
function renderLevelState(card,level){const tabs=card.querySelectorAll('.v12level');tabs.forEach(b=>b.classList.toggle('active',+b.dataset.l===level));let old=card.querySelector('.v12cardlevel');if(!old){old=card.ownerDocument.createElement('div');old.className='v12cardlevel';const flash=card.querySelector('.flash');if(flash)flash.insertAdjacentElement('afterend',old);else card.appendChild(old)}old.textContent=['🌱 Newly learned','🌿 Somewhat known','⭐ Expert'][level]}
function installExtras(d){if(d.getElementById('v12bar'))return;const bar=d.createElement('div');bar.id='v12bar';bar.innerHTML='<button id="v12Pom">🍅 Pomodoro</button><button id="v12M">🐰 Study with M</button>';d.body.appendChild(bar);const p=d.createElement('div');p.id='v12PomPanel';p.className='v12panel v12hidden';p.innerHTML='<b>Pomodoro</b><div class="v12timer"><small>Focus session</small><span id="v12Time">25:00</span></div><div class="mrow"><button id="v12Start" class="v12primary">Start</button><button id="v12Stop">Stop & save</button><button id="v12Reset">Reset</button></div><div class="v12flashnote">Study time is tracked automatically. You never need to enter minutes yourself.</div>';d.body.appendChild(p);const m=d.createElement('div');m.id='v12MPanel';m.className='v12panel v12hidden';m.innerHTML='<b>🐰 Study with M</b><div class="mroom"><div class="window"></div><div class="desk"></div><div class="book">📖</div><div class="bunny" id="v12Face">🥺</div><div class="plant">🪴</div></div><div class="mstatus" id="v12MStatus">M is waiting for you…</div><div class="mbar"><span id="v12MBar"></span></div><div class="mstats"><div class="mstat"><b id="v12Min">0</b>minutes</div><div class="mstat"><b id="v12PomCount">0</b>pomodoros</div><div class="mstat"><b id="v12Cards">0</b>cards</div></div><div class="mquote" id="v12Quote">“We haven't studied yet today.”</div><div class="mrow"><button id="v12OpenPom" class="v12primary">Start Pomodoro</button></div>';d.body.appendChild(m);let timer=1500,interval=null;function showTime(){d.getElementById('v12Time').textContent=String(Math.floor(timer/60)).padStart(2,'0')+':'+String(timer%60).padStart(2,'0')}function updateLive(){const x=study();if(x.activeStart){const mins=Math.floor((Date.now()-x.activeStart)/60000);x.minutes=Math.max(x.minutes,mins);saveStudy(x)}updateM(d)}function finishSession(){if(!interval)return;clearInterval(interval);interval=null;const x=study();if(x.activeStart){x.minutes=Math.max(x.minutes,Math.floor((Date.now()-x.activeStart)/60000));x.activeStart=null}saveStudy(x);updateM(d)}function start(){if(interval)return;const x=study();if(!x.activeStart)x.activeStart=Date.now();saveStudy(x);interval=setInterval(()=>{if(timer>0){timer--;showTime();updateLive()}if(timer<=0){clearInterval(interval);interval=null;const y=study();y.minutes=Math.max(y.minutes,25);y.pomodoros++;y.activeStart=null;saveStudy(y);timer=300;showTime();updateM(d);alert('Pomodoro complete! M is proud of you 🎉')}} ,1000);updateM(d)}d.getElementById('v12Pom').onclick=()=>{p.classList.toggle('v12hidden');m.classList.add('v12hidden')};d.getElementById('v12M').onclick=()=>{m.classList.toggle('v12hidden');p.classList.add('v12hidden');updateM(d)};d.getElementById('v12Start').onclick=start;d.getElementById('v12Stop').onclick=finishSession;d.getElementById('v12Reset').onclick=()=>{finishSession();timer=1500;showTime()};d.getElementById('v12OpenPom').onclick=()=>{m.classList.add('v12hidden');p.classList.remove('v12hidden');start()};showTime();updateM(d)}
function updateM(d){const x=study(),score=Math.min(100,Math.round((x.minutes/60)*30+(x.pomodoros/4)*40+(x.cards/20)*30));const face=d.getElementById('v12Face'),status=d.getElementById('v12MStatus'),quote=d.getElementById('v12Quote'),bar=d.getElementById('v12MBar');if(!face)return;bar.style.width=score+'%';d.getElementById('v12Min').textContent=x.minutes;d.getElementById('v12PomCount').textContent=x.pomodoros;d.getElementById('v12Cards').textContent=x.cards;if(score===0){face.textContent='🥺';status.textContent='M is waiting for you…';quote.textContent='“We haven’t studied yet today.”'}else if(score<35){face.textContent='🐰';status.textContent='M is happy you started!';quote.textContent='“Just a little more!”'}else if(score<75){face.textContent='😄';status.textContent='M is proud of you!';quote.textContent='“Look how much we have done!”'}else{face.textContent='🤩';status.textContent='M is SO proud of you!';quote.textContent='“We did it! ⭐”'}}
function install(){const d=deepest();if(!d||!d.body)return;injectStyle(d);installSidebar(d);installExtras(d);const w=d.defaultView;enhanceAcademics(d,w);updateM(d)}outer.addEventListener('load',()=>{setTimeout(install,500);setTimeout(install,1500);setTimeout(install,3000)});setInterval(install,900);
</script></body></html>
