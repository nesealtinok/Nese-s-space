<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="outer" src="workspace-pro-v6.html?v=native-sidebar"></iframe><script>
const outer=document.getElementById('outer');
function deepest(){let w=outer;for(let i=0;i<8;i++){try{const d=w.contentDocument;if(!d)return null;const next=d.querySelector('iframe');if(!next)return d;w=next}catch(e){return null}}return null}
function install(){const d=deepest();if(!d||!d.body||!d.head)return false;if(d.getElementById('nativeSidebarStyle'))return true;const css=d.createElement('style');css.id='nativeSidebarStyle';css.textContent=`body.native-sidebar-closed .app{grid-template-columns:1fr!important}body.native-sidebar-closed .side{display:none!important}body.native-sidebar-closed .main{width:100%!important;max-width:none!important;padding-left:48px!important;padding-right:48px!important}body.native-sidebar-closed .nb{width:100%!important}body.native-sidebar-closed .nb-canvas{height:760px!important}#nativeSidebarToggle{position:fixed!important;left:250px!important;top:18px!important;z-index:2147483647!important;width:38px!important;height:38px!important;border:1px solid #cdd3da!important;border-radius:9px!important;background:#fff!important;color:#a31f34!important;font:700 21px/38px Arial,sans-serif!important;text-align:center!important;padding:0!important;cursor:pointer!important;box-shadow:0 4px 14px #10182025!important}body.native-sidebar-closed #nativeSidebarToggle{left:14px!important}@media(max-width:720px){#nativeSidebarToggle{left:14px!important}}`;
d.head.appendChild(css);let b=d.getElementById('nativeSidebarToggle');if(!b){b=d.createElement('button');b.id='nativeSidebarToggle';b.type='button';d.body.appendChild(b);b.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();const closed=!d.body.classList.contains('native-sidebar-closed');d.body.classList.toggle('native-sidebar-closed',closed);localStorage.setItem('nese-native-sidebar',closed?'1':'0');b.textContent=closed?'›':'‹';b.title=closed?'Show sidebar':'Hide sidebar';requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')))},true)}const closed=localStorage.getItem('nese-native-sidebar')==='1';d.body.classList.toggle('native-sidebar-closed',closed);b.textContent=closed?'›':'‹';b.title=closed?'Show sidebar':'Hide sidebar';return true}
outer.addEventListener('load',()=>{setTimeout(install,300);setTimeout(install,1000);setTimeout(install,2000)});setInterval(install,700);
</script></body></html>
