<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="outer" src="workspace-pro-v6.html?v=native-sidebar"></iframe><script>
const outer=document.getElementById('outer');
function deepest(){let w=outer;for(let i=0;i<8;i++){try{const d=w.contentDocument;if(!d)return null;const next=d.querySelector('iframe');if(!next)return d;w=next}catch(e){return null}}return null}
function install(){const d=deepest();if(!d||!d.body||!d.head)return false;if(!d.getElementById('nativeSidebarStyle')){const css=d.createElement('style');css.id='nativeSidebarStyle';css.textContent=`body.native-sidebar-closed .app{grid-template-columns:1fr!important}body.native-sidebar-closed .side{display:none!important}body.native-sidebar-closed .main{width:100%!important;max-width:none!important;padding-left:48px!important;padding-right:48px!important}body.native-sidebar-closed .nb{width:100%!important}body.native-sidebar-closed .nb-canvas{height:760px!important}#nativeSidebarToggle{position:fixed!important;left:250px!important;top:18px!important;z-index:2147483647!important;width:38px!important;height:38px!important;border:1px solid #cdd3da!important;border-radius:9px!important;background:#fff!important;color:#a31f34!important;font:700 21px/38px Arial,sans-serif!important;text-align:center!important;padding:0!important;cursor:pointer!important;box-shadow:0 4px 14px #10182025!important}body.native-sidebar-closed #nativeSidebarToggle{left:14px!important}@media(max-width:720px){#nativeSidebarToggle{left:14px!important}}#neseExtraPanel{position:fixed;right:18px;bottom:18px;z-index:2147483646;display:flex;gap:8px;align-items:center;font-family:Arial,sans-serif;flex-wrap:wrap;justify-content:flex-end}#neseExtraPanel button{border:1px solid #d8dce2;background:#fff;border-radius:12px;padding:9px 12px;color:#101820;font-weight:700;box-shadow:0 3px 12px #10182018;cursor:pointer}#nesePomodoro{position:fixed;right:18px;bottom:68px;z-index:2147483646;background:#fff;border:1px solid #d8dce2;border-radius:18px;padding:18px;width:230px;box-shadow:0 8px 28px #10182022;font-family:Arial,sans-serif;display:none;text-align:center}#nesePomodoro .time{font-size:38px;font-weight:800;margin:8px}#nesePomodoro button,#neseStudyPanel button,#neseFlashPanel button{margin:3px;border:1px solid #d8dce2;background:#f5f6f8;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer}#neseStudyPanel,#neseFlashPanel{position:fixed;right:18px;bottom:68px;z-index:2147483646;background:#fff;border:1px solid #d8dce2;border-radius:20px;padding:18px;width:330px;box-shadow:0 8px 28px #10182022;font-family:Arial,sans-serif;display:none}#neseStudyPanel h3,#neseFlashPanel h3{margin:0 0 12px}.m-room{background:linear-gradient(#f8f0e7,#fff);border-radius:16px;height:170px;position:relative;overflow:hidden;margin-bottom:12px;border:1px solid #eee2d8}.m-window{position:absolute;right:16px;top:15px;width:72px;height:58px;background:#dceaf5;border:4px solid #fff;box-shadow:0 2px 6px #0001}.m-desk{position:absolute;bottom:24px;left:22px;width:150px;height:10px;background:#b88962;border-radius:4px}.m-lamp{position:absolute;bottom:34px;left:145px;font-size:24px}.m-book{position:absolute;bottom:35px;left:74px;font-size:23px}.m-bunny{position:absolute;bottom:31px;left:73px;font-size:68px;line-height:1;filter:drop-shadow(0 3px 3px #0002)}.m-plant{position:absolute;bottom:27px;right:26px;font-size:40px}.m-status{text-align:center;font-weight:700;margin:7px 0}.m-progress{height:10px;background:#eee;border-radius:8px;overflow:hidden}.m-progress>span{display:block;height:100%;width:0;background:#a31f34;transition:width .3s}.m-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.m-stat{background:#f6f7f9;border-radius:10px;padding:8px;text-align:center;font-size:12px}.m-stat b{display:block;font-size:17px}.m-quote{text-align:center;color:#6b7280;font-size:13px;margin:8px 0}.m-actions{display:flex;gap:6px}.m-actions button{flex:1;background:#a31f34!important;color:#fff;border-color:#a31f34!important}.level-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}.level-tab{padding:9px 4px;border:1px solid #ddd;border-radius:10px;background:#fff;text-align:center;font-size:12px;font-weight:700}.level-tab.active{background:#a31f34;color:#fff;border-color:#a31f34}.card-item{border:1px solid #e1e4e8;border-radius:12px;padding:11px;margin:7px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.card-item small{display:block;color:#6b7280}.card-actions button{padding:5px 7px!important}.new-card{display:flex;gap:6px;margin-bottom:10px}.new-card input{flex:1;min-width:0;padding:9px;border:1px solid #d8dce2;border-radius:10px}`;d.head.appendChild(css)}let b=d.getElementById('nativeSidebarToggle');if(!b){b=d.createElement('button');b.id='nativeSidebarToggle';b.type='button';d.body.appendChild(b);b.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();const closed=!d.body.classList.contains('native-sidebar-closed');d.body.classList.toggle('native-sidebar-closed',closed);localStorage.setItem('nese-native-sidebar',closed?'1':'0');b.textContent=closed?'›':'‹';b.title=closed?'Show sidebar':'Hide sidebar';requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')))},true)}const closed=localStorage.getItem('nese-native-sidebar')==='1';d.body.classList.toggle('native-sidebar-closed',closed);b.textContent=closed?'›':'‹';b.title=closed?'Show sidebar':'Hide sidebar';installExtras(d);return true}
function installExtras(d){if(d.getElementById('neseExtraPanel'))return;const wrap=d.createElement('div');wrap.id='neseExtraPanel';wrap.innerHTML='<button id="nesePomBtn">🍅 Pomodoro</button><button id="neseFlashBtn">🧠 Flashcards</button><button id="neseStudyBtn">🐰 Study with M</button>';d.body.appendChild(wrap);
const pomo=d.createElement('div');pomo.id='nesePomodoro';pomo.innerHTML='<b>Pomodoro</b><div class="time" id="nesePTime">25:00</div><button id="nesePStart">Start</button><button id="nesePReset">Reset</button><div style="margin-top:7px;font-size:12px;color:#6b7280">25 min focus · 5 min break</div>';d.body.appendChild(pomo);
const flash=d.createElement('div');flash.id='neseFlashPanel';flash.innerHTML='<h3>🧠 Flashcards</h3><div class="new-card"><input id="neseFText" placeholder="Write a question or term"><button id="neseFAdd">Add</button></div><div class="level-tabs"><button class="level-tab active" data-level="0">🌱 New</button><button class="level-tab" data-level="1">🌿 Known</button><button class="level-tab" data-level="2">⭐ Expert</button></div><div id="neseCardList"></div>';d.body.appendChild(flash);
const study=d.createElement('div');study.id='neseStudyPanel';study.innerHTML='<h3>🐰 Study with M</h3><div class="m-room"><div class="m-window"></div><div class="m-desk"></div><div class="m-lamp">💡</div><div class="m-book">📖</div><div class="m-bunny" id="neseMFace">🐰</div><div class="m-plant">🪴</div></div><div class="m-status" id="neseMStatus">M is waiting for you 💗</div><div class="m-progress"><span id="neseMProgress"></span></div><div class="m-stats"><div class="m-stat"><b id="mMinutes">0</b>min</div><div class="m-stat"><b id="mPom">0</b>pomodoros</div><div class="m-stat"><b id="mCards">0</b>cards</div></div><div class="m-quote" id="neseMQuote">“Let’s study together!”</div><div class="m-actions"><button id="neseStudyStart">Start studying</button><button id="neseMReset">Reset day</button></div>';d.body.appendChild(study);
let cards=JSON.parse(localStorage.getItem('nese-flashcards')||'[]');let activeLevel=0;let studyData=JSON.parse(localStorage.getItem('nese-study-data')||'{"minutes":0,"pomodoros":0,"cards":0,"day":""}');const today=new Date().toDateString();if(studyData.day!==today)studyData={minutes:0,pomodoros:0,cards:0,day:today};
function save(){localStorage.setItem('nese-flashcards',JSON.stringify(cards));localStorage.setItem('nese-study-data',JSON.stringify(studyData))}function renderCards(){const list=d.getElementById('neseCardList');const filtered=cards.map((x,i)=>({...x,i})).filter(x=>x.level===activeLevel);list.innerHTML=filtered.length?filtered.map(x=>`<div class="card-item"><div>${escapeHtml(x.text)}<small>${x.subject||'General'}</small></div><div class="card-actions"><button data-promote="${x.i}">${x.level<2?'→':'✓'}</button><button data-del="${x.i}">🗑️</button></div></div>`).join(''):'<div style="text-align:center;color:#7b8490;padding:18px">No cards here yet.</div>'}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function updateM(){const total=Math.max(1,30);const score=Math.min(100,Math.round((studyData.cards/30)*60+(studyData.pomodoros/4)*30+(studyData.minutes/60)*10));d.getElementById('neseMProgress').style.width=score+'%';d.getElementById('mMinutes').textContent=studyData.minutes;d.getElementById('mPom').textContent=studyData.pomodoros;d.getElementById('mCards').textContent=studyData.cards;const status=d.getElementById('neseMStatus'),quote=d.getElementById('neseMQuote'),face=d.getElementById('neseMFace');if(score===0){face.textContent='🥺';status.textContent='M is waiting for you…';quote.textContent='“We have not studied yet today.”'}else if(score<40){face.textContent='🐰';status.textContent='M is happy you started!';quote.textContent='“Just a little more!”'}else if(score<80){face.textContent='😄';status.textContent='M is proud of you!';quote.textContent='“Look how much we have done!”'}else{face.textContent='🤩';status.textContent='M is SO proud of you!';quote.textContent='“We did it! ⭐”'}}
renderCards();updateM();d.getElementById('nesePomBtn').onclick=()=>{pomo.style.display=pomo.style.display==='block'?'none':'block';flash.style.display='none';study.style.display='none'};d.getElementById('neseFlashBtn').onclick=()=>{flash.style.display=flash.style.display==='block'?'none':'block';pomo.style.display='none';study.style.display='none';renderCards()};d.getElementById('neseStudyBtn').onclick=()=>{study.style.display=study.style.display==='block'?'none':'block';pomo.style.display='none';flash.style.display='none';updateM()};d.getElementById('neseFAdd').onclick=()=>{const input=d.getElementById('neseFText');if(!input.value.trim())return;cards.push({text:input.value.trim(),level:0,subject:'General'});input.value='';save();renderCards();updateM()};flash.querySelectorAll('.level-tab').forEach(t=>t.onclick=()=>{activeLevel=Number(t.dataset.level);flash.querySelectorAll('.level-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');renderCards()});flash.addEventListener('click',e=>{const p=e.target.closest('[data-promote]');const del=e.target.closest('[data-del]');if(p){const i=Number(p.dataset.promote);if(cards[i].level<2){cards[i].level++;studyData.cards++;save();renderCards();updateM()}}if(del){cards.splice(Number(del.dataset.del),1);save();renderCards();updateM()}});
let timer=1500,interval=null;function tick(){timer--;if(timer<=0){clearInterval(interval);interval=null;timer=300;studyData.pomodoros++;studyData.minutes+=25;save();updateM();alert('Pomodoro complete! M is proud of you 🎉')}d.getElementById('nesePTime').textContent=String(Math.floor(timer/60)).padStart(2,'0')+':'+String(timer%60).padStart(2,'0')}d.getElementById('nesePStart').onclick=()=>{if(interval)return;interval=setInterval(tick,1000)};d.getElementById('nesePReset').onclick=()=>{clearInterval(interval);interval=null;timer=1500;d.getElementById('nesePTime').textContent='25:00'};d.getElementById('neseStudyStart').onclick=()=>{studyData.minutes++;save();updateM()};d.getElementById('neseMReset').onclick=()=>{studyData={minutes:0,pomodoros:0,cards:0,day:today};save();updateM()}}
outer.addEventListener('load',()=>{setTimeout(install,300);setTimeout(install,1000);setTimeout(install,2000)});setInterval(install,700);
</script></body></html>
