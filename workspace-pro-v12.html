<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}</style></head><body><iframe id="outer" src="workspace-pro-v6.html?v=native-sidebar"></iframe><script>
const outer=document.getElementById('outer');
function deepest(){let w=outer;for(let i=0;i<8;i++){try{const d=w.contentDocument;if(!d)return null;const next=d.querySelector('iframe');if(!next)return d;w=next}catch(e){return null}}return null}
function install(){const d=deepest();if(!d||!d.body||!d.head)return false;if(!d.getElementById('nativeSidebarStyle')){const css=d.createElement('style');css.id='nativeSidebarStyle';css.textContent=`body.native-sidebar-closed .app{grid-template-columns:1fr!important}body.native-sidebar-closed .side{display:none!important}body.native-sidebar-closed .main{width:100%!important;max-width:none!important;padding-left:48px!important;padding-right:48px!important}body.native-sidebar-closed .nb{width:100%!important}body.native-sidebar-closed .nb-canvas{height:760px!important}#nativeSidebarToggle{position:fixed!important;left:250px!important;top:18px!important;z-index:2147483647!important;width:38px!important;height:38px!important;border:1px solid #cdd3da!important;border-radius:9px!important;background:#fff!important;color:#a31f34!important;font:700 21px/38px Arial,sans-serif!important;text-align:center!important;padding:0!important;cursor:pointer!important;box-shadow:0 4px 14px #10182025!important}body.native-sidebar-closed #nativeSidebarToggle{left:14px!important}@media(max-width:720px){#nativeSidebarToggle{left:14px!important}}#neseExtraPanel{position:fixed;right:18px;bottom:18px;z-index:2147483646;display:flex;gap:8px;align-items:center;font-family:Arial,sans-serif}#neseExtraPanel button{border:1px solid #d8dce2;background:#fff;border-radius:12px;padding:9px 12px;color:#101820;font-weight:700;box-shadow:0 3px 12px #10182018}#nesePomodoro{position:fixed;right:18px;bottom:68px;z-index:2147483646;background:#fff;border:1px solid #d8dce2;border-radius:18px;padding:18px;width:220px;box-shadow:0 8px 28px #10182022;font-family:Arial,sans-serif;display:none;text-align:center}#nesePomodoro .time{font-size:38px;font-weight:800;margin:8px}#nesePomodoro button{margin:3px;border:1px solid #d8dce2;background:#f5f6f8;border-radius:10px;padding:8px 10px;font-weight:700}#neseStudyPanel{position:fixed;right:18px;bottom:68px;z-index:2147483646;background:#fff;border:1px solid #d8dce2;border-radius:18px;padding:16px;width:280px;box-shadow:0 8px 28px #10182022;font-family:Arial,sans-serif;display:none}#neseStudyPanel h3{margin:0 0 8px}#neseStudyPanel .mface{font-size:54px;text-align:center;margin:4px}#neseStudyPanel .sad{filter:grayscale(.15);transform:translateY(2px)}#neseFlashPanel{position:fixed;right:18px;bottom:68px;z-index:2147483646;background:#fff;border:1px solid #d8dce2;border-radius:18px;padding:16px;width:310px;box-shadow:0 8px 28px #10182022;font-family:Arial,sans-serif;display:none}#neseFlashPanel h3{margin:0 0 10px}#neseFlashPanel .levels{display:grid;gap:7px}#neseFlashPanel .level{padding:10px;border:1px solid #e0e3e8;border-radius:12px;display:flex;justify-content:space-between;font-weight:700}#neseFlashPanel input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d8dce2;border-radius:10px;margin-bottom:8px}`;d.head.appendChild(css)}let b=d.getElementById('nativeSidebarToggle');if(!b){b=d.createElement('button');b.id='nativeSidebarToggle';b.type='button';d.body.appendChild(b);b.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();const closed=!d.body.classList.contains('native-sidebar-closed');d.body.classList.toggle('native-sidebar-closed',closed);localStorage.setItem('nese-native-sidebar',closed?'1':'0');b.textContent=closed?'›':'‹';b.title=closed?'Show sidebar':'Hide sidebar';requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')))},true)}const closed=localStorage.getItem('nese-native-sidebar')==='1';d.body.classList.toggle('native-sidebar-closed',closed);b.textContent=closed?'›':'‹';b.title=closed?'Show sidebar':'Hide sidebar';installExtras(d);return true}
function installExtras(d){if(d.getElementById('neseExtraPanel'))return;const wrap=d.createElement('div');wrap.id='neseExtraPanel';wrap.innerHTML='<button id="nesePomBtn">🍅 Pomodoro</button><button id="neseFlashBtn">🧠 Flashcards</button><button id="neseStudyBtn">🐰 M Study</button>';d.body.appendChild(wrap);const pomo=d.createElement('div');pomo.id='nesePomodoro';pomo.innerHTML='<b>Pomodoro</b><div class="time" id="nesePTime">25:00</div><button id="nesePStart">Start</button><button id="nesePReset">Reset</button><div style="margin-top:7px;font-size:12px;color:#6b7280">25 min focus · 5 min break</div>';d.body.appendChild(pomo);const flash=d.createElement('div');flash.id='neseFlashPanel';flash.innerHTML='<h3>🧠 Flashcards</h3><input id="neseFText" placeholder="New flashcard"><button id="neseFAdd">Add card</button><div class="levels" style="margin-top:10px"><div class="level"><span>🌱 Newly learned</span><span id="neseNewCount">0</span></div><div class="level"><span>🌿 Somewhat known</span><span id="neseKnownCount">0</span></div><div class="level"><span>⭐ Expert</span><span id="neseExpertCount">0</span></div></div>';d.body.appendChild(flash);const study=d.createElement('div');study.id='neseStudyPanel';study.innerHTML='<h3>🐰 Study with M</h3><div id="neseMFace" class="mface">🐰</div><div id="neseMText" style="text-align:center;margin:6px 0 12px">Let’s study together!</div><button id="neseStudyStart" style="width:100%;padding:10px;border:0;border-radius:10px;background:#a31f34;color:#fff;font-weight:800">Start studying</button>';d.body.appendChild(study);let cards=JSON.parse(localStorage.getItem('nese-flashcards')||'[]');function renderCards(){let a=cards.filter(x=>x.level===0).length,b=cards.filter(x=>x.level===1).length,c=cards.filter(x=>x.level===2).length;flash.querySelector('#neseNewCount').textContent=a;flash.querySelector('#neseKnownCount').textContent=b;flash.querySelector('#neseExpertCount').textContent=c}renderCards();d.getElementById('nesePomBtn').onclick=()=>{pomo.style.display=pomo.style.display==='block'?'none':'block';flash.style.display='none';study.style.display='none'};d.getElementById('neseFlashBtn').onclick=()=>{flash.style.display=flash.style.display==='block'?'none':'block';pomo.style.display='none';study.style.display='none';renderCards()};d.getElementById('neseStudyBtn').onclick=()=>{study.style.display=study.style.display==='block'?'none':'block';pomo.style.display='none';flash.style.display='none';updateM()};d.getElementById('neseFAdd').onclick=()=>{const input=d.getElementById('neseFText');if(!input.value.trim())return;cards.push({text:input.value.trim(),level:0});localStorage.setItem('nese-flashcards',JSON.stringify(cards));input.value='';renderCards();updateM()};let timer=1500,interval=null;function tick(){timer--;if(timer<0){clearInterval(interval);interval=null;timer=300}d.getElementById('nesePTime').textContent=String(Math.floor(timer/60)).padStart(2,'0')+':'+String(timer%60).padStart(2,'0')}d.getElementById('nesePStart').onclick=()=>{if(interval)return;interval=setInterval(tick,1000)};d.getElementById('nesePReset').onclick=()=>{clearInterval(interval);interval=null;timer=1500;d.getElementById('nesePTime').textContent='25:00'};let studying=false;function updateM(){const today=localStorage.getItem('nese-studied-today')===new Date().toDateString();const face=d.getElementById('neseMFace'),text=d.getElementById('neseMText');if(studying||today){face.textContent='🐰';face.className='mface';text.textContent='Yay! You are studying! M is proud of you 💗'}else{face.textContent='🥺';face.className='mface sad';text.textContent='M misses you… let’s study a little?'} }d.getElementById('neseStudyStart').onclick=()=>{studying=true;localStorage.setItem('nese-studied-today',new Date().toDateString());updateM()};updateM()}
outer.addEventListener('load',()=>{setTimeout(install,300);setTimeout(install,1000);setTimeout(install,2000)});setInterval(install,700);
</script></body></html>
