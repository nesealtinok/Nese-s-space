.nb{margin-top:20px;border:1px solid #dfe3e8;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 12px 32px #1018200d}.nb-coverarea{padding:28px;background:linear-gradient(135deg,#f8f5ef,#ebe6dc);display:flex;justify-content:center}.nb-cover{width:min(390px,90%);aspect-ratio:3/4;border-radius:20px;position:relative;overflow:hidden;background:#f2eee7;border:1px solid #cec5b8;box-shadow:0 22px 48px #10182028}.nb-cover:before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#111 0 5px,transparent 6px);background-size:43px 43px;background-position:4px 4px}.nb-coverlabel{position:absolute;z-index:2;top:38%;left:10%;right:10%;padding:18px 8px;text-align:center;background:#ece6dcdd;border:1px solid #d4cabd;color:#fff;text-shadow:0 1px 2px #555;font:italic 38px Georgia,serif}.nb-coverlabel span{display:block;font-size:27px;margin-top:5px}.nb-open{position:absolute;z-index:4;bottom:25px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;background:#a31f34;color:#fff;padding:12px 26px;font-weight:700;box-shadow:0 6px 15px #10182030}.nb-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #e4e7eb;background:#fafafa}.nb-head small{display:block;color:#697586}.nb-actions,.nb-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.nb-actions input{width:130px}.nb-btn,.nb-tool{border:1px solid #ccd2d9;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.nb-primary,.nb-tool.active{background:#a31f34!important;color:#fff!important;border-color:#a31f34!important}.nb-pages{display:flex;gap:6px;overflow:auto;padding:8px 10px;background:#f7f8fa;border-bottom:1px solid #e4e7eb}.nb-tab{border:1px solid #d7dce2;background:#fff;border-radius:7px;padding:7px 11px;white-space:nowrap}.nb-tab.active{background:#101820;color:#fff}.nb-paper{padding:14px;background:#eef0f3}.nb-paperinner{background:#fff;border:1px solid #dfe3e8;border-radius:9px;overflow:hidden}.nb-canvas{display:block;width:100%;height:650px;touch-action:none;background-color:#fff;background-size:100% 28px}.nb-canvas.lined{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#dce1e7 28px)}.nb-canvas.grid{background-image:linear-gradient(#dce1e7 1px,transparent 1px),linear-gradient(90deg,#dce1e7 1px,transparent 1px);background-size:28px 28px}.nb-canvas.dot{background-image:radial-gradient(#d5dbe2 .8px,transparent .8px);background-size:18px 18px}.nb-tools{padding:9px 10px;border-top:1px solid #e4e7eb;background:#fff}.nb-color{width:24px;height:24px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #c8ced6}.nb-footer{padding:8px 12px;color:#697586;font-size:11px;border-top:1px solid #e4e7eb;background:#fafafa;display:flex;justify-content:space-between}.nb-modal{position:fixed;inset:0;background:#10182066;z-index:99999;display:grid;place-items:center;padding:20px}.nb-modalcard{width:min(430px,92vw);background:white;border-radius:18px;padding:24px;box-shadow:0 25px 70px #10182055}.nb-types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.nb-type{border:1px solid #d5dbe2;border-radius:12px;padding:14px 8px;background:#fff;cursor:pointer;text-align:center}.nb-type b{display:block;margin-top:8px}.nb-preview{height:75px;border:1px solid #e1e5e9;border-radius:8px;background:#fff}.nb-preview.l{background:repeating-linear-gradient(to bottom,#fff 0,#fff 15px,#dce1e7 16px)}.nb-preview.g{background-image:linear-gradient(#dce1e7 1px,transparent 1px),linear-gradient(90deg,#dce1e7 1px,transparent 1px);background-size:16px 16px}.nb-preview.d{background-image:radial-gradient(#cfd6de 1px,transparent 1px);background-size:12px 12px}@media(max-width:720px){.nb-head{align-items:flex-start;flex-direction:column}.nb-canvas{height:570px}}

const NKEY='nese-notebook-persistent-v1';function loadN(w){try{return JSON.parse(w.localStorage.getItem(NKEY)||'null')||{pages:[{name:'Page 1',type:'lined',image:null}],active:0}}catch(e){return{pages:[{name:'Page 1',type:'lined',image:null}],active:0}}}function saveN(w,x){w.localStorage.setItem(NKEY,JSON.stringify(x))}
function addNotebook(w,d){const a=d.getElementById('academics');if(!a||!a.classList.contains('active')||d.getElementById('nb'))return;const target=[...a.querySelectorAll('.card')].find(c=>/Apple Pencil workspace/i.test(c.textContent));if(!target)return;const box=d.createElement('div');box.className='card s12 nb';box.id='nb';box.innerHTML='<div style="padding:24px"><div class="ey">Notebook</div><h2>nese’s notebook</h2><p class="muted">Your permanent handwritten notebook.</p><div id="nbmount"></div></div>';a.appendChild(box);showCover(w,d)}
function showCover(w,d){const r=d.getElementById('nbmount');if(!r)return;r.innerHTML='<div class="nb-coverarea"><div class="nb-cover"><div class="nb-coverlabel">nese’s<span>notebook</span></div><button class="nb-open">Open notebook</button></div></div>';r.querySelector('.nb-open').onclick=()=>showBook(w,d)}
function choosePage(w,d,x){const m=d.createElement('div');m.className='nb-modal';m.innerHTML='<div class="nb-modalcard"><h2>New page</h2><p class="muted">Choose your paper</p><div class="nb-types"><button class="nb-type" data-t="lined"><div class="nb-preview l"></div><b>Lined</b></button><button class="nb-type" data-t="grid"><div class="nb-preview g"></div><b>Grid</b></button><button class="nb-type" data-t="dot"><div class="nb-preview d"></div><b>Dotted</b></button></div><button class="nb-btn" id="nbcancel">Cancel</button></div>';d.body.appendChild(m);m.querySelector('#nbcancel').onclick=()=>m.remove();m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{x.pages.push({name:'Page '+(x.pages.length+1),type:b.dataset.t,image:null});x.active=x.pages.length-1;saveN(w,x);m.remove();showBook(w,d)})}
function showBook(w,d){const r=d.getElementById('nbmount');let x=loadN(w);if(!x.pages.length)x.pages=[{name:'Page 1',type:'lined',image:null}];x.active=Math.max(0,Math.min(x.active,x.pages.length-1));saveN(w,x);r.innerHTML='<div class="nb-head"><div><b>nese’s notebook</b><small>'+esc(x.pages[x.active].name)+' · '+x.pages[x.active].type+'</small></div><div class="nb-actions"><input id="nbname" value="'+esc(x.pages[x.active].name)+'"><button class="nb-btn" id="nbrename">Rename</button><button class="nb-btn nb-primary" id="nbnew">＋ New page</button><button class="nb-btn" id="nbcover">Cover</button></div></div><div class="nb-pages" id="nbpages"></div><div class="nb-paper"><div class="nb-paperinner"><canvas id="nbcanvas" class="nb-canvas '+x.pages[x.active].type+'"></canvas><div class="nb-tools"><button class="nb-tool active" data-t="pen">✎ Pen</button><button class="nb-tool" data-t="pencil">✏ Pencil</button><button class="nb-tool" data-t="marker">🖍 Marker</button><button class="nb-tool" data-t="eraser">⌫ Eraser</button><button class="nb-color" data-c="#101820" style="background:#101820"></button><button class="nb-color" data-c="#a31f34" style="background:#a31f34"></button><button class="nb-color" data-c="#2563eb" style="background:#2563eb"></button><button class="nb-color" data-c="#16a34a" style="background:#16a34a"></button><button class="nb-color" data-c="#f59e0b" style="background:#f59e0b"></button><button class="nb-color" data-c="#7c3aed" style="background:#7c3aed"></button><span class="muted">Size</span><input id="nbsize" type="range" min="1" max="12" value="3"><button class="nb-tool" id="nbundo">↶</button><button class="nb-tool" id="nbredo">↷</button><button class="nb-tool" id="nbclear">Clear</button><button class="nb-tool" id="nbsave">✓ Save</button><button class="nb-tool" id="nbdelete" style="color:#a31f34">Delete page</button></div></div></div><div class="nb-footer"><span id="nbstatus">Auto-saved</span><span>Page '+(x.active+1)+' of '+x.pages.length+'</span></div>';const pages=d.getElementById('nbpages');x.pages.forEach((p,i)=>{const b=d.createElement('button');b.className='nb-tab'+(i===x.active?' active':'');b.textContent=p.name;b.onclick=()=>{saveCanvas(w,d,x);x.active=i;saveN(w,x);showBook(w,d)};pages.appendChild(b)});d.getElementById('nbnew').onclick=()=>{saveCanvas(w,d,x);choosePage(w,d,x)};d.getElementById('nbcover').onclick=()=>showCover(w,d);d.getElementById('nbrename').onclick=()=>{const n=d.getElementById('nbname').value.trim();if(n){x.pages[x.active].name=n;saveN(w,x);showBook(w,d)}};d.getElementById('nbdelete').onclick=()=>{if(x.pages.length<2)return;if(confirm('Delete this page?')){x.pages.splice(x.active,1);x.active=Math.max(0,x.active-1);saveN(w,x);showBook(w,d)}};setupCanvas(w,d,x)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saveCanvas(w,d,x){const c=d.getElementById('nbcanvas');if(c){x.pages[x.active].image=c.toDataURL('image/png');saveN(w,x)}}
function setupCanvas(w,d,x){const c=d.getElementById('nbcanvas'),ctx=c.getContext('2d'),z=Math.max(1,Math.min(2.5,w.devicePixelRatio||1));c.width=c.clientWidth*z;c.height=c.clientHeight*z;ctx.scale(z,z);ctx.lineCap='round';ctx.lineJoin='round';let tool='pen',color='#101820',size=3,down=false,undo=[],redo=[];const shot=()=>c.toDataURL('image/png');const load=u=>{ctx.clearRect(0,0,c.clientWidth,c.clientHeight);if(!u)return;const im=new Image;im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight);im.src=u};load(x.pages[x.active].image);const save=()=>{x.pages[x.active].image=shot();saveN(w,x);const s=d.getElementById('nbstatus');if(s)s.textContent='Saved automatically · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};const pos=e=>{const q=c.getBoundingClientRect();return{x:e.clientX-q.left,y:e.clientY-q.top}};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);undo.push(shot());redo=[];const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!down)return;const p=pos(e),pressure=e.pressure>0?e.pressure:.5;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=color;ctx.globalAlpha=tool==='marker'?.28:1;const mult=tool==='marker'?3.5:tool==='pencil'?.65:tool==='eraser'?4:1;ctx.lineWidth=Math.max(.7,size*mult*(.65+pressure*.7));ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>{down=false;ctx.globalAlpha=1;ctx.closePath();save()};c.onpointercancel=()=>down=false;d.querySelectorAll('#nb [data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;d.querySelectorAll('#nb [data-t]').forEach(q=>q.classList.remove('active'));b.classList.add('active')});d.querySelectorAll('#nb [data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;tool='pen';d.querySelectorAll('#nb [data-t]').forEach(q=>q.classList.remove('active'));d.querySelector('#nb [data-t="pen"]').classList.add('active')});d.getElementById('nbsize').oninput=e=>size=+e.target.value;d.getElementById('nbsave').onclick=save;d.getElementById('nbclear').onclick=()=>{if(confirm('Clear this page?')){undo.push(shot());ctx.clearRect(0,0,c.clientWidth,c.clientHeight);save()}};d.getElementById('nbundo').onclick=()=>{if(undo.length){redo.push(shot());load(undo.pop());save()}};d.getElementById('nbredo').onclick=()=>{if(redo.length){undo.push(shot());load(redo.pop());save()}}}
function addProfile(d,w){const side=d.querySelector('.side');if(!side||d.querySelector('.profile-mini'))return;const p=d.createElement('div');p.className='profile-mini';let q={};try{q=JSON.parse(d.defaultView.localStorage.getItem('nese-pro-v1')||'{}')}catch(e){}p.innerHTML='<div class="avatar" id="miniAvatar">'+(q.profile?.emoji||'🖤')+'</div><div class="ptext"><b id="miniName">'+(q.profile?.name||'Nese')+'</b><small>Edit profile</small></div>';side.appendChild(p)}function addPageControls(d,w){[...d.querySelectorAll('.view')].forEach(v=>{if(v.querySelector('.page-tools'))return;const tools=d.createElement('div');tools.className='page-tools';tools.innerHTML='<button class="save-page">✓ Save page</button><button class="delete-page">⌫ Clear page data</button>';v.prepend(tools)})}
frame.addEventListener('load',()=>{enhance();setTimeout(enhance,500);setTimeout(enhance,1200);setInterval(()=>{const w=frame.contentWindow,d=w.document;if(d.getElementById('academics')?.classList.contains('active'))addNotebook(w,d)},1000)});
