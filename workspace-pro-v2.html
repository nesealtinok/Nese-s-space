<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#appFrame{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="appFrame" src="workspace-pro.html"></iframe><script>
const frame=document.getElementById('appFrame');
function enhance(){const w=frame.contentWindow,d=w.document;if(!d.body)return;const style=d.createElement('style');style.textContent=`
.side{background:#b5b7b9!important}.side .brand b,.side .nav button{color:#a31f34!important}.side .brand small,.side .label{color:#f7f7f7!important}.side .nav button.active,.side .nav button:hover{background:#ffffff38!important;color:#a31f34!important;box-shadow:inset 3px 0 #a31f34!important}.side .nav button span{color:#a31f34!important}.side .brand .logo{font-size:0!important;display:grid!important;place-items:center!important;background:#a31f34!important;position:relative!important;overflow:hidden!important}.side .brand .logo:after{content:'MIT'!important;font-family:Arial,Helvetica,sans-serif!important;font-size:20px!important;font-weight:900!important;letter-spacing:-2px!important;color:#fff!important;line-height:1!important}.topbar,.header,.pagebar,.viewbar{background:#f4f5f7!important}
.profile-mini{position:absolute;left:16px;right:16px;bottom:18px;border-top:1px solid #ffffff55;padding:14px 8px 0;display:flex;align-items:center;gap:10px;cursor:pointer}.profile-mini .avatar{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;color:#101820;flex:none}.profile-mini .ptext{min-width:0}.profile-mini b{display:block;font-size:12px;color:#fff!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-mini small{display:block;color:#f7f7f7;font-size:10px}
.page-tools{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}.page-tools .save-page{background:#a31f34;color:#fff;border-color:#a31f34}.page-tools button{border:1px solid #cdd3da;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.page-tools .delete-page{color:#a31f34}
.profile-pop{position:fixed;inset:0;background:#10182088;display:none;place-items:center;z-index:9999;padding:20px}.profile-pop.open{display:grid}.profile-card{background:#fff;border-radius:16px;width:min(430px,100%);padding:25px;box-shadow:0 20px 70px #0004}.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:12px 0}.emoji-grid button{border:1px solid #dfe3e8;background:#fff;border-radius:9px;font-size:22px;padding:7px;cursor:pointer}.emoji-grid button:hover{border-color:#a31f34}.profile-card input{width:100%;box-sizing:border-box;margin:6px 0 10px;padding:10px;border:1px solid #cdd3da;border-radius:8px}.profile-actions{display:flex;gap:8px;margin-top:10px}.profile-actions button{border:1px solid #cdd3da;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.profile-actions .primary{background:#a31f34;color:#fff;border-color:#a31f34}@media(max-width:720px){.profile-mini{position:fixed}}
`;
d.head.appendChild(style);const side=d.querySelector('.side');if(!side)return;
if(!d.querySelector('.profile-mini')){const p=d.createElement('div');p.className='profile-mini';p.innerHTML='<div class="avatar" id="miniAvatar">'+(JSON.parse(localStorage.getItem('nese-pro-v1')||'{}').profile?.emoji||'🖤')+'</div><div class="ptext"><b id="miniName">'+(JSON.parse(localStorage.getItem('nese-pro-v1')||'{}').profile?.name||'Nese')+'</b><small>Edit profile</small></div>';p.onclick=()=>openProfile(d,w);side.appendChild(p)}
if(!d.querySelector('.profile-pop')){const pop=d.createElement('div');pop.className='profile-pop';pop.id='profilePop';pop.innerHTML='<div class="profile-card"><div class="ey">Personal profile</div><h2>Edit Profile</h2><label>Name</label><input id="profileName"><label>Goal</label><input id="profileGoal"><div class="muted" style="font-size:12px">Choose your profile emoji</div><div class="emoji-grid">'+['🖤','🕷️','🎸','🦇','🕶️','⚡','🌑','🎧','💻','🎨','🪐','🥀','🔥','☠️','🌙','⭐'].map(e=>'<button type="button" data-e="'+e+'">'+e+'</button>').join('')+'</div><div class="profile-actions"><button class="primary" id="profileSave">Save profile</button><button id="profileClose">Cancel</button></div></div>';d.body.appendChild(pop);pop.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{pop.dataset.emoji=b.dataset.e;});pop.querySelector('#profileClose').onclick=()=>pop.classList.remove('open');pop.querySelector('#profileSave').onclick=()=>saveProfile(d,pop)}addPageControls(d,w)}
function getData(d){let x;try{x=JSON.parse(d.defaultView.localStorage.getItem('nese-pro-v1')||'null')}catch(e){x=null}return x||{profile:{name:'Nese',goal:'MIT Computer Science',emoji:'🖤'}}}function openProfile(d,w){const p=getData(d),pop=d.getElementById('profilePop');pop.querySelector('#profileName').value=p.profile?.name||'Nese';pop.querySelector('#profileGoal').value=p.profile?.goal||'';pop.dataset.emoji=p.profile?.emoji||'🖤';pop.classList.add('open')}function saveProfile(d,pop){const p=getData(d);p.profile=p.profile||{};p.profile.name=pop.querySelector('#profileName').value||'Nese';p.profile.goal=pop.querySelector('#profileGoal').value||'';p.profile.emoji=pop.dataset.emoji||p.profile.emoji||'🖤';d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));const a=d.getElementById('miniAvatar'),n=d.getElementById('miniName');if(a)a.textContent=p.profile.emoji;if(n)n.textContent=p.profile.name;pop.classList.remove('open');d.getElementById('status').textContent='Saved locally'}function addPageControls(d,w){[...d.querySelectorAll('.view')].forEach(v=>{if(v.querySelector('.page-tools'))return;const tools=d.createElement('div');tools.className='page-tools';tools.innerHTML='<button class="save-page">✓ Save page</button><button class="delete-page">⌫ Clear page data</button>';tools.querySelector('.save-page').onclick=()=>{try{w.save()}catch(e){}d.getElementById('status').textContent='Saved locally'};tools.querySelector('.delete-page').onclick=()=>{if(confirm('Clear the saved data for this page? This cannot be undone.'))clearPageData(v.id,w,d)};v.prepend(tools)})}function clearPageData(id,w,d){let p=getData(d);if(id==='academics'){p.notes=[];p.cards=[];p.drawings=[];d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));w.R.academics()}else if(id==='projects'){p.projects=[];d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));w.R.projects()}else if(id==='research'){p.research=[];d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));w.R.research()}else if(id==='home'){p.tasks=[];d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));w.R.home()}else if(id==='calendar'){p.calendar={};d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));w.R.calendar()}else if(id==='coding'){d.localStorage.removeItem('coding-progress');w.R.coding()}d.getElementById('status').textContent='Page cleared'}frame.addEventListener('load',()=>{enhance();setTimeout(enhance,300);setTimeout(enhance,1000)});
</script></body></html>
