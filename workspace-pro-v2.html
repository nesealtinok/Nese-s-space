<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f5f7}#appFrame{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="appFrame" src="workspace-pro.html"></iframe><script>
const frame=document.getElementById('appFrame');let drawingEnhanced=false;
function enhanceDrawing(w,d){if(!w.R||!w.R.academics)return;if(!drawingEnhanced){const old=w.R.academics;w.R.academics=function(){old();setTimeout(()=>setupCanvas(w,d),30)};drawingEnhanced=true}setTimeout(()=>setupCanvas(w,d),50)}
function setupCanvas(w,d){const c=d.getElementById('cnv');if(!c||c.dataset.proReady)return;c.dataset.proReady='1';const box=c.closest('.canvasbox');if(!box)return;const oldToolbar=box.parentElement.querySelector('.toolbar');if(oldToolbar)oldToolbar.remove();c.style.width='100%';c.style.height='760px';c.style.touchAction='none';c.style.cursor='crosshair';box.style.touchAction='none';const z=Math.max(1,Math.min(2.5,w.devicePixelRatio||1));const resize=()=>{const old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0);c.width=Math.floor(c.clientWidth*z);c.height=Math.floor(c.clientHeight*z);const ctx=c.getContext('2d');ctx.setTransform(z,0,0,z,0,0);if(old.width&&old.height)ctx.drawImage(old,0,0,old.width/z,old.height/z,0,0,c.clientWidth,c.clientHeight);ctx.lineCap='round';ctx.lineJoin='round'};resize();let ctx=c.getContext('2d');let tool='pen',color='#101820',base=2.8,down=false,last=null,saveTimer;const data=()=>{try{return JSON.parse(w.localStorage.getItem('nese-pro-v1')||'{}')}catch(e){return {}}};const persist=()=>{clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const x=data();x.drawings=x.drawings||[];const name=x.drawings[0]?.name||'Apple Pencil Notes';const item={name,date:new Date().toLocaleString(),image:c.toDataURL('image/png')};if(x.drawings.length&&x.drawings[0].name==='Apple Pencil Notes')x.drawings[0]=item;else x.drawings.unshift(item);w.localStorage.setItem('nese-pro-v1',JSON.stringify(x));d.getElementById('status').textContent='Saved automatically'},350)};const load=()=>{const x=data();const item=(x.drawings||[]).find(v=>v.image);if(!item)return;const im=new Image();im.onload=()=>{ctx.clearRect(0,0,c.clientWidth,c.clientHeight);ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight)};im.src=item.image};load();const pos=e=>{const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);last=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y)};c.onpointermove=e=>{if(!down)return;const p=pos(e),pressure=e.pressure>0?e.pressure:0.5;ctx.strokeStyle=tool==='eraser'?'#fff':color;ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.lineWidth=tool==='marker'?base*3.8:tool==='eraser'?base*4:base*(0.75+pressure*0.9);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};c.onpointerup=()=>{down=false;ctx.closePath();persist()};c.onpointercancel=()=>{down=false};
const tb=d.createElement('div');tb.className='toolbar pencil-tools';tb.innerHTML='<button class="btn red" data-tool="pen">✎ Pen</button><button class="btn" data-tool="marker">🖍 Marker</button><button class="btn" data-tool="eraser">⌫ Eraser</button><span style="display:flex;align-items:center;gap:5px"><span class="muted">Color</span><button class="sw" data-color="#101820"></button><button class="sw" data-color="#a31f34"></button><button class="sw" data-color="#2563eb"></button><button class="sw" data-color="#16a34a"></button><button class="sw" data-color="#f59e0b"></button><button class="sw" data-color="#7c3aed"></button></span><label class="muted" style="display:flex;align-items:center;gap:6px">Size <input id="penSize" type="range" min="1" max="10" value="3" style="width:90px"></label><button class="btn" id="savePencil">✓ Save</button><button class="btn" id="clearPencil">Clear</button><button class="btn" id="exportPencil">Export PNG</button>';const st=d.createElement('style');st.textContent='.pencil-tools{align-items:center}.pencil-tools .sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cdd3da;cursor:pointer}.pencil-tools .sw[data-color="#101820"]{background:#101820}.pencil-tools .sw[data-color="#a31f34"]{background:#a31f34}.pencil-tools .sw[data-color="#2563eb"]{background:#2563eb}.pencil-tools .sw[data-color="#16a34a"]{background:#16a34a}.pencil-tools .sw[data-color="#f59e0b"]{background:#f59e0b}.pencil-tools .sw[data-color="#7c3aed"]{background:#7c3aed}.pencil-tools{margin-top:10px}.pencil-tools input{padding:0;border:0}';d.head.appendChild(st);box.parentElement.insertBefore(tb,box.nextSibling);tb.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;tb.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('red'));b.classList.add('red');c.style.cursor=tool==='eraser'?'cell':'crosshair';ctx.globalCompositeOperation='source-over'});tb.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;tool='pen';tb.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('red'));tb.querySelector('[data-tool="pen"]').classList.add('red')});tb.querySelector('#penSize').oninput=e=>base=+e.target.value;tb.querySelector('#savePencil').onclick=()=>{persist();setTimeout(()=>{d.getElementById('status').textContent='Saved locally'},400)};tb.querySelector('#clearPencil').onclick=()=>{if(confirm('Clear this handwriting page?')){ctx.clearRect(0,0,c.clientWidth,c.clientHeight);const x=data();x.drawings=(x.drawings||[]).filter(v=>v.name!=='Apple Pencil Notes');w.localStorage.setItem('nese-pro-v1',JSON.stringify(x));d.getElementById('status').textContent='Page cleared'}};tb.querySelector('#exportPencil').onclick=()=>{const a=d.createElement('a');a.href=c.toDataURL('image/png');a.download='Nese-Notes.png';a.click()};window.addEventListener('resize',()=>{if(d.getElementById('academics')?.classList.contains('active')){c.dataset.proReady='';setTimeout(()=>setupCanvas(w,d),100)}})}
function enhance(){const w=frame.contentWindow,d=w.document;if(!d.body)return;const style=d.createElement('style');style.textContent=`
.side{background:#f4f5f7!important}.side .brand b,.side .nav button{color:#a31f34!important}.side .brand small,.side .label{color:#555!important}.side .nav button.active,.side .nav button:hover{background:#a31f3412!important;color:#a31f34!important;box-shadow:inset 3px 0 #a31f34!important}.side .nav button span{color:#a31f34!important}.side .brand .logo{font-size:0!important;display:block!important;background:transparent!important;position:relative!important;overflow:visible!important;width:42px!important;height:42px!important}.side .brand .logo:after{content:'M'!important;font-family:Arial Black,Arial,sans-serif!important;font-size:34px!important;font-weight:900!important;letter-spacing:-5px!important;color:#a31f34!important;line-height:42px!important;position:absolute!important;inset:0!important;text-align:center!important}.topbar,.header,.pagebar,.viewbar{background:#f4f5f7!important}.canvas{height:760px!important;touch-action:none!important}.canvasbox{touch-action:none!important}
.profile-mini{position:absolute;left:16px;right:16px;bottom:18px;border-top:1px solid #cdd1d5;padding:14px 8px 0;display:flex;align-items:center;gap:10px;cursor:pointer}.profile-mini .avatar{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;color:#101820;flex:none}.profile-mini .ptext{min-width:0}.profile-mini b{display:block;font-size:12px;color:#333!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-mini small{display:block;color:#666;font-size:10px}
.page-tools{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}.page-tools .save-page{background:#a31f34;color:#fff;border-color:#a31f34}.page-tools button{border:1px solid #cdd3da;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}.page-tools .delete-page{color:#a31f34}
.profile-pop{position:fixed;inset:0;background:#10182088;display:none;place-items:center;z-index:9999;padding:20px}.profile-pop.open{display:grid}.profile-card{background:#fff;border-radius:16px;width:min(430px,100%);padding:25px;box-shadow:0 20px 70px #0004}.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:12px 0}.emoji-grid button{border:1px solid #dfe3e8;background:#fff;border-radius:9px;font-size:22px;padding:7px;cursor:pointer}.emoji-grid button:hover{border-color:#a31f34}.profile-card input{width:100%;box-sizing:border-box;margin:6px 0 10px;padding:10px;border:1px solid #cdd3da;border-radius:8px}.profile-actions{display:flex;gap:8px;margin-top:10px}.profile-actions button{border:1px solid #cdd3da;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.profile-actions .primary{background:#a31f34;color:#fff;border-color:#a31f34}@media(max-width:720px){.profile-mini{position:fixed}.pencil-tools{position:sticky;bottom:0;background:#f4f5f7;padding:8px 0;z-index:5}}
`;
d.head.appendChild(style);const side=d.querySelector('.side');if(!side)return;if(!d.querySelector('.profile-mini')){const p=d.createElement('div');p.className='profile-mini';p.innerHTML='<div class="avatar" id="miniAvatar">'+(JSON.parse(localStorage.getItem('nese-pro-v1')||'{}').profile?.emoji||'🖤')+'</div><div class="ptext"><b id="miniName">'+(JSON.parse(localStorage.getItem('nese-pro-v1')||'{}').profile?.name||'Nese')+'</b><small>Edit profile</small></div>';p.onclick=()=>openProfile(d,w);side.appendChild(p)}if(!d.querySelector('.profile-pop')){const pop=d.createElement('div');pop.className='profile-pop';pop.id='profilePop';pop.innerHTML='<div class="profile-card"><div class="ey">Personal profile</div><h2>Edit Profile</h2><label>Name</label><input id="profileName"><label>Goal</label><input id="profileGoal"><div class="muted" style="font-size:12px">Choose your profile emoji</div><div class="emoji-grid">'+['🖤','🕷️','🎸','🦇','🕶️','⚡','🌑','🎧','💻','🎨','🪐','🥀','🔥','☠️','🌙','⭐'].map(e=>'<button type="button" data-e="'+e+'">'+e+'</button>').join('')+'</div><div class="profile-actions"><button class="primary" id="profileSave">Save profile</button><button id="profileClose">Cancel</button></div></div>';d.body.appendChild(pop);pop.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{pop.dataset.emoji=b.dataset.e;});pop.querySelector('#profileClose').onclick=()=>pop.classList.remove('open');pop.querySelector('#profileSave').onclick=()=>saveProfile(d,pop)}addPageControls(d,w);enhanceDrawing(w,d)}
function getData(d){let x;try{x=JSON.parse(d.defaultView.localStorage.getItem('nese-pro-v1')||'null')}catch(e){x=null}return x||{profile:{name:'Nese',goal:'MIT Computer Science',emoji:'🖤'}}}function openProfile(d,w){const p=getData(d),pop=d.getElementById('profilePop');pop.querySelector('#profileName').value=p.profile?.name||'Nese';pop.querySelector('#profileGoal').value=p.profile?.goal||'';pop.dataset.emoji=p.profile?.emoji||'🖤';pop.classList.add('open')}function saveProfile(d,pop){const p=getData(d);p.profile=p.profile||{};p.profile.name=pop.querySelector('#profileName').value||'Nese';p.profile.goal=pop.querySelector('#profileGoal').value||'';p.profile.emoji=pop.dataset.emoji||p.profile.emoji||'🖤';d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));const a=d.getElementById('miniAvatar'),n=d.getElementById('miniName');if(a)a.textContent=p.profile.emoji;if(n)n.textContent=p.profile.name;pop.classList.remove('open');d.getElementById('status').textContent='Saved locally'}function addPageControls(d,w){[...d.querySelectorAll('.view')].forEach(v=>{if(v.querySelector('.page-tools'))return;const tools=d.createElement('div');tools.className='page-tools';tools.innerHTML='<button class="save-page">✓ Save page</button><button class="delete-page">⌫ Clear page data</button>';tools.querySelector('.save-page').onclick=()=>{try{w.save()}catch(e){}d.getElementById('status').textContent='Saved locally'};tools.querySelector('.delete-page').onclick=()=>{if(confirm('Clear the saved data for this page? This cannot be undone.'))clearPageData(v.id,w,d)};v.prepend(tools)})}function clearPageData(id,w,d){let p=getData(d);if(id==='academics'){p.notes=[];p.cards=[];p.drawings=[];d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));w.R.academics()}else if(id==='projects'){p.projects=[];d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));w.R.projects()}else if(id==='research'){p.research=[];d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));w.R.research()}else if(id==='home'){p.tasks=[];d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));w.R.home()}else if(id==='calendar'){p.calendar={};d.defaultView.localStorage.setItem('nese-pro-v1',JSON.stringify(p));w.R.calendar()}else if(id==='coding'){d.localStorage.removeItem('coding-progress');w.R.coding()}d.getElementById('status').textContent='Page cleared'}frame.addEventListener('load',()=>{enhance();setTimeout(enhance,300);setTimeout(enhance,1000);setTimeout(()=>{const w=frame.contentWindow;enhanceDrawing(w,w.document)},1400)});
</script></body></html>
