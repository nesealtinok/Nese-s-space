<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body,#f{margin:0;width:100%;height:100%;overflow:hidden}#f{border:0;display:block}</style></head><body><iframe id="f" src="workspace-pro.html"></iframe><script>
const F=document.getElementById('f');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function data(w){try{return JSON.parse(w.localStorage.getItem('nese-notebook-v2')||'null')||{pages:[{name:'Page 1',image:null}],active:0}}catch(e){return{pages:[{name:'Page 1',image:null}],active:0}}}
function saveData(w,x){w.localStorage.setItem('nese-notebook-v2',JSON.stringify(x))}
function install(w,d){if(!w.R||!w.R.academics||w.__nbInstalled)return;w.__nbInstalled=true;const old=w.R.academics;w.R.academics=()=>{old();setTimeout(()=>mount(w,d),30)};mount(w,d)}
function mount(w,d){const a=d.getElementById('academics');if(!a)return;const cards=[...a.querySelectorAll('.card')];const card=cards.find(c=>/Apple Pencil workspace/i.test(c.textContent));if(!card)return;card.innerHTML='<div id="NB"><div class="ey">Personal handwriting notebook</div><h2>nese\'s Notebook</h2><p class="muted">A multi-page Apple Pencil notebook inside Academics.</p><div id="NBR"></div></div>';render(w,d)}
function render(w,d){const r=d.getElementById('NBR');if(!r)return;let x=data(w);if(!x.pages.length)x.pages=[{name:'Page 1',image:null}];x.active=Math.min(x.active,x.pages.length-1);saveData(w,x);if(!r.dataset.open){r.innerHTML='<div class="cover"><div class="coverText">nese\'s<span>notebook</span></div><button id="open" class="coverBtn">Open notebook</button></div>';r.querySelector('#open').onclick=()=>{r.dataset.open=1;render(w,d)};return}
r.innerHTML='<div class="book"><header><div><b>nese\'s notebook</b><small>'+esc(x.pages[x.active].name)+'</small></div><div class="actions"><input id="name" value="'+esc(x.pages[x.active].name)+'"><button id="rename">Rename</button><button id="new" class="primary">＋ New page</button><button id="cover">Cover</button></div></header><nav id="tabs"></nav><main><div class="paper"><canvas id="canvas"></canvas></div><div class="tools"><button class="tool active" data-tool="pen">✎ Pen</button><button class="tool" data-tool="pencil">✏ Pencil</button><button class="tool" data-tool="marker">🖍 Marker</button><button class="tool" data-tool="eraser">⌫ Eraser</button><span>Color</span><button class="color" data-c="#101820" style="background:#101820"></button><button class="color" data-c="#a31f34" style="background:#a31f34"></button><button class="color" data-c="#2563eb" style="background:#2563eb"></button><button class="color" data-c="#16a34a" style="background:#16a34a"></button><button class="color" data-c="#f59e0b" style="background:#f59e0b"></button><button class="color" data-c="#7c3aed" style="background:#7c3aed"></button><span>Size</span><input id="size" type="range" min="1" max="12" value="3"><button class="tool" id="undo">↶ Undo</button><button class="tool" id="redo">↷ Redo</button><button class="tool" id="clear">Clear</button><button class="tool" id="save">✓ Save</button><button class="tool danger" id="del">Delete page</button></div><footer><span id="saved">Auto-saved</span><span>Page '+(x.active+1)+' of '+x.pages.length+'</span></footer></main></div>';
const tabs=d.getElementById('tabs');x.pages.forEach((p,i)=>{const b=d.createElement('button');b.textContent=p.name;b.className=i===x.active?'sel':'';b.onclick=()=>{saveCurrent(w,d);x.active=i;saveData(w,x);render(w,d)};tabs.appendChild(b)});d.getElementById('cover').onclick=()=>{delete r.dataset.open;render(w,d)};d.getElementById('new').onclick=()=>{saveCurrent(w,d);x.pages.push({name:'Page '+(x.pages.length+1),image:null});x.active=x.pages.length-1;saveData(w,x);render(w,d)};d.getElementById('rename').onclick=()=>{const n=d.getElementById('name').value.trim();if(n){x.pages[x.active].name=n;saveData(w,x);render(w,d)}};d.getElementById('del').onclick=()=>{if(x.pages.length<2)return alert('The notebook needs at least one page.');if(confirm('Delete this page?')){x.pages.splice(x.active,1);x.active=Math.max(0,x.active-1);saveData(w,x);render(w,d)}};canvas(w,d,x)}
function canvas(w,d,x){const c=d.getElementById('canvas'),ctx=c.getContext('2d'),z=Math.max(1,Math.min(2.5,w.devicePixelRatio||1));c.width=c.clientWidth*z;c.height=c.clientHeight*z;ctx.scale(z,z);ctx.lineCap='round';ctx.lineJoin='round';const S={tool:'pen',color:'#101820',size:3,down:false,undo:[],redo:[]};const shot=()=>c.toDataURL('image/png');const load=url=>{ctx.clearRect(0,0,c.clientWidth,c.clientHeight);if(!url)return;const im=new Image;im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight);im.src=url};load(x.pages[x.active].image);const persist=()=>{x.pages[x.active].image=shot();saveData(w,x);const s=d.getElementById('saved');if(s)s.textContent='Saved automatically · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};const p=e=>{const q=c.getBoundingClientRect();return{x:e.clientX-q.left,y:e.clientY-q.top}};c.onpointerdown=e=>{S.down=true;S.undo.push(shot());S.redo=[];c.setPointerCapture(e.pointerId);const q=p(e);ctx.beginPath();ctx.moveTo(q.x,q.y)};c.onpointermove=e=>{if(!S.down)return;const q=p(e),pressure=e.pressure>0?e.pressure:.5;ctx.globalCompositeOperation=S.tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=S.color;ctx.globalAlpha=S.tool==='marker'?.28:1;const m=S.tool==='marker'?3.5:S.tool==='pencil'?.65:1;ctx.lineWidth=Math.max(.7,S.size*m*(.65+pressure*.7));ctx.lineTo(q.x,q.y);ctx.stroke()};c.onpointerup=()=>{S.down=false;ctx.globalAlpha=1;ctx.closePath();persist()};c.onpointercancel=()=>S.down=false;
d.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{S.tool=b.dataset.tool;d.querySelectorAll('[data-tool]').forEach(q=>q.classList.remove('active'));b.classList.add('active')});d.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.color=b.dataset.c;S.tool='pen';d.querySelectorAll('[data-tool]').forEach(q=>q.classList.remove('active'));d.querySelector('[data-tool="pen"]').classList.add('active')});d.getElementById('size').oninput=e=>S.size=+e.target.value;d.getElementById('save').onclick=persist;d.getElementById('clear').onclick=()=>{if(confirm('Clear this page?')){S.undo.push(shot());ctx.clearRect(0,0,c.clientWidth,c.clientHeight);persist()}};d.getElementById('undo').onclick=()=>{if(!S.undo.length)return;S.redo.push(shot());load(S.undo.pop())};d.getElementById('redo').onclick=()=>{if(!S.redo.length)return;S.undo.push(shot());load(S.redo.pop())}}
function saveCurrent(w,d){const c=d.getElementById('canvas');if(c){const x=data(w);x.pages[x.active].image=c.toDataURL('image/png');saveData(w,x)}}
F.addEventListener('load',()=>{setTimeout(()=>install(F.contentWindow,F.contentDocument),300);setTimeout(()=>install(F.contentWindow,F.contentDocument),1000)});
</script><style>.cover{width:min(430px,100%);aspect-ratio:3/4;margin:15px auto;background:#f0ece4;border:1px solid #d3cbbf;border-radius:18px;position:relative;overflow:hidden;box-shadow:0 22px 50px #10182025}.cover:before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#111 0 5px,transparent 6px);background-size:45px 45px;background-position:4px 4px}.cover:after{content:'';position:absolute;right:-2px;top:50%;width:125px;height:62px;background:#eee7db;border:1px solid #c9c1b4;border-right:0;border-radius:34px 0 0 34px}.coverText{position:absolute;z-index:2;top:42%;left:10%;right:10%;text-align:center;color:#eee9e0;text-shadow:0 1px 1px #777;font:italic 43px Georgia,serif}.coverText span{display:block;font-size:31px;margin-top:8px}.coverBtn{position:absolute;z-index:3;bottom:28px;left:50%;transform:translateX(-50%);border:0;border-radius:999px;background:#a31f34;color:#fff;padding:12px 24px;font-weight:700}.book{border:1px solid #dfe3e8;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 12px 35px #10182010}.book header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid #e4e7eb;background:#fafafa}.book header small{display:block;color:#697586;margin-top:2px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions input{border:1px solid #ccd2d9;border-radius:7px;padding:7px 9px;width:150px}.actions button,.tool{border:1px solid #ccd2d9;background:#fff;border-radius:8px;padding:7px 10px;cursor:pointer}.actions .primary,.tool.active{background:#a31f34;color:#fff;border-color:#a31f34}.danger{color:#a31f34!important}.book nav{display:flex;gap:6px;overflow:auto;padding:9px 12px;background:#f7f8fa;border-bottom:1px solid #e4e7eb}.book nav button{border:1px solid #d7dce2;background:#fff;border-radius:7px;padding:7px 11px;white-space:nowrap}.book nav button.sel{background:#101820;color:#fff;border-color:#101820}.book main{padding:16px;background:#f0f1f3}.paper{background:#fff;border:1px solid #dfe3e8;border-radius:10px;overflow:hidden}.paper canvas{display:block;width:100%;height:720px;touch-action:none}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 12px;background:#fff;border-top:1px solid #e4e7eb}.color{width:25px;height:25px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c8ced6}.tools input{width:90px}.book footer{display:flex;justify-content:space-between;padding:9px 14px;background:#fafafa;border-top:1px solid #e4e7eb;color:#697586;font-size:11px}@media(max-width:720px){.book header{align-items:flex-start;flex-direction:column}.actions input{width:100%}.paper canvas{height:620px}}</style></body></html>
