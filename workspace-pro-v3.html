<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nese Workspace Pro</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#frame{width:100%;height:100%;border:0}</style></head><body><iframe id="frame" src="workspace-pro-v2.html?v=mit-cover-final"></iframe><button id="toggle" title="Hide sidebar">‹</button><style>#toggle{position:fixed;top:14px;left:258px;z-index:999999;width:36px;height:36px;border:1px solid #cdd3da;border-radius:9px;background:#fff;color:#a31f34;font-size:20px;cursor:pointer;box-shadow:0 4px 14px #10182020}body.hide #toggle{left:14px}body.hide #frame{width:100%}</style><script>const f=document.getElementById('frame'),t=document.getElementById('toggle');let hidden=localStorage.getItem('nese-sidebar-hidden')==='1';function apply(){try{const d=f.contentDocument;const s=d.createElement('style');s.id='v3style';s.textContent=`.side{transition:width .2s,transform .2s}.main{transition:margin .2s,width .2s;max-width:none}.v3-hidden .side{display:none!important}.v3-hidden .main{width:100%!important;max-width:none!important;padding-left:48px;padding-right:48px}.v3-hidden .nb-canvas{height:760px!important}`;d.head.appendChild(s);d.body.classList.toggle('v3-hidden',hidden);const a=d.getElementById('academics');if(a&&a.classList.contains('active')) addSubjects(d);sync()}catch(e){}}function sync(){t.textContent=hidden?'›':'‹';t.title=hidden?'Show sidebar':'Hide sidebar';document.body.classList.toggle('hide',hidden)}t.onclick=()=>{hidden=!hidden;localStorage.setItem('nese-sidebar-hidden',hidden?'1':'0');apply()};function addSubjects(d){if(d.getElementById('v3subjects'))return;const a=d.getElementById('academics');const c=d.createElement('div');c.id='v3subjects';c.className='card s12';c.innerHTML='<div class="ey">Notebook sections</div><h2>Subjects</h2><p class="muted">Choose a subject to start from Page 1.</p><div class="v3grid"></div><div class="v3write"><b id="v3title">Mathematics · Page 1</b><textarea id="v3notes" placeholder="Write your notes here..."></textarea><button id="v3save">✓ Save notes</button></div>';const st=d.createElement('style');st.textContent=`#v3subjects{margin-top:20px}.v3grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.v3sub{border:1px solid #dfe3e8;background:#fff;border-radius:10px;padding:14px;text-align:left;cursor:pointer}.v3sub:hover,.v3sub.active{border-color:#a31f34;background:#a31f340d}.v3sub b{display:block;color:#101820}.v3write{margin-top:15px;border:1px solid #dfe3e8;border-radius:12px;padding:15px;background:#fafafa}.v3write textarea{display:block;width:100%;height:260px;box-sizing:border-box;margin:12px 0;border:1px solid #dfe3e8;border-radius:9px;padding:14px;font:15px/1.6 Arial;resize:vertical}.v3write button{border:1px solid #a31f34;background:#a31f34;color:white;border-radius:8px;padding:9px 13px}@media(max-width:900px){.v3grid{grid-template-columns:repeat(2,1fr)}}`;d.head.appendChild(st);a.appendChild(c);const subjects=['Mathematics','Science','Physics','Chemistry','Biology','Computer Science','English'];let current=localStorage.getItem('v3-subject')||'Mathematics';const grid=c.querySelector('.v3grid'),title=c.querySelector('#v3title'),notes=c.querySelector('#v3notes'),key=s=>'v3-notes-'+s;function render(){grid.innerHTML='';subjects.forEach(s=>{const b=d.createElement('button');b.className='v3sub'+(s===current?' active':'');b.innerHTML='<span style="font-size:20px">'+({'Mathematics':'📐','Science':'🧪','Physics':'⚛️','Chemistry':'⚗️','Biology':'🧬','Computer Science':'💻','English':'📚'}[s])+'</span><b>'+s+'</b><small style="color:#697586">Page 1</small>';b.onclick=()=>{current=s;localStorage.setItem('v3-subject',s);render()};grid.appendChild(b)});title.textContent=current+' · Page 1';notes.value=localStorage.getItem(key(current))||''}c.querySelector('#v3save').onclick=()=>{localStorage.setItem(key(current),notes.value);d.getElementById('status').textContent='Saved locally'};render()}f.addEventListener('load',()=>{setTimeout(apply,500);setTimeout(apply,1500)});</script></body></html>
